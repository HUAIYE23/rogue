/* ---------- 下方：出手顺序 ---------- */
/* 列数跟着槽位数走（--cap 由 JS 给），但每格宽度钉死（--bw），否则第 1 回合
   只有 2 格时会被撑成两块大板子；整体居中，卡的大小才和备战屏一致。 */
.bslots { display: grid; gap: 8px; width: 100%; margin: 0 auto; justify-content: center;
  grid-template-columns: repeat(var(--cap, 6), var(--bw, 118px));
  /* 辅助卡的粒子是绝对定位在 .bslots 里的，必须有定位祖先；
     坐标由 JS 用 getBoundingClientRect 换算，别改成 transform 的百分比。 */
  position: relative; }
.bslots .slot { min-height: 152px; border-style: solid; border-color: #DCD5C5;
  background: #F5F1E6; cursor: default; }
.bslots .slot.act { border-color: #A97517; background: #FBF3E2; transform: translateY(-7px);
  box-shadow: 0 0 0 3px rgba(169, 117, 23, .16), 0 10px 22px rgba(120, 84, 62, .18); }
.bslots .slot.done { opacity: .36; }
.bslots .slot.act .cf { transform: translateY(-2px) scale(1.04); }

/* 辅助卡（追击指令 / 熔合 / 焕生火苗）生效：粒子飞到目标卡面后，那一格亮一下。
   用 outline + 卡面亮度，**不动 box-shadow** —— `.slot.act` 的 shadow 是"正在出手"的
   唯一标识，被这里盖掉的话出手中的卡看起来就像没亮。
   ⚠️ 不留 fill-mode，动画结束要回到各自的常态。 */
@keyframes slotFed {
  0%   { outline-color: rgba(201, 146, 43, .85); }
  100% { outline-color: rgba(201, 146, 43, 0); }
}
@keyframes cfFed {
  0%   { filter: brightness(1.42) saturate(1.25); }
  100% { filter: brightness(1) saturate(1); }
}
.bslots .slot.fed { outline: 2px solid rgba(201, 146, 43, 0); outline-offset: -1px;
  animation: slotFed calc(.24s * var(--spd, 1)) ease-out; }
.bslots .slot.fed .cf { animation: cfFed calc(.24s * var(--spd, 1)) ease-out; }

/* 幻化类开场变身：旧卡面被整张换掉，新卡面从"亮一下 + 轻微翻转"落定。
   ⚠️ 不留 fill-mode（默认 none），动画结束后必须回到 `.cf` 自己的 transform，
      否则 `.slot.act .cf` 的 -2px 抬升会被最后一帧压掉。 */
@keyframes cfMorph {
  0%   { transform: scale(.78) rotate(-7deg); opacity: .1; filter: brightness(2.1); }
  55%  { transform: scale(1.09) rotate(1.5deg); opacity: 1; filter: brightness(1.35); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
}
.cf.morph { animation: cfMorph calc(.46s * var(--spd, 1)) cubic-bezier(.25,1.3,.45,1); }

/* ============================================================
   拖拽：桌面鼠标 / 触屏长按（v0.8.48）
   · 鼠标：按下移动 6px 就开拖（和以前一样）。
   · 触屏：**按住 170ms 不动**才把卡"拿起来" —— 手机上槽位是一条横向滚动条、
     页面还能上下滚，一碰就拖会和"我想滚动"打架；手先动超过 10px 就放弃拖拽、
     让浏览器照常滚。拿起来之后才拦滚动（非 passive 的 touchmove + preventDefault）。
   ⚠️ 所以 `.cf` 上**不要写 touch-action:none** —— 写了以后在卡面上就再也滚不动页面。
   ============================================================ */
.cf { -webkit-touch-callout: none; }   /* 长按别弹"拷贝/存储图像"菜单 */
.cf.src-fade { opacity: .28; }
.cf.ghostcard { position: fixed; left: 0; top: 0; z-index: 60; margin: 0;
  pointer-events: none; transform: rotate(2deg) scale(1.04); transition: none;
  box-shadow: 0 14px 30px rgba(60, 54, 46, .28); }
.slot.hot { border-color: #C08A2A; background: #FBF6EA; border-style: solid; }
.slot.hot.over { border-color: #A97517; background: #F7EBD2;
  box-shadow: 0 0 0 3px rgba(169, 117, 23, .2); }
body.dragging, body.dragging .cf { cursor: grabbing; user-select: none; }
/* 触屏拖拽时，底部抛售条自己会滑上来 + 变红（见 body.dragging .sellzone），
   不需要额外的按钮提示。 */

/* 触屏一次性提示（v0.8.48）：手机上以前只能点选，现在长按也能拖。
   只在触屏设备、只弹一次，点一下或 9 秒后消失，标记写进 localStorage。 */
.dragtip { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
  max-width: 92vw; padding: 9px 14px; border-radius: 12px; z-index: 55;
  background: rgba(59, 52, 42, .93); color: #FBF6E9; font-size: 11.5px; line-height: 1.65;
  box-shadow: 0 8px 22px rgba(60, 54, 46, .28); }
.dragtip b { color: #F2C879; font-weight: 700; }
@media (hover: hover) and (pointer: fine) {
  .hand .cf.pick, .slot .cf.pick { cursor: grab; }
}

/* 窄屏：6 张卡并排会挤成一溜溜小纸条，所以**改成横向滚动**，
   每张卡保持可读的固定宽度（不换行 —— 换行就看不出一排的先后了）。 */
/* 窄屏那套（槽位横向滚动条）只给**真窄屏**：真横屏的小机器，或者鼠标设备拖窄的窗口。
   触屏竖屏要排除掉 —— 那是「假横屏」，排版归上面那条 max-height 的规则管。 */
@media (max-width: 560px) and (orientation: landscape),
       (max-width: 560px) and (pointer: fine) {
  body { padding: 12px 10px 20px; }
  .app { gap: 11px; }

  .slots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  /* 备战槽：手机上是一条横向滚动条，格子宽度写死（112px），
     高度交给上面的 aspect-ratio；卡面的 --u 由 cqi 自动算出来（≈8.5px），
     所以这里**不再写 `.slot .cf { --u }`** —— 写了也会被 cqi 那条盖掉。 */
  .slot { flex: 0 0 112px; border-radius: 10px; }
  .slot.lock::after, .slot.empty::after { font-size: 8.5px; }
  .slot .slotno { font-size: 8px; right: 3px; bottom: 2px; }

  .hand { gap: 7px; }
  .hand .cf { --u: 9.4px; }

  .rp { font-size: 11.5px; padding: 5px 9px 6px; }
  .rp b { font-size: 15px; }
  .sbox { min-width: 56px; padding: 4px 8px 5px; }
  .sbox span { font-size: 15px; }
  .hint { display: none; }
  .pfoot #btn-shop, .pfoot #btn-prep { min-width: 82px; padding: 10px 12px; }
  .pfoot #btn-sell { min-width: 64px; padding: 10px 10px; }
  .pfoot #btn-fight { min-width: 128px; padding: 11px 18px; font-size: 14px; letter-spacing: .08em; }

  /* 出战屏 */
  #b-score { font-size: 22px; }
  .arena { min-height: 216px; padding: 12px 12px 10px; }
  .hero .fig { width: 62px; }
  .mob .fig { width: 78px; }
  .mob.is-boss .fig { width: 88px; }
  .mid { flex: 0 0 92px; padding-bottom: 14px; }
  .hitnum { font-size: 32px; }
  .hitlab, .hitsub { font-size: 10px; }
  .bslots { --bw: 92px; gap: 6px; }
  .bslots .cf { --u: 6.8px; }
  .bslots .slot { min-height: 118px; }

  /* 三个货格挤一行：把卡压窄、内边距收掉，别让格子变成一根竖条 */
  .bay { gap: 7px; }
  .baycell { padding: 10px 7px; min-height: 0; gap: 8px; border-radius: 10px; }
  .baycell .cf { --u: 8.4px; }
  .baycell .buy { padding: 8px 4px; font-size: 11px; }
  /* 手机货格只有 ~100px 宽、上内边距 10px：小标压小一号、再往上提 1px，
     免得盖住卡面顶上的伤害数字（-7 + 15.7 ≈ 8.7 < 11 就到不了卡面）。 */
  .baymerge { top: -7px; font-size: 9px; padding: 1px 6px; letter-spacing: .04em; }
  .reroll button { padding: 4px 9px; font-size: 10.5px; }
  .rcost { font-size: 10px; }
}

/* ============================================================
   实验室面板（只在 ?lab=1 时出现，正常玩一行都不生效）
   ————————————————————————————————————————————
   ⚠️ 这里**不允许出现任何伤害 / 连击 / 条件判断**。
      面板只干两件事：造牌（addCard）、把 resolve() 的结果摆出来。
      一旦在面板里自己算一遍，实验室和实战就会分叉，测出来的东西是假的。
   ============================================================ */
body.lab-on { padding-right: 360px; }
#labp { position: fixed; right: 0; top: 0; bottom: 0; width: 344px; z-index: 30;
  display: none; flex-direction: column;
  background: #FBF9F4; border-left: 1px solid #E2DCCC;
  box-shadow: -12px 0 30px rgba(90, 78, 60, .08); }
#labp.on { display: flex; }
/* 收起 = 缩成右下角一个胶囊。⚠️ 不能 display:none —— 那之后就没有任何入口
   能把它叫回来了（只能刷新页面）。胶囊里留着"展开 / 退出"。 */
#labp.on.shut { right: 14px; top: auto; bottom: 14px; width: auto; max-width: 260px;
  border: 1px solid #DCD5C4; border-radius: 11px; overflow: hidden;
  box-shadow: 0 8px 22px rgba(90, 78, 60, .16); }
#labp.on.shut .lbody { display: none; }
#labp.on.shut .lhd { padding: 6px 9px; border-bottom: none; background: #FBF9F4; }
#labp.on.shut .lhd b { display: none; }
#labp .lhd { flex: none; display: flex; align-items: center; gap: 7px;
  padding: 10px 12px; background: #F6F1E4; border-bottom: 1px solid #EDE7D9; }
#labp .lhd b { font-size: 12.5px; color: #4E473F; letter-spacing: .06em; }
#labp .lhd .tag { font-size: 9px; font-weight: 700; letter-spacing: .14em;
  color: #8F6310; background: #F3E4BE; border-radius: 4px; padding: 1.5px 5px 2px; }
#labp .lhd .lbtns { margin-left: auto; display: flex; gap: 4px; }
#labp .lstrip { flex: none; display: flex; align-items: baseline; gap: 6px;
  padding: 5px 12px 6px; background: #F1EADA; border-bottom: 1px solid #E7DFCC; }
#labp .lstrip b { font-size: 15px; font-weight: 800; color: #A8492A;
  font-variant-numeric: tabular-nums; }
#labp .lstrip span { font-size: 10px; color: #8E8578; }
#labp .lstrip i { font-style: normal; font-size: 10px; color: #8E8578; }
#labp .lstrip i:first-of-type { margin-left: auto; }
#labp.on.shut .lstrip { display: none; }
#labp .lbody { flex: 1; overflow-y: auto; padding: 10px 12px 34px; }
#labp .lsec { display: flex; align-items: baseline; gap: 6px;
  margin: 13px 0 6px; font-size: 10.5px; letter-spacing: .1em; color: #8E8578; }
#labp .lsec:first-child { margin-top: 1px; }
#labp .lsec i { font-style: normal; font-size: 10px; letter-spacing: 0; color: #B4AFA3; }
#labp .lrow { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
#labp .lk { font-size: 11px; color: #8E8578; min-width: 26px; }
#labp .lv { font-size: 13px; font-weight: 700; color: #A97517;
  font-variant-numeric: tabular-nums; min-width: 24px; }
#labp button { font-size: 10.5px; padding: 4px 8px; border-radius: 7px; }
#labp button.on { background: #7A6F5E; border-color: #7A6F5E; color: #FBF6E9; }

/* 卡池：两列，组名横跨整行 */
#labp .lpool { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
#labp .lgrp { grid-column: 1 / -1; margin: 6px 0 2px; font-size: 10px;
  letter-spacing: .1em; color: #A09C92; }
#labp .lcard { display: flex; align-items: center; gap: 2px; min-width: 0;
  padding: 2px 3px 2px 6px; border: 1px solid #E7E1D3; border-radius: 6px;
  background: #FFFDF8; }
#labp .lcard .nm { flex: 1; min-width: 0; font-size: 11px; color: #5C544C;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
#labp .lcard .nm:hover { color: #8F6310; }
#labp .lcard .st { flex: none; width: 15px; text-align: center; font-size: 9px;
  line-height: 1.5; padding: 0; border-radius: 4px; color: #A09C92;
  border: 1px solid #E7E1D3; background: #F6F1E4; cursor: pointer; }
#labp .lcard .st:hover { background: #F3E4BE; color: #8F6310; border-color: #E3C98B; }
/* 四星那个小按钮：金底，和 1/2/3 分开（只有 maxLv:4 的卡才出现） */
#labp .lcard .st.st4 { color: #FFF9EC; background: #C79A2E; border-color: #B0861F; font-weight: 700; }
#labp .lcard .st.st4:hover { background: #B0861F; color: #FFF9EC; }
#labp .lcard[data-q="gray"]   { border-left: 3px solid #CEC6B6; }
#labp .lcard[data-q="blue"]   { border-left: 3px solid #B6CCE6; }
#labp .lcard[data-q="purple"] { border-left: 3px solid #C4B9E4; }
#labp .lcard[data-q="gold"]   { border-left: 3px solid #DCC28C; }

/* 干跑预览：一行一张牌 */
#labp .lprev { border: 1px solid #EDE7D9; border-radius: 8px;
  background: #FFFDF8; overflow: hidden; }
#labp .lprev .pl { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap;
  padding: 4px 7px; border-bottom: 1px solid #F4EFE3; font-size: 11px; }
#labp .lprev .pl .no { flex: none; width: 10px; font-size: 9px; color: #C2BCAE; }
#labp .lprev .pl .n { flex: 1; min-width: 0; color: #5C544C;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#labp .lprev .pl .d { flex: none; font-weight: 700; color: #A8492A;
  font-variant-numeric: tabular-nums; }
#labp .lprev .pl .d.zero { font-weight: 500; color: #C2BCAE; }
#labp .lprev .pl.dead .n { color: #B9B3A6; text-decoration: line-through; }
#labp .lprev .pl .nt { flex: 0 0 100%; padding-left: 14px; font-size: 9.5px; color: #A09C92; }
#labp .lprev .pl .up { flex: none; width: 15px; text-align: center; font-size: 9px;
  padding: 0; border-radius: 4px; color: #8E8578; border: 1px solid #E7E1D3;
  background: #F6F1E4; cursor: pointer; }
#labp .lprev .pl .up:hover { background: #F3E4BE; color: #8F6310; }
#labp .lprev .empty { padding: 14px 10px; font-size: 11px; color: #B4AFA3; }
#labp .lsum { display: flex; align-items: baseline; gap: 7px; padding: 7px 8px 6px; }
#labp .lsum b { font-size: 17px; font-weight: 800; color: #A8492A;
  font-variant-numeric: tabular-nums; }
#labp .lsum span { font-size: 10.5px; color: #8E8578; }
#labp .lsum.sm { padding-top: 0; border-top: 1px dashed #EDE7D9; }
#labp .lsum.sm span { font-size: 10px; color: #A09C92; }
#labp .lmsg { min-height: 15px; margin-top: 4px; font-size: 10.5px; color: #A97517;
  opacity: 0; transition: opacity .18s; }
#labp .lmsg.on { opacity: 1; }

/* 窄屏：面板改全屏抽屉，主界面让位没意义（会被完全盖住），关掉整个 padding */
@media (max-width: 1000px) {
  body.lab-on { padding-right: 16px; }
  #labp { width: 100%; }
  /* 手机上收起后的胶囊别压住右下角的「出战」 */
  #labp.on.shut { bottom: 84px; }
}

/* ============================================================
   手机横屏（v0.8.49）
   ————————————————————————————————————————————
   ① 手机按**横屏**设计：竖屏时整页盖一层「请横屏游玩」，
      不给玩家一个挤成一条的备战页（转过来就好，不用猜哪里能点）。
   ② 横屏手机的高度只有 360~430px，桌面那套间距会把底栏顶出屏幕。
      这里压的是"框"（外边距 / 进度条下沿 / 按钮高度），卡面尺寸由 --u 和容器宽度
      自己算 —— 收紧 .app 的 max-width 等于把卡一起缩小，所以出战顺序仍是 6 列、不横滚。
   ============================================================ */
#rotate { display: none; }
body.portrait-touch #rotate {
  display: flex; position: fixed; inset: 0; z-index: 400;
  flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: #F4F0E6; color: #4E473F; text-align: center; padding: 24px;
}
#rotate .ph { width: 52px; height: 88px; border: 3px solid #A97517; border-radius: 10px;
  position: relative; animation: rotHint 2.2s ease-in-out infinite; }
#rotate .ph::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 3px;
  margin-left: -7px; border-radius: 2px; background: #A97517; opacity: .6; }
@keyframes rotHint { 0%, 26% { transform: rotate(0deg); } 62%, 100% { transform: rotate(-90deg); } }
#rotate b { font-size: 17px; letter-spacing: .04em; }
#rotate span { font-size: 12.5px; line-height: 1.75; color: #8E8578; }

/* 手机横屏的排版：真横屏，或者竖屏浏览器被强制旋转后的「假横屏」（见文件末尾 body.land-forced）。
   两边几何完全一样（宽高互换 + 同样的 body padding），所以一套规则够用。 */
@media (pointer: coarse) and (max-height: 520px), (pointer: coarse) and (orientation: portrait) {
  /* 底栏那一排按钮压薄一点 */
  body { padding: 6px 8px 6px; }
  .app { gap: 7px; }
  .ptop { gap: 8px; }
  .rp { padding: 3px 9px 4px; font-size: 11.5px; }
  .rp b { font-size: 15px; }
  .sbox { min-width: 52px; padding: 3px 8px 4px; }
  .sbox b { font-size: 8px; }
  .sbox span { font-size: 14px; }
  .qbtn { padding: 4px 9px; font-size: 11px; }
  .lab { margin-bottom: 3px; font-size: 10.5px; }
  .slots { gap: 6px; }
  .pfoot { gap: 8px; }
  .pfoot button { padding: 7px 13px; font-size: 12px; }
  .pfoot #btn-shop, .pfoot #btn-prep { min-width: 88px; padding: 7px 13px; }
  .pfoot #btn-fight { min-width: 168px; padding: 8px 24px; font-size: 13.5px; }
  .hint { display: none; }

  /* 备战页 = 一屏：顶栏 / 手牌 / 出战顺序 / 底栏 四块，
     只有**手牌那一节**可以伸缩并自己滚 —— 这样卡面能拿满宽度（不会被压成看不清的小卡），
     也不会因为手牌多就把「出战」顶出屏幕。 */
  body:not(.battle):not(.shop) { height: 100dvh; overflow: hidden; }
  body:not(.battle):not(.shop) .app { height: 100%; max-width: 720px; gap: 7px; }
  body:not(.battle):not(.shop) .app > * { flex: 0 0 auto; min-height: 0; }
  body:not(.battle):not(.shop) .psec-hand { flex: 1 1 auto; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden; }
  body:not(.battle):not(.shop) .psec-hand .hand { flex: 1 1 auto; min-height: 0;
    flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; align-items: center;
    -webkit-overflow-scrolling: touch; }
  body:not(.battle):not(.shop) .psec-slots { flex: 0 0 auto; }
  /* 出战屏：高度就那么点，让演出席吃掉剩余高度、出手顺序固定一小条。
     ⚠️ v0.8.55 修的是"出手顺序看着怪"：每一列原来钉死 118px 宽（`--bw` 的默认值），
        卡面却只有 77 —— 每格左右各空 20px，看着就是"卡飘在一个比它大一圈的框里"。
        现在列宽 `auto`（列宽 = 卡宽 + 边框，格子正好裹住卡），
        卡面大小反过来由**战斗页高度**算（容器查询 cqh）：
        360 / 390 / 430 三种高度下演出席都稳定在 ~95px，多出来的高度全给卡。
     ⚠️ `container-type: size` 要求 #scr-battle 有确定高度 —— 它有 `height: 100%`，
        所以没问题；但别再给它改成 auto 高度，否则 cqh 退化成 0、卡面直接消失。 */
  body.battle { height: 100dvh; overflow: hidden; }
  body.battle .app { height: 100%; gap: 5px; }
  body.battle .app > * { flex: 0 0 auto; min-height: 0; }
  body.battle #scr-battle { container-type: size; }
  body.battle .arena { flex: 1 1 auto; min-height: 96px; padding: 6px 10px 4px; }
  body.battle .prog { gap: 5px; }
  body.battle #b-score { font-size: 21px; }
  body.battle .pbar { height: 10px; margin-bottom: 15px; }
  body.battle .pbar > em > span { display: none; }   /* "+N 币"那行横屏没地方，三档分数线留着 */
  body.battle .pbar > em > b { top: 15px; font-size: 9.5px; }
  body.battle .hero .fig { width: 58px; }
  body.battle .mob .fig { width: 70px; }
  body.battle .mob.is-boss .fig { width: 78px; }
  body.battle .hitnum { font-size: 26px; }
  /* 演出席只有 ~96px 高：中间那列（.mid）原来是给桌面留的间距，手机上会顶出上边被裁 */
  body.battle .mid { padding: 0 4px 8px; gap: 3px; }
  body.battle .hitlab, body.battle .hitsub { font-size: 10.5px; line-height: 1.3; }
  body.battle .hitlab { min-height: 1.3em; }
  /* ⚠️ 槽里的卡是 `.slot .cf { position: absolute; inset: 5px }` —— 它**不参与布局**，
     所以格子撑不开，尺寸只能反过来算：先定卡面 `--bu`，格子 = 卡 + 左右/上下各 5px。
     （想把格子改成 auto 让它自己裹住卡是不行的：那样格子没有内容，直接塌成 2px。）*/
  body.battle .bslots {
    /* 兜底：不认识 cq 单位的机器按 6.4px 走（和以前一样大，只是框变准了） */
    --bu: 6.4px;
    /* 宽：6 张卡 + 5 个 6px 间隙 + 每格左右各 5px → (cqi - 90) / 72
       高：整页减掉 顶栏/进度条/出手顺序标题/底栏/间距，再留 92px 给演出席 → 268px */
    /* 封顶 8.2px：更高的机器（430）多出来的高度给演出席，别让卡一路涨 */
    --bu: min(calc((100cqi - 90px) / 72), calc((100cqh - 270px) / 16), 8.2px);
    --bw: calc(var(--bu) * 12 + 10px);   /* 列宽 = 卡宽 + 左右各 5px，框正好裹住卡 */
    gap: 6px;
  }
  body.battle .bslots .slot { min-height: calc(var(--bu) * 16 + 10px); padding: 0; }
  body.battle .bslots .cf { --u: var(--bu); }   /* 压掉写死的 9px / 6.4px */
  /* 序号藏掉：框现在紧贴卡面，压在卡角上会盖住"攻击/通用"那一行；
     出手顺序本来就靠"从左到右"读，旁边那行标题已经写了。 */
  body.battle .bslots .slotno { display: none; }
  body.battle .bfoot button { padding: 6px 12px; font-size: 12px; }
  /* 商店页：三格货架 + 底栏，同样压到一屏。
     ⚠️ v0.8.54 修的是两件事：
        ① 货架那节在 DOM 里是 `<section>`（不像备战页的 `.psec-hand` 有类名），
           它一直是 `flex: 0 0 auto` —— 所以 `.bay` 上的 `flex: 1 1 auto` **完全不生效**，
           底栏被顶到中间、下面空一大片。现在让 section 自己 grow，货架才算真正撑满。
        ② 卡面原来写死 `--u: 5.6px`（67×90）。现在按**格子的高**算（`cqh`），
           宽度也夹一刀（`cqi`），格子变多宽多高卡就多大。 */
  body.shop { height: 100dvh; overflow: hidden; }
  body.shop .app { height: 100%; max-width: 720px; gap: 6px; }
  body.shop .app > * { flex: 0 0 auto; min-height: 0; }
  body.shop #scr-shop > section { flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; }
  body.shop #scr-shop > section .lab { flex: none; margin-bottom: 5px; }
  /* 一个 grid 行，1fr = 吃掉货架剩余高度（格子必须定高，下面的 cqh 才有意义） */
  body.shop .bay { flex: 1 1 auto; min-height: 0; overflow: hidden;
    grid-auto-rows: 1fr; gap: 10px; }
  body.shop .baycell {
    /* 兜底：不支持容器查询单位的机器按 13px 走（≈156×208，已经是原来的 2.4 倍） */
    --cellu: 13px;
    container-type: size;      /* 让 cqi/cqh 以这个格子为基准 */
    padding: 8px 9px; gap: 6px; min-height: 0; }
  /* 44px 留给「买下」按钮 + 间隙；不支持的浏览器会自动丢掉这条，用上面的兜底 */
  body.shop .baycell { --cellu: min(calc(100cqi / 12), calc((100cqh - 44px) / 16)); }
  body.shop .baycell .cf { --u: var(--cellu); }   /* 压掉第 284 行写死的 13.6px */
  body.shop .baycell .buy { max-width: none; width: calc(var(--cellu) * 12);
    padding: 5px 4px; font-size: 11.5px; }
  /* 顶栏原来右侧是竖排（金币 + 刷新），白占 74px 高；横屏改成一行，把高度让给货架 */
  body.shop .pright { flex-direction: row; align-items: center; gap: 8px; }
  body.shop .reroll button { padding: 4px 9px; font-size: 11px; }
  /* 手牌区从"一行一张大卡"变成"一排小卡"，横屏才排得下 */
  .hand { gap: 6px; }
  .hand .cf { --u: 5.8px; }   /* 手牌只当缩略图用：能认出是哪张、拖得动就够，细节看出战卡 */
}
/* 特别矮（<390px，比如 5.5 寸安卓横屏）：卡再小一档，保证底栏露出来 */
/* 特别矮（视口短边 < 400）再挤一档；竖屏时短边是**宽度**，所以看 max-width */
@media (pointer: coarse) and (max-height: 400px),
       (pointer: coarse) and (orientation: portrait) and (max-width: 420px) {
  .hand .cf { --u: 5.4px; }
  body:not(.battle):not(.shop) .app { max-width: 640px; gap: 6px; }
  /* 360 高的老机器再挤一点：底部留白和按钮高度各让 2px，手牌才不会被切 */
  body { padding: 4px 8px 4px; }
  .pfoot button { padding: 6px 12px; }
  .pfoot #btn-fight { padding: 7px 22px; }
  .psec-hand { min-height: 66px; }
}
/* ============================================================
   假横屏（v0.8.50）：有些浏览器 / WebView 锁死竖屏，转不过来
   ————————————————————————————————————————————
   规矩：竖屏先盖 3 秒「请横屏游玩」；3 秒一到**不管能不能转**都把内容按横屏显示 ——
   把整个 <body> 旋转 90°、宽高互换，玩家自己把手机横过来看。
   ① 转 body 而不是 .app：body 有 transform 之后就成了 position:fixed 后代的包含块，
      事件面板 / 图鉴 / 出售条 / 教程气泡会自动跟着一起转，不用逐个搬。
   ② 旋转后 getBoundingClientRect / elementFromPoint 仍给**视口坐标**，而 JS 写的
      left/top 是 **body 本地坐标** → 那几处必须过一次 toLocal()（见 updateOrientation 那节）。
   ③ 想反方向就改成 rotate(-90deg)，同时把 JS 里 toLocal 的符号一起翻。
   ④ 几何是真横屏的**镜像**（844×390 ↔ 390×844 互换 + 同样的 body padding），
      所以上面那套横屏规则一行都不用重写。
   ============================================================ */
body.land-forced,
body.land-forced:not(.battle):not(.shop),
body.land-forced.battle,
body.land-forced.shop {
  position: fixed; left: 50%; top: 50%; margin: 0;
  /* ⚠️ 别用 100dvh/100dvw 兜底：某些内核把 dv* 按"设备长边"算，竖屏下 100dvw 会解析成 844，
     舞台直接变正方形。这里只是**兜底**，真正的尺寸由 JS 按 innerWidth/innerHeight 写 inline。 */
  width: 100vh;                     /* 视口长边 → 旋转后的宽 */
  height: 100vw;                    /* 视口短边 → 旋转后的高 */
  transform: translate(-50%, -50%) rotate(90deg);
  transform-origin: 50% 50%;
  overflow: hidden;
  /* ⚠️ 必须压掉 html,body 那句 min-height:100% —— 它按 html 的高度算，
     会把舞台撑回竖屏高度（表现为内容被拉成正方形、底栏飘到屏幕外）。 */
  min-height: 0;
}
body.land-forced #rotate { display: none; }
/* 舞台是"横过来的视口"（844×390），而 vh 算的是竖屏高度（844）—— 按 vh 限高的面板会高到出屏
   （图鉴的关闭按钮会被顶到屏幕外）。这几条把"按视口高"的量换成"按舞台高"。 */
body.land-forced .panel { max-height: 88%; }
body.land-forced .cdxpanel { max-height: 88%; }
body.land-forced #scr-battle { min-height: 0; }
/* ============================================================
   手牌「点开看完整卡面」（v0.8.51）
   ————————————————————————————————————————————
   手机上（横屏那套排版）手牌只有 70×93，塞描述等于看不清。所以：
     ① 手牌一律用**紧凑卡面**（`.cf.tight`：只要 数字/星/图形/卡名/类型，和出战顺序那排一样）；
     ② 点中一张手牌 = 选中，同时把它**就地放大**成完整卡面浮在上面（这一层）。
   ⚠️ `pointer-events:none` 是必须的：它盖住的槽位要能直接点，
      否则"点卡 → 点槽位放入"这条主动线就断了。
   ⚠️ z-index 要**低于** `.mask`(20)：事件面板/弹窗开着时不能浮在它们上面。
   ⚠️ 位置由 JS 按 localRect() 算（假横屏时还要过 toLocal），别写死居中 ——
      居中会正好压住中间两个槽位，虽然点得到但看不见。
   ============================================================ */
.peek { position: fixed; left: 0; top: 0; display: none; z-index: 18;
  pointer-events: none; filter: drop-shadow(0 12px 26px rgba(60, 54, 46, .32)); }
.peek.on { display: block; }
.peek .cf { --u: 11px; animation: peekIn .13s ease-out; }
/* ⚠️ 点开的那张卡上的名词（谢幕/开幕/蓄能）要能点着看解释：
   父层是 pointer-events:none（不能挡住下面的槽位），子元素用 auto **可以**单独放开。
   不写这条的话点名词会"穿透"到下面那张紧凑卡上 —— 而紧凑卡的描述是 display:none，
   那里根本没有 .kw 可命中，表现就是"点了词没反应、还把卡取消选中了"。 */
.peek .kw { pointer-events: auto; }
@keyframes peekIn { from { transform: scale(.84); opacity: .25; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<script>
(function () {
  'use strict';

  /* ============================================================
     一、常量：卡牌 / 回合 / 规则
     ============================================================ */

  var MAX_SLOT = 6;          /* 卡槽上限 */
  var TOTAL_ROUNDS = 9;      /* 总回合数 */
  /* ⚠️ 废弃：商店以前按这个日程表开放，现在由**回合事件**决定（见 EVENTS / ROUND_EVENTS）。
     常量只为 `__cards.isShopRound` 这个旧钩子留着，别再用它判断能不能进商店。 */
  var SHOP_ROUNDS = [2, 4, 6, 8];
  /* ---------- 演出节奏：**只改 SPEED 这一处** ----------
     SPEED = 1 是原始的 420ms/张（快得像快进）。2.5 = 每张牌约 1.05 秒。
     用户 2026-10-26 实装攻击三套动作时定成 **3.5**（一张牌约 1.47 秒，慢慢看）。
     单张的飘字 / 冲击圈 / 弹数字靠 CSS 的 --spd 跟着同一倍率拉长，
     所以改这里就够，别在别处写死毫秒数。 */
  var SPEED = 3.0;   /* v0.8.47：新演出按 3× 实装（样张节奏滑杆的 3.0 档）。改这一个数就整体快慢 */
  var ANIM = Math.round(420 * SPEED);    /* 每张卡的演出间隔（ms） */
  var LEAD = Math.round(760 * SPEED);    /* 切到出战屏后，先让玩家看一眼靶场再开打 */
  var MORPH = Math.round(560 * SPEED);   /* 幻化类开场变身：亮一下再变成目标卡 */
  var TAIL = Math.round(320 * SPEED);    /* "本回合结束"到结果面板之间的停顿 */
  var FLY  = Math.round(900 * SPEED);    /* 槽位上飘字的存活时间 */
  var FLY_HIT = Math.round(520 * SPEED); /* 怪物身上伤害跳字的存活时间（CSS 是 .5s × --spd） */
  /* ---------- 攻击动作的时间锚点（和 CSS 关键帧一一对应，**改一个必须改另一个**） ----------
     HIT_AT  = 42%：普通动作（下劈 / 横扫）刀落到身上的那一帧
     HIT_AT3 = 50%：穿刺是慢放的单独时间表，命中帧更靠后
     PIERCE  = 620×spd：穿刺整段比一张牌长（1.55×），它是收尾牌，后面没有牌了才敢拖长 */
  var HIT_AT  = 0.42;
  var HIT_AT3 = 0.50;
  var PIERCE  = Math.round(620 * SPEED);
  /* 破防处决（第二个终结技，v0.8.47）：整段 980×spd（2.45× 一张牌），
     命中帧在 70% —— 盾裂开、剑穿过去的那一帧（50% 只是"被挡住"，只震屏不出数字）。 */
  var HIT_AT4 = 0.70;
  var FIN     = Math.round(980 * SPEED);
  var MAX_LV = 4;            /* **全局**上限；单卡能不能到 4 星看它自己的 maxLv（maxLvOf） */
  /* 辅助卡粒子的颜色：按**施法那张卡自己的品质**取（不是目标的），
     这样玩家一眼能看出"这串光是哪张牌放出来的"。 */
  var QBUF = { gray: '#9C9482', blue: '#5C8FC4', purple: '#8A6BC0', gold: '#C9922B' };
  /* 蓄能层数上限（2026-10-26 用户先定 999，当天又提到 9999）。
     ⚠️ 所有"加蓄能"的地方都必须走 addCharge()，**别直接写 `S.charge += n`** ——
        入口现在有两个（卖积蓄卡、实验室面板），以后只会更多，漏一个就能越界。
        层数本身不封顶体现在别处：`chargeBonus()` = floor(charge/10)，9999 层 = +999 连击。
     改这个数字只影响三处显示（增益提示、出售区报价、实验室「拉满」），
     它们全都引用 MAX_CHARGE，**别在别处硬写 999 / 9999**。 */

     二、纯逻辑：结算

  /* 输入出战顺序，输出战斗日志。

     ⚠️ 跟旧版最大的区别：**没有血量上限**。每一击的伤害原样累加成分数，

     ⚠️ 得到的卡（开幕式/谢幕式获得）不打进当前这场：放进返回值 gain，

  /* ---------- 单张卡的加伤计算（**唯一实现**） ----------

     两个调用方，必须共用这一份：
       ① resolve() 主循环 —— 传真实状态，结算真伤害
       ② playback() 演出层 —— 传日志里的 snap 快照，算"还没出手的卡**此刻**值多少"

    /* 追击指令：加到**每一击**上（不是总伤害） */
    if (st.atkAdd > 0) { o.per += st.atkAdd; o.parts.push('追击 +' + st.atkAdd); }

    }

    var ma = st.minorAdds && st.minorAdds[c.minor];

    /* 承接上一张传过来的伤害（蓄能糖弹）。**不算连击**，只是每击变大。

    if (c.selfPct) {

    if (st.pctBoost && st.pctBoost.mul > 1 && c.minor === st.pctBoost.minor) {
      o.per = o.per * st.pctBoost.mul;
      o.parts.push('盛宴 ×' + (Math.round(st.pctBoost.mul * 100) / 100));
    }

    /* 燎原之火：按"本回合此前打出过的张数"给**百分比**加成（所有加法之后） */
    if (c.flameGrow) {
      var fp = c.flameGrow[dataIdx(lv)];
      if (fp === undefined) fp = c.flameGrow[0];

                ? '变成「' + pc.name + '」（这张牌战斗里什么都不做）'
                : '变成「' + pc.name + '」');
            id = tgt.id; lv = plv; c = pc;
          }
        }

        /* 到这一步才真正知道"这一格是哪张卡、几星"（幻化可能刚把它换掉）→ 现在定放几遍。
           普通四星 = 2 遍；special（升值打击 / 幻化复刻）= 1 遍；
           4★ 幻化变成 4★ 无尽火力 → 这里会给 2，于是下面真的再打一遍。 */
        reps = repsOf(lv, c);
        /* 【我的回合】攒下的额外释放次数：只在**辅助卡**上生效，这一格一次性用掉。
           ⚠️ 必须写在 `reps = repsOf(...)` **之后**：每遍都会重算 reps，写在前面会被覆盖。
           ⚠️ 4★ 的"额外释放一次"已经算在 repsOf 里了，这里的加成是**在它之上再叠**，
              多张【我的回合】叠起来是乘法（每张 4★ 自己打两遍，各给 +N）。 */
        if (bonusReps < 0) {
          bonusReps = 0;
          if (buffReps > 0) {
            if (c.major === '辅助') { bonusReps = buffReps; buffReps = 0; }
            else {
              /* 下一张不是辅助卡 → 加成作废（但别静默，玩家会当 bug） */
              buffReps = 0; dead = true;
              put('「我的回合」没生效：下一张不是辅助卡牌');
            }
          }
        }
        reps += bonusReps;

        /* ---------- 力量（基米流派，v0.8.59）----------
           放在这里 = 排在所有"给别的牌加东西"之前、也排在 `if (c.dmg)` 之前，于是：
             · 攻击牌那几条（利爪 / 特调 / 巨人）先涨力量、**再算自己的伤害** —— 自己也吃到；
             · 辅助牌（力的递增 / 老吴 / 魔法基）在这一步就生效，影响它后面的牌。
           ⚠️ 力量是累加器：涨了就一直在（本回合内），不会因为换了一张牌就重置。 */
        if (c.powerAdd) {
          var paN = c.powerAdd[dataIdx(lv)];
          if (paN === undefined) paN = c.powerAdd[0];
          kind = 'buff'; pwOut = applyPower('力量', paN, false);
        }
        if (c.openPowerAdd) {
          var opN = c.openPowerAdd[dataIdx(lv)];
          if (opN === undefined) opN = c.openPowerAdd[0];
          if (i === firstReal) {
            kind = 'buff'; pwOut = applyPower('「开幕」：力量', opN, false);
          } else { dead = true; put('「开幕」没生效：这张牌不在最左'); }
        }
        if (c.powerKeepAdd) {
          var pkN = c.powerKeepAdd[dataIdx(lv)];
          if (pkN === undefined) pkN = c.powerKeepAdd[0];
          kind = 'buff'; pwOut = applyPower('力量永久', pkN, true);
        }
        if (c.powerPct) {
          var ppPct = c.powerPct[dataIdx(lv)];
          if (ppPct === undefined) ppPct = c.powerPct[0];
          /* 0 力量 = 真的没东西可乘；到顶 = 封顶。两种要分开报。 */
          if (power <= 0) { dead = true; put('当前没有力量，加成为 0'); }
          else {
            kind = 'buff';
            /* 传**浮点**进去：取整交给 gainPower 末尾那一次（别在这里 round） */
            pwOut = applyPower('力量 +' + ppPct + '%', power * ppPct / 100, false);
            /* 这张牌只会涨力量：封顶后一点没涨 = 这次真的空过 */
            if (!pwOut) dead = true;
          }
        }
        if (c.powerExtraPct) {
          var peN = c.powerExtraPct[dataIdx(lv)];
          if (peN === undefined) peN = c.powerExtraPct[0];
          /* 「开幕」：站最左时倍率换成更高那档（用户 2026-10-28 定：只改倍率，不叠加） */
          if (i === firstReal && c.powerExtraOpenPct) {
            var peO = c.powerExtraOpenPct[dataIdx(lv)];
            if (peO === undefined) peO = c.powerExtraOpenPct[0];
            peN = peO;
          }
          /* 四星放两遍：**累加**（赋值会让第二遍整个白放，等于四星没用）。
             两份魔法基同理。 */
          powerExtra += peN;
          kind = 'buff';
          put('此后获得力量 +' + peN + '%');
        }
        if (c.powerWarn) {
          var wn = c.powerWarn[dataIdx(lv)];
          if (wn === undefined) wn = c.powerWarn[0];
          powerWarn += wn;
          kind = 'buff';
          put('此后每张攻击牌攻击前 力量 +' + wn);
        }
        /* 老吴给的那一份：按当前魔法基倍率折算。**它自己也吃**（"所有攻击卡牌"包含第一张），
           所以交给 hitCalc 一起加进 per —— 预览那边也走同一个入口，不会两边不一致。 */
        var warnEach = powerWarn > 0 ? Math.round(powerWarn * (1 + powerExtra / 100)) : 0;
        var warnGain = c.dmg ? warnEach : 0;
        /* 力量已经到顶：老吴这份既不该再加伤害，也不该再涨力量 —— 按余量夹一次。 */
        var powerRoom = MAX_POWER - power;
        if (warnGain > powerRoom) warnGain = powerRoom > 0 ? powerRoom : 0;

        /* ---------- 蓄力（猛击流派）----------
           和力量同层：都排在 `if (c.dmg)` 之前，所以"自己也吃到"的那几张（没有）不影响。
           蓄力是累加器，涨了就一直在，直到攻击牌把它清空。 */
        if (c.loadAdd) {
          var laN = c.loadAdd[dataIdx(lv)];
          if (laN === undefined) laN = c.loadAdd[0];
          var laGot = gainLoad(laN);
          ldOut += laGot;
          kind = 'buff';
          if (laGot > 0) put('「蓄力」+' + laGot);
          else put('「蓄力」已封顶（上限 ' + MAX_LOAD + ' 层）');
        }
        if (c.openLoadAdd) {
          var olN = c.openLoadAdd[dataIdx(lv)];
          if (olN === undefined) olN = c.openLoadAdd[0];
          if (i === firstReal) {
            var olGot = gainLoad(olN);
            ldOut += olGot; kind = 'buff';
            if (olGot > 0) put('「开幕」：「蓄力」+' + olGot);
            else put('「蓄力」已封顶（上限 ' + MAX_LOAD + ' 层）');
          } else { dead = true; put('「开幕」没生效：这张牌不在最左'); }
        }
        /* 蓄之真意：按**释放次数**（不是张数）—— supportUsed 每释放一遍 +1，
           4★ 打两遍、被【我的回合】叠出来的那些遍都算。 */
        if (c.loadFromSupport) {
          var lsN = c.loadFromSupport[dataIdx(lv)];
          if (lsN === undefined) lsN = c.loadFromSupport[0];
          if (supportUsed > 0) {
            var lsGot = gainLoad(lsN * supportUsed);
            ldOut += lsGot; kind = 'buff';
            put('此前释放过 ' + supportUsed + ' 次辅助卡：「蓄力」+' + lsGot);
          } else { dead = true; put('前面还没释放过辅助卡，效果没生效'); }
        }
        /* 力量增幅：把每层 10% 抬上去（只在本回合/本次结算内有效，不进 S） */
        if (c.loadStep) {
          var lzN = c.loadStep[dataIdx(lv)];
          if (lzN === undefined) lzN = c.loadStep[0];
          loadStep += lzN; kind = 'buff';
          put('每层「蓄力」+' + lzN + '%（现在 ' + (10 + loadStep) + '%/层）');
        }
        /* 我的回合：攒给**下一张辅助卡**的额外释放次数 */
        if (c.loadExtraReps) {
          var leN = c.loadExtraReps[dataIdx(lv)];
          if (leN === undefined) leN = c.loadExtraReps[0];
          buffReps += leN; kind = 'buff';
          put('下一张辅助卡释放次数 +' + leN);
        }

        /* ---------- 先处理"给别的牌加东西"的那几张（它们自己没有伤害） ---------- */

        /* 熔合：「开幕」给**所有**同分类攻击牌每击加伤。
           只在最左成立，所以实际上只会累加一次；但累加器放在循环外，
           这样它加完之后**前面打过的牌不受影响**（前面本来就打完了）。 */
        if (c.openMinorAdd) {
          var om = c.openMinorAdd, omN = om.add[dataIdx(lv)];
          if (omN === undefined) omN = om.add[0];
          if (i === firstReal) {
            bumpMinorAdd(om.minor, omN, '熔合');
            /* addOut 让演出把它当"全体 +N"播（大字 + 后面所有牌当场涨）。
               熔合必须站最左，所以"它后面的牌"就是全场，恰好对。 */
            addOut = omN;
            kind = 'buff';
            /* 粒子落点：它后面所有同分类、吃得到加成的格（前面已经打完了，不算） */
            for (var mj = i + 1; mj < list.length; mj++) {
              var mt = list[mj];
              var mc = mt ? CARDS[typeof mt === 'string' ? mt : mt.id] : null;
              if (mc && mc.minor === om.minor && eatsBuff(mj)) buffTgt.push(mj);
            }
            put('「开幕」：所有【' + om.minor + '】攻击牌 +' + omN);
          } else { dead = true; put('「开幕」没生效：这张牌不在最左'); }
        }

        /* 糖果派对（v0.8.26）：**所有**同小类攻击牌每击 +N，**不要求站最左**。
           和熔合唯一的差别就是没有那个 `i === firstReal` 判断。
           后面一张该分类攻击牌都没有时标 dead（加了也没人吃），别静默空过。 */
        if (c.minorAdd) {
          var mAdd = c.minorAdd, mAddN = mAdd.add[dataIdx(lv)];
          if (mAddN === undefined) mAddN = mAdd.add[0];
          if (laterHasMinor(i, mAdd.minor)) {
            bumpMinorAdd(mAdd.minor, mAddN, c.name);
            addOut = mAddN;
            kind = 'buff';
            for (var cj = i + 1; cj < list.length; cj++) {
              var ct = list[cj];
              var cc3 = ct ? CARDS[typeof ct === 'string' ? ct : ct.id] : null;
              if (cc3 && cc3.minor === mAdd.minor && eatsBuff(cj)) buffTgt.push(cj);
            }
            put('所有【' + mAdd.minor + '】攻击牌 +' + mAddN);
          } else {
            dead = true;
            put('后面没有【' + mAdd.minor + '】攻击卡牌，加成无处生效');
          }
        }

        /* 糖果盛宴（v0.8.26）：**所有**同小类攻击牌 ×(1+p%)。
           站最左时换成 openPct —— 是"改为"，不是两段都吃（用户 2026-10-26 原话）。 */
        if (c.minorPct) {
          var mp = c.minorPct;
          var mpIsOpen = (i === firstReal && !!mp.openPct);
          var mpP = mpIsOpen ? mp.openPct[dataIdx(lv)] : mp.pct[dataIdx(lv)];
          if (mpP === undefined) mpP = (mpIsOpen ? mp.openPct : mp.pct)[0];
          if (laterHasMinor(i, mp.minor)) {
            feast.minor = mp.minor;
            feast.mul *= (1 + mpP / 100);
            kind = 'buff';
            pctOut = mpP;
            for (var fj = i + 1; fj < list.length; fj++) {
              var ft = list[fj];
              var fc = ft ? CARDS[typeof ft === 'string' ? ft : ft.id] : null;
              if (fc && fc.minor === mp.minor && eatsBuff(fj)) buffTgt.push(fj);
            }
            put('所有【' + mp.minor + '】攻击牌 +' + mpP + '%' + (mpIsOpen ? '（开幕）' : ''));
          } else {
            dead = true;
            put('后面没有【' + mp.minor + '】攻击卡牌，加成无处生效');
          }
        }

        /* 宝石糖弹（v0.8.26）：只给**下一张真正的牌**（跳过空槽）——必须是同小类攻击牌。
           和焕生火苗同一套写法，区别只在加的是伤害不是连击。 */
        if (c.nextDmgAdd) {
          var nd = c.nextDmgAdd, ndN = nd.add[dataIdx(lv)];
          if (ndN === undefined) ndN = nd.add[0];
          var ndK = nextReal(i);
          var ndIt = ndK < 0 ? null : list[ndK];
          var ndC = ndIt ? CARDS[typeof ndIt === 'string' ? ndIt : ndIt.id] : null;
          if (ndC && ndC.dmg && ndC.minor === nd.minor) {
            /* 同一格连着吃两次要**累加**（4★ 宝石糖弹：+100 打两遍 = 下一张 +200）。
               ⚠️ 以前是直接赋值，第二遍会把第一遍盖掉 → 四星等于白放一次（v0.8.37 修，
                  和焕生火苗那次同一个坑）。 */
            nextDmg = (nextDmg.slot === ndK)
              ? { slot: ndK, n: nextDmg.n + ndN }
              : { slot: ndK, n: ndN };
            addOut = ndN;
            kind = 'buff';
            buffTgt.push(ndK);
            put('下一张【' + nd.minor + '】伤害 +' + ndN);
          } else {
            dead = true;
            put('后一张不是【' + nd.minor + '】攻击卡牌，效果没生效');
          }
        }

        /* 过载糖弹（v0.8.26）：只给**下一张真正的牌**（跳过空槽）的同小类攻击牌 ×(1+p%) */
        if (c.nextPct) {
          var np = c.nextPct, npN = np.add[dataIdx(lv)];
          if (npN === undefined) npN = np.add[0];
          var npK = nextReal(i);
          var npIt = npK < 0 ? null : list[npK];
          var npC = npIt ? CARDS[typeof npIt === 'string' ? npIt : npIt.id] : null;
          if (npC && npC.dmg && npC.minor === np.minor) {
            /* 同一格连着吃两次：**乘数累乘**（4★ 过载糖弹 +300% 打两遍 → 下一张 ×4×4 = ×16）。
               ⚠️ 这里存的是"等效百分比"，所以要把倍数乘完再折回百分比：
                  (1+p1/100)×(1+p2/100) - 1。以前直接赋值，第二遍会把第一遍盖掉（v0.8.37 修）。 */
            var npMul = (1 + npN / 100) * (nextPct.slot === npK ? (1 + nextPct.pct / 100) : 1);
            nextPct = { slot: npK, pct: Math.round((npMul - 1) * 100) };
            kind = 'buff';
            pctOut = npN;
            buffTgt.push(npK);
            put('下一张【' + np.minor + '】伤害 +' + npN + '%');
          } else {
            dead = true;
            put('后一张不是【' + np.minor + '】攻击卡牌，效果没生效');
          }
        }

        /* 焕生火苗：只给**下一张真正的牌**加连击数（跳过空槽），且必须是同小类攻击牌。
           ⚠️ v0.8.26.1 起是 `nextReal(i)`，不是 `list[i+1]` —— 空槽算 null，
              以前"1 号位放焕生、3 号位放火球"会整个失效（用户报的 bug）。
              中间夹一张别的牌仍算"下一张不是它"，按描述失效，别往后找。 */
        if (c.nextHitAdd) {
          var nh = c.nextHitAdd, nhN = nh.add[dataIdx(lv)];
          if (nhN === undefined) nhN = nh.add[0];
          var nk = nextReal(i);
          var nxtIt = nk < 0 ? null : list[nk];
          var nxtC = nxtIt ? CARDS[typeof nxtIt === 'string' ? nxtIt : nxtIt.id] : null;
          if (nxtC && nxtC.dmg && nxtC.minor === nh.minor) {
            /* 同一格连着吃两次要**累加**（4★ 焕生火苗：+4 打两遍 = 下一张 +8）。
               ⚠️ 以前是直接赋值，第二遍会把第一遍盖掉 → 四星等于白放一次（v0.8.36 修）。
                  换目标（正常不会发生）才重置。 */
            nextHit = (nextHit.slot === nk)
              ? { slot: nk, n: nextHit.n + nhN }
              : { slot: nk, n: nhN };
            hitOut = nhN;
            kind = 'buff';
            buffTgt.push(nk);    /* 焕生只认下一张，粒子也只有一个落点 */
            put('下一张【' + nh.minor + '】连击 +' + nhN);
          } else {
            dead = true;
            put('后一张不是【' + nh.minor + '】攻击卡牌，效果没生效');
          }
        }

        if (c.dmg) {
          /* 加伤规则**只在 hitCalc 里写一份**（结算和演出预览共用），这里只负责：
             把结果落到 per/times、把说明按顺序拼进 note、再做它的副作用。
             ⚠️ 顺序硬规则仍然成立：所有加法先堆进 per，百分比/倍数最后乘 —— 见 hitCalc。 */
          var hc = hitCalc(c, lv, i, {
            atkAdd: atkAdd, minorAdds: minorAdds,
            nextHit: nextHit, nextDmg: nextDmg, nextPct: nextPct, pass: passDmg,
            pctBoost: feast, minorCount: minorCount,
            flameNow: flameNow, charge: opt.charge || 0, selfMul: selfMul,
            bonus: bonus, firstReal: firstReal, closeReal: closeReal,
            power: power, warn: warnGain,
            load: load, loadStep: loadStep
          });
          per = hc.per; times = hc.times;
          /* 老吴那笔要留在累加器里，后面的攻击牌才吃得到（它自己那份已经在上面算进 per 了） */
          if (warnGain > 0) power += warnGain;
          kind = 'hit';
          for (var hp = 0; hp < hc.parts.length; hp++) put(hc.parts[hp]);
          if (hc.dead) dead = true;
          /* 副作用：焕生只作用一格（用掉即废）、燎原计数 +1（只影响它后面的牌） */
          if (hc.usedNextHit) tookNextHit = true;
          /* 燎原的 flameNow 计数**不在这里**加 —— 见重复循环外面那段（一张卡 +1）。 */
          /* 蓄能糖弹：把**本卡最终每击伤害**传给**下一张真正的牌**（跳过空槽），
             且那张必须是攻击牌。
             传的是"最终值" → 它自己吃到的加伤/百分比也一并传过去（用户 2026-10-26 明确）；
             **不传连击数**，也不从自己身上扣掉。后面没有牌 / 不是攻击牌就标 dead。 */
          if (c.passDmg) {
            var pdK = nextReal(i);
            var pdIt = pdK < 0 ? null : list[pdK];
            var pdC = pdIt ? CARDS[typeof pdIt === 'string' ? pdIt : pdIt.id] : null;
            if (pdC && pdC.dmg && per > 0) {
              passDmg = { slot: pdK, n: per };
              put('伤害 ' + per + ' 传给下一张');
            } else { dead = true; put('后一张不是攻击卡牌，伤害没传出去'); }
          }
        } else if (c.atkAdd) {
          /* 追击指令：只影响**它后面**的牌。卡面本身没有伤害，
             但如果后面一张攻击牌都没有，这 N 点加成根本无处落地 → dead。 */
          addOut = c.atkAdd[dataIdx(lv)];
          if (addOut === undefined) addOut = c.atkAdd[0];
          if (laterHasDmg(i)) {
            atkAdd += addOut;
            kind = 'buff';
            /* 粒子落点：它后面所有吃得到加成的格（追击只管自己之后的牌） */
            for (var aj = i + 1; aj < list.length; aj++) if (eatsBuff(aj)) buffTgt.push(aj);
            put('之后每张攻击牌 +' + addOut);
          } else {
            dead = true;
            addOut = 0;
            put('后面没有攻击卡牌，加成无处生效');
          }
        } else if (c.upgrade) {
          /* 升级卡空过**不算 dead**：它的效果在备战阶段已经用掉了，
             战斗里空过是本职，不是"条件没满足"。
             幻化卡变成升级卡时 note 已经有"变成「」"了，别再补一句。 */
          if (!note) put('升级道具，战斗里空过');
        } else if (!note) {
          /* 熔合 / 焕生火苗这类"给别的牌加成"的卡，上面已经写过 note 了，
             别在这再无脑补一句"辅助卡空过"（note 会变成两条）。 */
          put('辅助卡，战斗里空过');
        }

        /* 开幕：白送一张卡（汇能指令）。没站最左就是空过 —— 描述区要变暗。 */
        if (c.openGain) {
          var og = c.openGain[dataIdx(lv)];
          if (og) {
            if (i !== firstReal) { dead = true; put('「开幕」没生效：这张牌不在最左'); }
            else if (rollGain(og)) {
              gains.push({ id: og.id, lv: og.lv || 1 });
              put('开幕：获得「' + CARDS[og.id].name + '」' + (og.lv || 1) + ' 星');
            } else put('开幕：这回合没触发（50%）');
          }
        }
        /* 谢幕：只在**最后一个有牌的格子**生效（额外收获）。 */
        if (c.closeGain) {
          var cg2 = c.closeGain[dataIdx(lv)];
          if (cg2) {

      if (counted && log.length) {

  }

  function tierCount(score, round) {

  /* 「力量」合计 = 永久 + 本回合临时。**唯一读法**：别在别处手写 S.power + S.powerRound，

    var ld = (opt && opt.load != null) ? opt.load : 0;

  function addCharge(n) {

  /* ============================================================
     三、状态机
     ============================================================ */

  var S = null;
  var uidSeq = 1;
  var battleSeq = 0;             /* 每开一场 +1。排队的演出步会核对它，过期就自己作废 ——

  /* 「重开本回合」用的快照（v0.8.43）：**每回合开始那一刻**把整个 S 序列化存一份。

  var roundSnap = null;

  /* ---------- 跨页存档（v0.8.58）：去排行榜再回来，这一局要还在 ----------

     不在离开前存一份，回来跑的就是 newGame() 的第 1 回合 —— 卡组/金币/回合全丢。

     ⚠️ 只在「去排行榜 → 回来」这一条路上生效：靠 RESUME_KEY 这个**一次性**标记。
        平时刷新页面照旧开新局（那是玩家主动重开的习惯动作，不能偷偷改掉）。
     ⚠️ 存的是整份 S（和「重开本回合」的 roundSnap 同一套），外加 uidSeq 和 roundSnap：
        uidSeq 不还原会出现重复 uid（合成 / 出售 / 槽位全乱），roundSnap 不还原则回来后
        「重开本回合」点不动。
     ⚠️ 只在 prep / shop / over 存。battle 存下来接不上（演出游标、排队的定时器都没了），
        result 是回合结算面板、页头那颗按钮也点不到，都不存。

  /* ⚠️ LB_PAGE（排行榜页本身）两个函数都不许碰存档：它也跑同一份启动代码，
     不加这条会把存档在排行榜页上就"还原"掉并清空，返回游戏时正好什么也不剩。 */
  function gameSave() {
    if (!LB_ON || LB_PAGE || LAB || TUTO || !S) return;
    if (S.phase !== 'prep' && S.phase !== 'shop' && S.phase !== 'over') return;
    try {
      sessionStorage.setItem(SAVE_KEY, JSON.stringify({
        s: S, uid: uidSeq, round: roundSnap, ver: SAVE_VER
      }));
      sessionStorage.setItem(RESUME_KEY, '1');
    } catch (e) {
      /* 隐私模式 / 配额满：存不下就当没存，回来照旧是新局 —— 不能因为存档失败拦住跳转 */
    }
  }

  function gameRestore() {
    if (!LB_ON || LB_PAGE || LAB || TUTO) return false;
    var raw, flag;

      raw = sessionStorage.getItem(SAVE_KEY);

    if (!o.s.deck || !o.s.slots || o.s.slots.length !== MAX_SLOT) return false;

      charge: 0,

      event: null,                /* 本轮已选的事件 id */

      freeReroll: 0,              /* 免费刷新剩余次数（先扣这个，再花币） */
      buyCopy: 0,                 /* 三购复制：还剩几次"买一送一" */
