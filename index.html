        /* 目标卡亮一下，表示"吃到了"（时长和 CSS 的 .24s × --spd 对齐，别写死 240） */
        (function (b, delay) {
          timers.push(setTimeout(function () {
            if (!b.classList) return;
            b.classList.add('fed');
            timers.push(setTimeout(function () { b.classList.remove('fed'); },
              Math.round(240 * SPEED)));
          }, delay + span - 50));
        })(box, lag);
      }
    }

    function finish() {
      if (my !== battleSeq) return;
      S.step = -1;
      paint();
      setStage('本回合结束', String(S.score), '共 ' + playLog.length + ' 张牌出手', false);
      timers.push(setTimeout(function () {
        if (my !== battleSeq) return;
        applyResult(res);
      }, ANIM + TAIL));
    }

    function step() {
      if (my !== battleSeq) return;      /* 已经跳过 / 已经换场，这条迟到的 step 作废 */
      if (i >= playLog.length) { finish(); return; }
      var e = playLog[i++];

      S.step = e.slot;
      /* 顶栏力量跟着这一张走：snap.power 是**这张处理完**的值（巨人/老吴涨完的），
         取它做显示值，玩家看到的就是逐张往上加，而不是结算时凭空多出一截。
         ⚠️ 必须在 paint() 之前设，paintBattle 就是靠它画徽章的。 */
      if (e.snap && e.snap.power != null) livePower = e.snap.power;
      if (e.snap && e.snap.load != null) liveLoad = e.snap.load;
      S.score = e.score;        /* 直接用结算里的累计值，不自己累加 —— 免得两边算法漂移 */
      if (e.coins) { S.coins += e.coins; S.earnCoins += e.coins; }

      /* 左上角数值换成**这一击的实际值**（蓄能加的连击、开幕/谢幕/追击的加伤都在里面） */
      if (e.dmg > 0) setSlotVal(e.slot, e.per, e.times);
      /* 后面还没出手的牌：按**这一步的状态快照**重算"现在打是多少"。
         只跟着"真有动作"的牌更新（打伤害 / 给全场加伤 / 给下一格加连击），
         空过卡（升级道具之类）不带动别人，免得整排数字无端闪一下。 */
      /* ⚠️ pw 必须一起判：力量是累加器，力的递增/利爪涨完之后，后面每一张攻击牌的数都要跟着跳。 */
      if (e.dmg > 0 || e.add > 0 || e.hitAdd > 0 || e.pct > 0 || e.pw > 0) refreshPreview(e);

      paint();                  /* 先画（把 .act 亮起来），再炸数字 */
      if (e.dmg > 0) bumpScore();

      /* 辅助卡（追击指令 / 熔合 / 焕生火苗）对别的牌生效了：从它的卡面冒粒子，
         钻进每个真的吃到加成的格子。落点名单是 resolve 给的（e.tgt），
         没生效 / 空过 / 加成没处落地时它是空数组，这里自然不会播。 */
      if (e.tgt && e.tgt.length) {
        var qc = CARDS[e.id];
        sprayTo(e.slot, e.tgt, QBUF[(qc && qc.q) || 'gray'] || QBUF.gold);
      }

      /* 中间演出席：幻化类已经变成目标卡了，这一格要报**目标卡**的名字和星级，
         否则玩家会以为卡面显示错了。 */
      var eName = e.copyTo ? CARDS[e.copyTo.id].name : e.name;
      var eLv = e.copyTo ? e.copyTo.lv : e.lv;
      var eCls = e.copyTo ? CARDS[e.copyTo.id].cls : e.cls;
      var lab = '第 ' + (e.slot + 1) + ' 张 · ' + eName + (eLv > 1 ? ' · ' + eLv + ' 级' : '');
      var sub = [];
      if (e.times > 1) sub.push(e.per + ' × ' + e.times + ' 连击');
      if (e.bonus > 0) sub.push('蓄能 +' + e.bonus + ' 连击');
      if (e.note) sub.push(e.note);
      if (e.coins) sub.push('+' + e.coins + ' 金币');
      if (e.reps > 0) sub.push('释放 ' + (e.reps + 1) + ' 次');
      if (e.ldUse > 0) sub.push('蓄力 ' + e.ldUse + ' 层');
      /* 大字：有伤害显示伤害；追击 / 熔合（只有加成没伤害）显示"全体 +N"；
         焕生火苗显示"连击 +N"；其余才是空过。
         灰色只在真的什么都没发生时用 —— 这些有效的加成都不能灰。 */
      var mainTxt = e.dmg > 0 ? String(e.dmg)
        : (e.ld > 0 ? '蓄力 +' + e.ld
        : (e.pw > 0 ? '力量 +' + e.pw
          : (e.add > 0 ? '全体 +' + e.add
            : (e.hitAdd > 0 ? '连击 +' + e.hitAdd
              : (e.pct > 0 ? '伤害 +' + e.pct + '%' : '空 过')))));
      var idle = e.dmg === 0 && !(e.add > 0) && !(e.hitAdd > 0) && !(e.pct > 0) &&
        !(e.pw > 0) && !(e.ld > 0);
      /* **先只报"这是哪张牌"**，数字要到刀落下那一帧才砸进来（下面那个 delayed）。
         这期间上一击的数字先淡下去，否则前摇的 1.5 秒里观众看到的是"上一张牌打出的数"。 */
      setLabel(lab, sub.join(' · '));
      if (e.dmg > 0) { var nEl = $('hitnum'); if (nEl) nEl.classList.add('dim'); }

      /* 角色演出：攻击牌 / 复刻 → 砍，辅助卡（战斗里空过）→ 加增益。
         kind 由 resolve() 给，别再按 cls 二次猜 —— 幻化复刻的 cls 是 sp，
         但它实际打出的是一次攻击。
         本场最后一张有伤害的牌 → 走穿刺（慢放 + 特写），它的命中帧和时长都不一样。 */
      var isLast = (i - 1) === lastHit;
      /* 终结技：穿刺 / 破防处决，随机。抽中哪个，这一步的时长和命中帧就跟着哪个走 */
      var finKind = isLast ? pickFin() : null;
      heroAct(e.kind === 'hit' || e.kind === 'copy' ? 'atk' : 'buff',
        { last: isLast, q: CARDS[e.id] && CARDS[e.id].q, fin: finKind });

      var box = bslotEls[e.slot];
      if (box) {
        box.classList.add('fire');
        (function (b) { timers.push(setTimeout(function () { b.classList.remove('fire'); }, ANIM)); })(box);
      }

      if (e.dmg > 0) {
        /* 刀到的那一帧才一起发生：数字砸进来 + 冲击圈 + 震屏 + 怪物挨打 + 跳字 + 卡面 +N。
           穿刺整段更长（慢放），命中帧按 PIERCE × HIT_AT3 算。
           ⚠️ isLast / e / box 都要**当参数传进闭包**：var 是函数作用域的，
              下一张牌会把它们全改掉，闭包里直接读就是别人的值。 */
        var hitAt = isLast
          ? Math.round((finKind === 'atk3' ? PIERCE : FIN) *
                       (finKind === 'atk3' ? HIT_AT3 : HIT_AT4))
          : Math.round(ANIM * HIT_AT);
        (function (ee, bb, atkCls, last, fk, act) {
          timers.push(setTimeout(function () {
            if (my !== battleSeq) return;
            setNum(String(ee.dmg), false);
            boom(atkCls, last ? 'thrust' : (act === 'atk2' ? 'sweep' : 'chop'));
            if (last) {
              if (fk === 'atk3') { mobPierced(); impactBurst('pierce'); }
              else { impactBurst('finish'); }   /* 举盾 / 碎盾 / 倒地由 finishAct() 自己编排 */
            } else { mobHurt(act); normalImpact(act); }
            mobFloats(ee.times, ee.per);
            if (bb) floatNum(bb, '+' + ee.dmg);
          }, hitAt));
        })(e, box, eCls, isLast, finKind, currentAct);
      } else {
        setNum(mainTxt, idle);
        if (e.coins) floatNum(box, '+' + e.coins + ' 币');
        else if (e.pw > 0) floatNum(box, '力量 +' + e.pw, '#6B5BD2');
        else if (e.ld > 0) floatNum(box, '蓄力 +' + e.ld, '#B0801C');
        else if (e.add > 0) floatNum(box, '全体攻击 +' + e.add, '#2F6FA8');
        else floatNum(box, '空过', '#B4AFA3');
      }

      /* 终结技要占更长的时间：它是收尾牌，后面没有牌了，可以放心拖长 */
      timers.push(setTimeout(step, isLast ? (finKind === 'atk3' ? PIERCE : FIN) : ANIM));
    }

    timers.push(setTimeout(function () {
      if (my !== battleSeq) return;
      if (morphs.length) morphStep();
      else step();
    }, LEAD));   /* 进场留白：先看一眼靶场和分数线 */

    /* 幻化类变身：把槽里的**卡面元素**整张换成目标卡（名字 / 图标 / 品质 / 数字全换），
       之后这一格看起来、数起来都和"直接装了一张那张卡"一模一样。
       ⚠️ 只动 DOM，不碰 S.deck / S.slots —— 回到备战页 paintPrep 一重建就变回幻化卡，
          这是"效果等同、身份不变"的唯一实现方式，别去改状态。
       ⚠️ 换完的元素必须保留 `.cf` 和 data-card / data-lv：setSlotVal 靠 baseValOf()
          从这两个属性反查基础伤害，换错属性黄字判断就全错。 */
    function morphStep() {
      if (my !== battleSeq) return;
      var names = [];
      for (var k = 0; k < morphs.length; k++) {
        var e = morphs[k];
        var b = bslotEls[e.slot];
        var tc = CARDS[e.copyTo.id];
        if (!b || !tc) continue;
        var novo = cardEl(e.copyTo.id, e.copyTo.lv, { tight: true });
        novo.className += ' morph';
        var old = b.querySelector ? b.querySelector('.cf') : null;
        if (old && old.parentNode) old.parentNode.replaceChild(novo, old);
        else b.insertBefore(novo, b.firstChild || null);
        names.push(tc.name);
        floatNum(b, '幻化 → ' + tc.name, '#7A5CC0');
      }
      if (names.length) {
        /* 大数字固定写「变 身」两个字 —— 目标卡名太长（4 个字）在大字号下会折成两行，
           名单放进下面那行小字里。张数放在上方标签。 */
        setStage(names.length > 1 ? '幻化 ×' + names.length : '幻 化',
          '变 身', names.join(' · '), false);
      }
      timers.push(setTimeout(step, MORPH));
    }
  }

  /* 跳过演出：立刻把最终结果写进去（按 Esc 或点右下角"跳过"） */
  function skipBattle() {
    if (S.phase !== 'battle' || !S.lastRes) return;
    battleSeq++;             /* 作废排队的演出步，免得结算完又补演一遍 */
    clearTimers();
    /* clearTimers 只撤定时器，撤不掉已经挂在元素上的类 —— 震屏 / 黑白 / 特写 / 动作都要手动收 */
    var h = $('hero'), m = $('mob');
    if (h) h.classList.remove('atk', 'atk2', 'atk3', 'atk4', 'buff');
    if (m) m.classList.remove('hurt', 'hurt-down', 'hurt-sweep', 'pierced',
      'hit-chop', 'hit-sweep', 'hit-thrust');
    clearFinMob();
    resetArenaFx();
    /* 跳字节点的回收是排的定时器，clearTimers 撤掉之后就留在 DOM 里了（虽然动画结束是透明的） */
    var hn = $('hitnums');
    if (hn) hn.innerHTML = '';
    applyResult(S.lastRes);
  }

  function applyResult(res) {
    if (S.phase !== 'battle') return;    /* 结果只算一次：重复触发（迟到的定时器）直接忽略 */
    battleSeq++;
    clearTimers();
    S.phase = 'result';
    S.step = -1;
    livePower = -1;            /* 演出结束，徽章回到读 S 两桶 */
    liveLoad = 0;              /* 蓄力回合结束清零（不进 S，结算面板不该还挂着它） */
    S.score = res.dmg;
    S.total += res.dmg;

    /* 跳过演出时，即时金币还没入过账，这里补上（已经入过的不重复加） */
    var rest = res.coins - S.earnCoins;
    if (rest > 0) S.coins += rest;
    S.earnCoins = res.coins;

    /* 力量回写：永久那份（基米巨人）落 S.power、跨回合保留；
       其余落 S.powerRound，下一回合开始由 nextRound 清掉。 */
    /* ⚠️ 封的是**总量**：先给永久桶，余下的额度才给本回合桶，
       否则两个桶各涨到 9999 就变成 19998 了。 */
    S.power = Math.min(MAX_POWER, (S.power || 0) + (res.powerKeep || 0));
    var powerLeft = MAX_POWER - S.power;
    S.powerRound = Math.min(powerLeft > 0 ? powerLeft : 0,
                            (S.powerRound || 0) + (res.powerTemp || 0));

    var tier = coinsFor(res.dmg, S.round);
    S.coins += tier;
    S.lastGain = res.coins + tier;

    /* 战斗里"获得"的卡（汇能指令 / 额外收获）在**结算后**才进手牌：
       本场结算已经算完，它们从下一回合开始用。 */
    (res.gain || []).forEach(function (g) { addCard(g.id, g.lv); });

    paint();
    showResult(res);
  }

  /* ---------- 回合推进 ---------- */

  /* 「重开本回合」的存档点：每回合开始（事件还没抽）把整个 S 存一份。
     ⚠️ 存的是**事件抽取之前**的状态，所以重开时会重新抽事件、重新摇货架 ——
        这正是用户要的"商店的商品和事件也会随重开变化"。 */
  function snapRound() {
    if (!S) { roundSnap = null; return; }
    try { roundSnap = JSON.stringify(S); } catch (e) { roundSnap = null; }
  }

  /* 重开本回合（v0.8.43）：回到这一回合刚开始的样子，然后从**事件选择**重来一遍。
     本地打开和内网联机都能用（它跟协议无关，只是一次状态回滚）。
     做的事：
       ① battleSeq++ 作废还在排队的演出（战斗中直接点重开也不会被旧的 step 追上）；
       ② 把 S 整体换回快照 —— 金币 / 卡组 / 槽位 / 蓄能 / 商店锁池 / 事件给的免费刷新等一起回滚；
       ③ phase 回 prep、清掉演出游标，重新 paint + openEvents()（事件重抽、货架随后重摇）。
     ⚠️ 教程模式（TUTO）不挂这个按钮：教程的步骤机是按固定流程推进的，中途回滚会把引导打乱。 */
  function restartRound() {
    if (!S || !roundSnap) return false;
    var snap;
    try { snap = JSON.parse(roundSnap); } catch (e) { return false; }
    battleSeq++;
    Object.assign(S, snap);
    S.phase = 'prep';
    S.step = -1;
    S.pending = 0;
    S.targeting = 0;
    S.sellMode = false;
    S.lastRes = null;
    hideMask();
    paint();
    openEvents();
    return true;
  }

  function nextRound() {
    if (S.phase !== 'result') return false;
    hideMask();
    if (S.round >= TOTAL_ROUNDS) { S.phase = 'over'; showFinal(); paint(); return true; }
    S.round++;
    S.phase = 'prep';
    S.score = 0;
    /* 力量：临时那份过回合清空（基米巨人给的永久那份在 S.power 里，留着） */
    S.powerRound = 0;
    S.step = -1;
    S.pending = 0;
    S.targeting = 0;
    S.sellMode = false;
    S.earnCoins = 0;
    S.lastRes = null;
    /* 出战顺序**跨回合保留**（用户 2026-10-26：「构筑好之后打一场，卡牌不要全部回到卡组，
       保持上次战斗的顺序」）—— 不用每回合重新摆一遍。
       · 只清掉"已经不在卡组里"的 uid（被合成 / 卖掉 / 升级换卡的情况），其余原样留着；
         新解锁的槽位自然是空的。
       · ⚠️ **教程模式例外**：tuto=1 时照旧清空 —— 教程第 13 步教的就是"槽位每回合会清空"，
         这里跟着保留的话，那一课就说不通了。 */
    if (TUTO) {
      for (var i = 0; i < S.slots.length; i++) S.slots[i] = null;
    } else {
      for (var k = 0; k < S.slots.length; k++) {
        if (S.slots[k] && !cardById(S.slots[k])) S.slots[k] = null;
      }
    }

    /* 事件带来的东西**每回合重算**（shopFilter 除外，那是礼盒的整局效果）。
       货架先清空 —— 等玩家选完事件，由 chooseEvent 决定开不开、要摇什么货。 */
    S.event = null;
    S.events = [];
    S.shopOn = false;
    S.freeReroll = 0;
    S.buyCopy = 0;
    S.shopMinQ = null;
    S.shop = null;

    paint();
    snapRound();          /* 每回合开始都存一份 —— "重开本回合"就是回到这里 */
    openEvents();
    return true;
  }

  /* ⚠️ 已废弃：商店不再按回合号开放（改由事件给）。只给 `__cards.isShopRound` 留着。 */
  function isShopRound(r) { return SHOP_ROUNDS.indexOf(r) >= 0; }

  /* 本回合能不能进商店。**唯一判据是 S.shopOn**（事件给的），
     所有"要不要开商店"的地方都走这里，别直接摸 S.shopOn 或回合号。 */
  function shopAvailable() {
    if (SHOP_ALWAYS) return true;      /* 调试开关，正式为 false */
    return !!(S && S.shopOn);
  }

  /* ---------- 事件：抽两个、选一个 ---------- */

  /* 从本回合的候选池里**不重复**抽。池子不足时有多少给多少。
     ⚠️ 第 1 回合**全部上桌**（v0.8.26）：加了糖果礼盒之后候选有 3 个，
        还按"抽 2 个"的话会有局从头到尾见不到糖果礼盒，等于那 9 张卡不存在。
        其余回合照旧抽 2 个。 */
  function rollEvents(round) {
    var pool = (ROUND_EVENTS[round] || []).slice(), out = [];
    var want = round === 1 ? pool.length : 2;
    while (out.length < want && pool.length) {
      out.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
    }
    return out;
  }

  /* 回合开始：抽好两个事件并弹面板。
     ⚠️ 这是**玩法流程**，不是提示 —— newGame / nextRound / 实验室跳回合都必须走它。 */
  function openEvents() {
    if (!S) return;
    /* 教程：第 1 回合两个选项**都换成礼盒**（保证一定拿到卡，不然可能选了夜市没牌可打）；
       第 2 回合直接跳过事件，把商店开出来当教材。 */
    if (TUTO) {
      if (S.round >= 2) {
        S.events = []; S.pickOpen = false; S.event = null;
        S.shopOn = true;
        S.coins = Math.max(S.coins, 8);
        /* 手上保证有一对「同名同星」—— 不然"拖过去合成"那一步没东西可教。
           礼盒发的是随机三张，撞不上太正常了。 */
        if (!tutoHasPair() && S.deck.length) addCard(S.deck[0].id, S.deck[0].lv || 1);
        paint();
        return;
      }
      S.events = ['giftFire', 'giftMissile'];
      S.pickOpen = true;
      paint();
      showEventPanel();
      return;
    }
    S.events = rollEvents(S.round);
    S.pickOpen = S.events.length > 1;
    paint();
    if (S.events.length === 1) chooseEvent(S.events[0]);
    else showEventPanel();
  }

  /* 某一分类的全部灰色卡（礼盒发的三张必须是灰的） */
  function grayOf(minor) {
    return Object.keys(CARDS).filter(function (id) {
      return CARDS[id].q === 'gray' && CARDS[id].minor === minor;
    });
  }

  function showEventPanel() {
    /* ⚠️ 面板上**只留事件名和 desc**（用户 2026-10-27 明确要求）：
       · 「二选一 —— 选定之后这一回合就按它走」那句副标题删掉了；
       · `e.note`（"三张都是灰色、之后商店只刷通用和本系"）是**隐藏机制**，不往玩家面前摆 ——
         数据里仍保留，实验室（`?lab=1`）那边还看得到，方便调数值时查。
       所以这里不要再把 note 渲染出来。 */
    var h = '<h2>第 ' + S.round + ' 回合 · 事件</h2>' +
      '<div class="evs">' + S.events.map(function (id) {
        var e = EVENTS[id];
        return '<button class="ev" data-ev="' + id + '">' +
          '<b>' + e.name + '</b>' +
          '<span>' + e.desc + '</span>' +
          '</button>';
      }).join('') + '</div>';
    elPanel.innerHTML = h;
    elMask.classList.add('on');
    var btns = elPanel.querySelectorAll('[data-ev]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        chooseEvent(this.getAttribute('data-ev'));
      });
    }
  }

  /* 选事件 + 立刻生效。礼盒发卡，其余开商店并加增益。 */
  function chooseEvent(id) {
    var e = EVENTS[id];
    if (!e || !S) return false;

    S.event = id;
    S.pickOpen = false;

    if (e.kind === 'gift') {
      /* 「1 张随机 + 2 张本系」，三张**必定灰色**、且**不会出现对家分类**：
         第一张从「通用灰 + 本系灰」里抽，后两张只从本系灰里抽（可重复）。 */
      var mine = grayOf(e.minor);
      var any = grayOf('通用').concat(mine);
      addCard(any[Math.floor(rng() * any.length)], 1);
      for (var i = 0; i < 2; i++) addCard(mine[Math.floor(rng() * mine.length)], 1);
      /* 整局锁商店池（用户文案是"选择这个之后"）。弱于 S.shopFilter 的只有下一局的 newGame。 */
      S.shopFilter = e.minor;
      S.shopOn = false;
    } else {
      S.shopOn = true;
      if (e.coins) S.coins += e.coins;
      if (e.free) S.freeReroll += e.free;
      if (e.copy) S.buyCopy = e.copy;
      if (e.minQ) S.shopMinQ = e.minQ;
      S.shop = rollShop();       /* 先把货摇好，点"商店"就能看到 */
    }

    hideMask();
    paint();
    return true;
  }

  /* 备战屏左上角那枚事件徽章：事件名 + 这一回合还剩多少增益。没有事件时返回空串。 */
  function eventChipText() {
    if (!S || !S.event || !EVENTS[S.event]) return '';
    var e = EVENTS[S.event], tail = [];
    if (S.freeReroll > 0) tail.push('免费刷新 ' + S.freeReroll);
    if (S.buyCopy > 0) tail.push('买一送一 ' + S.buyCopy);
    if (S.shopOn && S.shopMinQ) tail.push(S.shopMinQ === 'gold' ? '金卡必现' : '紫卡必现');
    if (S.shopFilter) tail.push('商店：通用 + ' + S.shopFilter);
    return e.name + (tail.length ? '　' + tail.join(' · ') : '');
  }

  /* ---------- 商店 ---------- */

  /* 货架：从**全部卡牌**里抽 3 张不重复的 —— 所有卡都有可能上货架（含小火苗 /
     新生之焰这种进化链上的卡，买到就等于省了一次合成）。
     唯一保留的软约束：**至少一张是打得出伤害的牌**。全随机时会摇出
     「磨刀石 + 号角 + 烈焰」这种三张全是增益的货架，玩家花了钱卡组里却
     一张能打人的都没多，后期直接卡死（_sim_cards.js 跑出来的，不是玩家菜）。
     ⚠️ 「有伤害」只能写 `!!CARDS[id].dmg` —— dmg 是数组，
        `dmg > 0` 永远 false，货架会一张攻击牌都没有。 */
  /* 按**品质概率**从 bag 里抽一张，抽中即从 bag 移除（保证一次刷新三格不重复）。
     needDmg = true 时只在"有伤害的卡"里挑（攻击牌保底用），但用的还是同一份权重。
     —— 某一档在当前池里已经空了（事件锁池 / 前面几格抽光 / 该档没有攻击牌），
        把它的权重清零后**重新归一化再抽**：不会把别的品质顶上来充数，也不会永远卡住。
     —— 四档全点不着才退化成随便抽一张（理论上到不了，留着防货架空位）。 */
  function pickShopCard(bag, odds, needDmg) {
    for (var tries = 0; tries < QS.length; tries++) {
      var w = [], tot = 0, k, q;
      for (k = 0; k < QS.length; k++) {
        q = QS[k];
        w[k] = odds[q] || 0;
        tot += w[k];
      }
      if (tot <= 0) break;
      var r = rng() * tot, sel = null;
      for (k = 0; k < QS.length; k++) {
        r -= w[k];
        if (r < 0 && w[k] > 0) { sel = QS[k]; break; }
      }
      /* 浮点兜底：r 正好等于 tot 时扫不到，取最后一个非零档 */
      if (!sel) { for (k = QS.length - 1; k >= 0; k--) if (w[k] > 0) { sel = QS[k]; break; } }
      if (!sel) break;

      var cand = [];
      for (k = 0; k < bag.length; k++) {
        var cid = bag[k];
        if (CARDS[cid].q !== sel) continue;
        if (needDmg && !CARDS[cid].dmg) continue;
        cand.push(cid);
      }
      if (cand.length) {
        var pick = cand[Math.floor(rng() * cand.length)];
        bag.splice(bag.indexOf(pick), 1);
        return pick;
      }

      /* 这一档空了：复制一份权重、把它清零，下一轮重新归一化。
         ⚠️ SHOP_ODDS 是常量，绝不能就地改它。 */
      var o2 = {};
      for (k = 0; k < QS.length; k++) o2[QS[k]] = odds[QS[k]] || 0;
      o2[sel] = 0;
      odds = o2;
    }
    for (var z = 0; z < bag.length; z++) {
      if (!needDmg || CARDS[bag[z]].dmg) {
        var f = bag[z];
        bag.splice(z, 1);
        return f;
      }
    }
    return null;
  }

  function rollShop() {
    /* 池子先按事件过滤：礼盒把商店锁成「通用 + 本系」。
       ⚠️ 过滤只在**抽之前**做一次（ids / bag 用同一份），否则保底那几步会挑回被排除的卡。 */
    var ids = Object.keys(CARDS).filter(function (id) {
      if (!S || !S.shopFilter) return true;
      var mn = CARDS[id].minor;
      return mn === '通用' || mn === S.shopFilter;
    });
    var hasDmg = function (id) { return !!CARDS[id].dmg; };
    var odds = shopOdds(S ? S.round : 1);
    var picked = [], bag = ids.slice(), i;

    /* 三格：**每格先按本回合的品质概率定品质**，再在该品质里等概率挑一张。
       ⚠️ 别退回"全池均匀随机"（v0.8.8 之前的做法）—— 那样品质分布完全不受控，
          紫金全靠卡池占比碰运气，R2 也可能刷出金卡。 */
    for (i = 0; i < 3 && bag.length; i++) {
      var got = pickShopCard(bag, odds, false);
      if (got) picked.push(got);
    }

    /* 保底 ①：三张都没伤害 → 用**同一份品质权重**在攻击牌里挑一张替换一格。
       此时 picked 里没有攻击牌，新抽的又从 bag 里拿，所以不会和另外两格重复。 */
    var anyAtk = false;
    for (i = 0; i < picked.length; i++) if (hasDmg(picked[i])) anyAtk = true;
    if (picked.length && !anyAtk) {
      var atkId = pickShopCard(bag, odds, true);
      if (atkId) picked[Math.floor(rng() * picked.length)] = atkId;
    }

    /* 保底 ②：A级必现 / S级必现 —— 三格里至少一张够品质。
       放在攻击牌保底**之后**，替换时优先挑「不是攻击牌」的那一格，
       免得刚补好的攻击牌又被换掉（两个保底互相打架）。 */
    var minQ = S && S.shopMinQ;
    if (minQ && picked.length) {
      var okQ = minQ === 'gold' ? ['gold'] : ['purple', 'gold'];
      var hasQ = false;
      for (i = 0; i < picked.length; i++) if (okQ.indexOf(CARDS[picked[i]].q) >= 0) hasQ = true;
      if (!hasQ) {
        var cand = ids.filter(function (id) {
          return okQ.indexOf(CARDS[id].q) >= 0 && picked.indexOf(id) < 0;
        });
        if (cand.length) {
          var at = -1;
          for (i = 0; i < picked.length; i++) {
            if (!hasDmg(picked[i])) { at = i; break; }
          }
          if (at < 0) at = Math.floor(rng() * picked.length);
          picked[at] = cand[Math.floor(rng() * cand.length)];
        }
      }
    }

    return picked.map(function (id) {
      /* ⚠️ **商店只卖 1 星**（用户 2026-10-26 设定）：
         货架上永远是该卡的最低等级，价格也只按品质走、不跟等级挂钩。
         以后真要卖高级卡，就改这里的 lv —— 价格得另外加字段，别拿 PRICE 凑。 */
      return { id: id, lv: 1, price: PRICE[CARDS[id].q] || 2, sold: false };
    });
  }

  /* 进商店 = 切到商店屏（phase 改成 shop，屏幕归属由它派生）。
     只有商店回合、且当前在备战阶段才进得去。 */
  function openShop() {
    if (S.phase !== 'prep') return false;
    if (!shopAvailable()) return false;
    if (!S.shop) S.shop = rollShop();
    S.pending = 0;               /* 手上捏着的牌放掉，回来时不会莫名其妙选中一张 */
    S.sellMode = false;
    S.phase = 'shop';
    paint();
    return true;
  }

  /* 左下角"备战"：回备战屏。货架**留着**（还能再进来，已买的还是已售） */
  function closeShop() {
    if (S.phase !== 'shop') return false;
    S.phase = 'prep';
    paint();
    return true;
  }

  function rerollCost() { return REROLL_COST; }   /* 固定价，不看刷了几次 */

  function rerollShop() {
    if (S.phase !== 'shop') return false;
    /* 免费刷新（四新 / 十新夜市）先扣次数，扣完才花钱；钱不够就刷不动 */
    if (S.freeReroll > 0) {
      S.freeReroll--;
    } else {
      var cost = rerollCost();
      if (S.coins < cost) return false;
      S.coins -= cost;
    }
    S.shop = rollShop();         /* 已买的卡不会回来：整架重摇 */
    paint();
    return true;
  }

  function buyOffer(k) {
    if (S.phase !== 'shop') return false;
    if (!S.shop || !S.shop[k]) return false;
    var o = S.shop[k];
    if (o.sold || S.coins < o.price) return false;
    S.coins -= o.price;
    o.sold = true;
    addCard(o.id, o.lv || 1);
    /* 三购复制：前 N 次购买各额外送一张**同名同星**（货架现在恒为 1 星，但别写死） */
    if (S.buyCopy > 0) { S.buyCopy--; addCard(o.id, o.lv || 1); }
    paint();
    return true;
  }

  /* ---------- 出售 ----------
     卖出价 = `SELL[品质][等级-1]`（灰 2/3/6/12、蓝 3/5/9/18、紫 4/6/12/24、金 5/8/16/32，四档）。
     **飞弹系的两张积蓄卡例外**：不给币，换成「蓄能」——
       动能积蓄：固定层数（sellCharge）
       精准积蓄：**当前蓄能的百分比**（sellChargePct），所以蓄能越厚它越值钱
     ⚠️ 三者都走这一个函数，别在 sellCard / 界面里再各自判一次。
     base 参数只为测试用（不传就读当前 S.charge）。 */
  function sellValue(id, lv, base) {
    var c = CARDS[id];
    if (!c) return { coins: 0, charge: 0 };
    /* noLv 卡（小火苗这种）永远只有 1 星。夹一下，免得外面递进来一个 3★
       就让出售区报出「+6 金币」、实际到手却是 1★ 的 +2 —— 报价必须等于到手。 */
    if (c.noLv) lv = 1;
    var from = base === undefined ? (S ? S.charge : 0) : base;

    /* 蓄势技巧：换的是**卡**，不是币也不是蓄能（拿到手还得自己再卖一次） */
    if (c.sellGain) {
      var gl = c.sellGain.lv[lvIdx(c.sellGain.lv, lv)];
      if (gl === undefined) gl = c.sellGain.lv[0];
      return { coins: 0, charge: 0, gain: c.sellGain.n, gainLv: gl };
    }
    if (c.sellChargePct) {
      var p = c.sellChargePct[lvIdx(c.sellChargePct, lv)];
      if (p === undefined) p = c.sellChargePct[0];
      /* 向下取整：宁可少给一点，也别让百分比在高蓄能时膨胀成无限层 */
      return { coins: 0, charge: Math.floor(from * p / 100), pct: p };
    }
    if (c.sellCharge) {
      var n = c.sellCharge[lvIdx(c.sellCharge, lv)];
      return { coins: 0, charge: n === undefined ? c.sellCharge[0] : n };
    }
    /* 普通卡：按品质 × 等级查表。**四星单独一档**（2026-10-27 用户给的 4 档价），
       所以这里用**真实等级**取下标，不能走 dataIdx（那个会把 4★ 夹回 3★）。 */
    var row = SELL[c.q] || SELL.gray;
    var k = Math.max(1, Math.min(MAX_LV, lv || 1)) - 1;
    var sv = row[k];
    return { coins: sv === undefined ? row[0] : sv, charge: 0 };
  }

  /* 出售模式下卡片 title 用的文案 —— 让玩家（尤其是百分比卡）卖之前就知道能拿到什么 */
  function sellText(id, lv) {
    var v = sellValue(id, lv);
    /* 蓄能已满时诚实地告诉他"卖了也不涨"，否则玩家会以为白卖了 */
    var full = !!(S && (S.charge || 0) >= MAX_CHARGE);
    if (v.gain) return '出售：获得 ' + v.gain + ' 张“积蓄”的 ' + v.gainLv + ' 星版本';
    if (v.pct) {
      if (full) return '出售：蓄能已满（' + MAX_CHARGE + ' 层），卖了也不涨';
      return v.charge > 0
        ? '出售：蓄能 +' + v.charge + '（当前蓄能的 ' + v.pct + '%）'
        : '出售：蓄能 +0（占当前蓄能的 ' + v.pct + '%，蓄能太低）';
    }
    if (v.charge > 0) {
      if (full) return '出售：蓄能已满（' + MAX_CHARGE + ' 层），卖了也不涨';
      return '出售：蓄能 +' + v.charge;
    }
    return '出售：+' + v.coins + ' 金币';
  }

  /* 出售区的"报价"：把 sellValue 的结果翻成一句话 + 一个色标。
     ⚠️ 判定一律复用 sellValue，这里不许再分一次支（尤其是积蓄系和蓄势技巧）——
        否则界面报的价和真正到手的东西会不一致。 */
  function sellOffer(id, lv) {
    var v = sellValue(id, lv);
    var full = !!(S && (S.charge || 0) >= MAX_CHARGE);
    if (v.gain) return { t: '获得 ' + v.gain + ' 张积蓄（' + v.gainLv + '★）', cls: 'chg' };
    if (v.pct || v.charge) {
      if (full) return { t: '蓄能已满 ' + MAX_CHARGE + ' 层，卖了也不涨', cls: 'full' };
      return { t: '蓄能 +' + v.charge + (v.pct ? '（当前蓄能的 ' + v.pct + '%）' : ''), cls: 'chg' };
    }
    return { t: '+' + v.coins + ' 金币', cls: '' };
  }

  function sellCard(uid) {
    if (S.phase !== 'prep') return false;
    var c = cardById(uid);
    if (!c) return false;
    var v = sellValue(c.id, c.lv);
    var at = inSlot(uid);
    if (at >= 0) S.slots[at] = null;
    for (var i = 0; i < S.deck.length; i++) {
      if (S.deck[i].uid === uid) { S.deck.splice(i, 1); break; }
    }
    S.coins += v.coins;
    addCharge(v.charge);           /* 夹在 MAX_CHARGE 内，蓄能溢出时多的部分直接丢 */
    /* 蓄势技巧：随机 3 张「积蓄」直接进手牌（和 汇能指令/额外收获 一样，先入卡组，
       下一回合才可能上场）。随机源用全局 rng，测试里换种子就能复现。 */
    if (v.gain) {
      var pool = CARDS[c.id].sellGain.pool;
      for (var k = 0; k < v.gain; k++) {
        addCard(pool[Math.floor(rng() * pool.length)], v.gainLv);
      }
    }
    if (S.pending === uid) S.pending = 0;
    if (S.targeting === uid) S.targeting = 0;
    paint();
    return true;
  }

  /* 开关出售模式。开着的时点卡 = 卖掉，所以顺手把"捏着的牌 / 挑目标"清掉，
     否则一进出售模式还留着上一轮的选中状态，点一下会先卖掉刚选的那张以外的卡。 */
  function toggleSell(on) {
    if (S.phase !== 'prep') return false;
    S.sellMode = on === undefined ? !S.sellMode : !!on;
    if (S.sellMode) { S.pending = 0; S.targeting = 0; }
    paint();
    return true;
  }

  /* ============================================================
     四、DOM
     ============================================================ */

  var $ = function (id) { return document.getElementById(id); };
  var elSlots = $('slots'), elHand = $('hand'), elMask = $('mask'), elPanel = $('panel');
  var elBslots = $('bslots'), elShelf = $('shelf');
  /* 电脑端的出售区（触屏整个隐藏，见 CSS 的 pointer:coarse 段） */
  var elSell = $('sellzone'), elSzCard = $('sz-card'), elSzVal = $('sz-val');
  var slotEls = [];        /* 备战屏的槽位 DOM */
  var bslotEls = [];       /* 出战屏的槽位 DOM（演出的飘字挂在这里） */

  /* 把演出倍率推给 CSS：飘字 / 冲击圈 / 弹数字的 animation-duration 都是
     calc(… * var(--spd))，靠这一个变量跟 SPEED 一起走。 */
  (function () {
    var de = document.documentElement;
    if (de && de.style && de.style.setProperty) de.style.setProperty('--spd', SPEED);
  })();

  /* ---------- 两屏切换 ---------- */

  /* 屏幕归属是**派生**的：prep 归备战屏，shop 归商店屏，其余阶段
     （出战 / 结算 / 通关）全部留在出战屏 —— 结算面板是盖在擂台上的一层，不是第四屏。
     所以不需要往 S 里再存一个 screen 字段，也就不会出现两者打架的情况。 */
  function screenOf(phase) {
    if (phase === 'shop') return 'shop';
    return phase === 'prep' ? 'prep' : 'battle';
  }

  function syncScreen() {
    /* 测试环境是假 DOM，没有 body，这里兜一下 */
    var b = document.body;
    if (!b || !b.classList) return;
    var scr = screenOf(S.phase);
    b.classList.toggle('battle', scr === 'battle');
    b.classList.toggle('shop', scr === 'shop');
  }

  /* ---------- 卡面渲染（与 _codex.html 同一套规则） ---------- */

  var STAR = '<svg><use href="#ic-star"/></svg>';

  /* 左上角数值的统一格式：`27×2`。
     ⚠️ 连击数 **1 也要写 ×1**（用户 2026-10-26 要求）—— 以前只写伤害，
        而后续会有"直接加连击数"的 buff，战斗中这个数字要能当场变大，
        不写 ×1 就完全看不出变化。
     up（可选）= { per, hit }：哪一部分比**卡面基础值**高了，就把那一部分染成黄色。
       两个都不高时**返回的字符串和不传 up 完全一样**（不加空 span），
       这样 setSlotVal 的 `innerHTML === next` 比较不会因为包了一层而误判成"变了"。 */
  function fmtDmg(per, times, up) {
    if (per === undefined || per === null || per === '') return '';
    var t = (times === undefined || times === null) ? 1 : times;
    var hp = !!(up && up.per), ht = !!(up && up.hit);
    /* 数字长度分档缩字号（v0.8.38）：上限放开到 9999999×1001 之后，
       "9999999×1001" 有 12 个字符，按原字号会顶穿卡片右边界、压到星星上。
       ⚠️ 用**字符数**判档、不量宽度：卡面会在备战/商店/图鉴/出战四种尺寸下渲染，
          而且演出里 setSlotVal 是逐张调的，每次量宽（强制回流）会明显卡顿。 */
    var n = String(per).length + String(t).length;
    /* v0.8.65 删掉封顶之后，数字还能更长（十几位），所以多一档 f3。 */
    var fit = n >= 16 ? ' f3' : (n >= 12 ? ' f2' : (n >= 10 ? ' f1' : ''));
    return '<span class="dm' + fit + '">' +
      (hp ? '<span class="vup">' + per + '</span>' : per) +
      '<i' + (ht ? ' class="vup"' : '') + '>×' + t + '</i></span>';
  }

  /* 卡面**基础值**：槽位里那张卡的原始伤害 / 连击数。
     从 cardEl 落在 DOM 上的 data-card / data-lv 反查（别再往槽位上存一份，
     存了就得跟着升级、合并一起更新，迟早漂移）。
     拿不到（空槽 / 无伤害卡）返回 null —— 调用方按"没被提升"处理。 */
  function baseValOf(slot) {
    var b = bslotEls[slot];
    if (!b || !b.querySelector) return null;
    var cf = b.querySelector('.cf');
    if (!cf || !cf.getAttribute) return null;
    var c = CARDS[cf.getAttribute('data-card')];
    var lv = Number(cf.getAttribute('data-lv')) || 1;
    if (!c || !c.dmg) return null;
    var n = c.dmg[dataIdx(lv)];
    if (n === undefined) return null;
    return { per: n, times: hitsOf(c, lv) };
  }

  /* ov（可选）= { per, times }：演出中要显示"实际打出值"时传它。
     不传就是卡面基础值（备战页 / 队列初始态用这个）。 */
  function dmgHtml(c, lv, ov) {
    if (ov && ov.per !== undefined) return fmtDmg(ov.per, ov.times);
    if (!c.dmg || !lv) return '';
    var n = c.dmg[dataIdx(lv)];
    if (n === undefined) return '';
    return fmtDmg(n, hitsOf(c, lv));   /* 连击数可以按等级不同（额外收获 2/2/3） */
  }

  /* 星级：1~3 星一颗单色星；4 星是**四颗彩色星**。
     can4 = 这张卡的 maxLv >= 4 时，**3 星**要多画一颗**暗色空位**，
     告诉玩家"它还能升一星"（否则玩家永远不知道新出的四星存在）。
     ⚠️ 空位只在 3 星出现（用户 2026-10-27 指定），1~2 星不画 —— 免得看着像"已经有 4 星了"。 */
  function starsHtml(lv, can4) {
    var s = '';
    for (var i = 0; i < lv; i++) {
      /* 四星：四颗**彩色**星（红 / 橙 / 绿 / 蓝），和 1~3 星的单色区分开 ——
         这是玩家唯一能一眼认出"这张牌会额外释放一次"的标记。
         1~3 星还是原来那颗，走父级的 `--star`，一个字都没改。 */
      s += lv >= 4 ? '<svg class="st4 c' + (i + 1) + '"><use href="#ic-star"/></svg>' : STAR;
    }
    if (can4 && lv === 3) s += '<svg class="st4 ghost" title="可升到 4 星"><use href="#ic-star"/></svg>';
    return s;
  }

  /* 描述里的 {1/2/3} → 按等级取第几个。
     ⚠️ 必须在 emphasize() **之前**跑：先换数字，再包名词。 */
  var LV_RE = /\{([^{}]*)\}/g;
  function levelText(s, lv) {
    /* 占位 `{4/8/16}` **写几档就用几档**，星级超了取最后一档。
       ⚠️ 不能直接写 (lv||1)-1：只有 3 档的卡到了 4★ 会取到 parts[3] = undefined，
          再被下面的兜底静默换成 parts[0] —— 四星卡面就写着 1★ 的数
          （无尽火力四星显示 +4、实际打 +16，v0.8.33 用户报的）。
       现在 `pick = min(lv, 档数) - 1`：3 档的卡四星读第 3 档（和以前一样），
       真要给四星单独一个数就在占位里写第 4 档（动能积蓄 / 精准积蓄）。 */
    var n = lv || 1;
    return s.replace(LV_RE, function (whole, body) {
      var parts = body.split('/');
      var pick = Math.min(n, parts.length) - 1;
      if (pick < 0) pick = 0;
      return (parts[pick] !== undefined ? parts[pick] : parts[0]).trim();
    });
  }

  /* 描述里用引号包住的词 → 可悬停的名词。中英文两套引号都认。
     ⚠️ 必须在外面再包一层 .cf-desc-in：.cf-desc 是 flex 容器，
        文字和 span 会被拆成并排的几个 flex item，句子就断了。 */
  var KW_RE = /[“「]([^”」]{1,12})[”」]/g;
  function emphasize(s) {
    return s.replace(KW_RE, function (whole, word) {
      return '<span class="kw" data-kw="' + word + '">' + whole + '</span>';
    });
  }

  /* opt: { sel 选中, tight 紧凑(不显示描述), upable 可被升级, pick 可点击 } */
  function cardEl(id, lv, opt) {
    opt = opt || {};
    var c = CARDS[id];
    var d = document.createElement('div');
    if (!c) return d;
    /* 无法升级的卡（noLv）也**照样显示 1 星**（用户 2026-10-26 明确要求）：
       之前是不画星，现在统一画 1 颗。所以这里不再为 noLv 特判成 0 —— 
       卡面数值、星数、data-lv 三处都按 1 走，避免"卡面 0 级、查询 1 级"对不上。
       另外**按卡自己的上限夹一刀**：图鉴切到"4 级"时，没有四星的卡显示成 3 星，
       而不是画 4 颗彩星却按 3 星数值（看着像四星，实际不是）。 */
    var L = Math.min(lv || 1, maxLvOf(c));
    /* 这张卡的四星是不是「额外释放一次」那一种（v0.8.35）：
       `four: 'special'`（升值打击 / 幻化复刻）四星换的是别的效果 → 不画那行、也不缩图形。 */
    var hasDbl = (L >= 4 && c.four !== 'special');

    d.className = 'cf ' + c.cls +
      (opt.tight ? ' tight' : '') + (opt.sel ? ' sel' : '') +
      (opt.upable ? ' upable' : '') + (opt.pick ? ' pick' : '') +
      (opt.dim ? ' dim' : '') +           /* 效果没生效：只暗描述区，卡面其余照旧 */
      (hasDbl ? ' dbl4' : '') +           /* 有四星那行的卡，图形要缩一档给它腾地方 */
      (opt.sell ? ' sellable' : '');       /* 出售模式：整张加一圈红边 */
    d.setAttribute('data-card', id);
    d.setAttribute('data-lv', L);
    d.setAttribute('data-q', c.q || 'gray');
    if (opt.uid) d.setAttribute('data-uid', opt.uid);   /* 拖拽落点要靠它认出是哪一张 */
    if (opt.dim) {
      d.setAttribute('data-dead', '1');
      d.title = opt.why || '这张牌的效果在当前顺序里不生效';
    } else if (opt.sellTip) {
      d.title = opt.sellTip;      /* 出售模式：卖之前就知道能换到多少 */
    } else if (L >= 4) {
      /* 四星的说明放悬停里：卡面描述区是固定高度，塞不下这句话，
         四颗彩星本身当标记（用户 2026-10-26 指定的表现）。
         special 的两种四星各有自己的说法（升值打击 = 已领完奖励，幻化 = 变成 4 星版本）。 */
      d.title = c.fourTip || '四星：这张牌会额外释放一次（攻击再打一遍、效果再生效一次）';
    }
    d.innerHTML =
      '<div class="cf-top">' +
        '<div class="cf-dmg">' +
          dmgHtml(c, L, opt.per === undefined ? null : { per: opt.per, times: opt.times }) +
        '</div>' +
        '<div class="cf-stars">' + starsHtml(L, maxLvOf(c) >= 4) + '</div>' +
      '</div>' +
      '<div class="cf-body">' +
        '<div class="cf-art">' + c.art + '</div>' +
        '<div class="cf-name">' + c.name + '</div>' +
        '<div class="cf-kind"><b>' + c.major + '</b><i>' + c.minor + '</i></div>' +
      '</div>' +
      /* 四星专属那行（用户 2026-10-27）：放在描述区**正上方**，分隔线位置不变，
         所以整排卡不会因为它错位。空间是从图形那里抠的（见 CSS 的 .cf-art 缩小）。
         ⚠️ 只有"额外释放一次"那一种四星才画 —— 升值打击的四星是「无效果」，
            幻化复刻的四星是「变成 4 星版本」，画这句就是骗人。 */
      (hasDbl ? '<div class="cf-dbl">额外释放一次！</div>' : '') +
      '<div class="cf-desc"><div class="cf-desc-in">' +
        /* 卡面描述：四星有自己的说法就用 `desc4`（升值打击 = 无效果 / 幻化 = 4 星版本），
           否则读 3★ 那一档（四星不提供新数据，见 dataIdx 的注释）。 */
        emphasize((L >= 4 && c.desc4) ? c.desc4 : levelText(c.desc, L || 1)) +
        /* 「只在某个位置才生效」的那半句（糖果盛宴的「开幕」）：
           卡面永远显示，**变暗不在这里判** —— 这里没有"位置"这个概念。
           备战页摆进槽位后由 paintPrep 按是不是第一个有牌的槽加 .off。 */
        (c.descOpen ? ' <span class="dneed">' +
          emphasize(levelText(c.descOpen, L || 1)) + '</span>' : '') +
      '</div></div>';
    return d;
  }

  /* ---------- 名词解释浮层 ----------
     位置靠 getBoundingClientRect() 现算，卡片缩放到多大都跟得准。
     事件挂在 document 上：卡片是 paint() 反复重建的，挂到名词自己身上早晚漏绑。 */

  var tipWord = '';        /* 现在挂着的是哪个名词（空 = 没显示）。用来做"再点一下收起" */
  var lastPtr = 'mouse';   /* 上一次交互是鼠标还是手指：触屏上要把 hover 那条路拦掉 */

  function showTip(el) {
    var tip = $('kw-tip');
    if (!tip) return;
    var word = el.getAttribute('data-kw');
    tipWord = word;
    var txt = TERMS[word];
    tip.innerHTML = '<b>' + word + '</b>' + (txt || '这个名词还没有写解释。');
    tip.classList.add('on');
    placeTip(el);
  }

  function placeTip(el) {
    var tip = $('kw-tip');
    if (!tip) return;
    /* ⚠️ 假横屏时 body 转过 90°：rect 是视口坐标、tip 的 left/top 是本地坐标，
       宽高在本地还是反的 —— 统一走 localRect() / viewBox()。 */
    var r = localRect(el);
    var vb = viewBox();
    var w = tip.offsetWidth, h = tip.offsetHeight, gap = 10;

    var left = r.left + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, vb.w - w - 8));

    var top = r.top - h - gap, below = false;
    if (top < 8) { top = r.bottom + gap; below = true; }

    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
    tip.classList.toggle('below', below);

    var ax = r.left + r.width / 2 - left;
    ax = Math.max(11, Math.min(ax, w - 11));
    tip.style.setProperty('--ax', ax + 'px');
  }

  function hideTip() {
    var tip = $('kw-tip');
    if (tip) tip.classList.remove('on');
    tipWord = '';
  }

  /* ---------- 浮层的开关（v0.8.52）----------
     触屏没有 hover：原来只挂 mouseover/mouseout，手指点出来的气泡会一直挂着
     （用户 2026-10-28 报的就是"点空白也不消失"）。现在分两条路：
       · 鼠标：hover 显示 / 移开隐藏（原样，桌面不受影响）；
       · 手指（含笔）：点一下显示，点空白或再点同一个词收起。
     ⚠️ pointerdown 必须走 **capture**（要比卡牌自己的监听早），但**不要 stopPropagation** ——
        长按拖卡还得靠这次 pointerdown 起手。真正拦"选中卡牌"的是下面那个 click。
     ⚠️ 触屏上浏览器还会补一串 mouseover/mouseout，必须用 lastPtr 把 hover 那条路掐掉，
        否则刚收起的气泡会被 synthetic mouseover 立刻弹回来。 */
  document.addEventListener('pointerdown', function (e) {
    var t = (e.pointerType === 'touch') ? 'touch' : 'mouse';
    lastPtr = t;
    var el = e.target && e.target.closest ? e.target.closest('.kw') : null;
    if (!el) { hideTip(); return; }             /* 点空白 / 点别的地方 → 收起 */
    var word = el.getAttribute('data-kw');
    if (t === 'touch' && tipWord === word) { hideTip(); return; }   /* 再点一下收起 */
    showTip(el);
  }, true);
  /* 鼠标一动就把判据切回鼠标（触屏 + 鼠标的混合设备，别把 hover 永久关掉） */
  document.addEventListener('pointermove', function (e) {
    if (e.pointerType) lastPtr = (e.pointerType === 'touch') ? 'touch' : 'mouse';
  }, true);

  /* 点名词**不要**顺带把这张卡选中：一选中就 paint()，卡面被重建，气泡的锚点就没了
     （表现成"点一下闪一下"）。卡牌的监听挂在卡自己身上，document 的 capture 先跑，
     这里 stopPropagation 就够拦住了。 */
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('.kw') : null;
    if (!el) return;
    e.stopPropagation();
    e.preventDefault();
  }, true);

  document.addEventListener('mouseover', function (e) {
    if (lastPtr !== 'mouse') return;            /* 触屏的 synthetic hover 不理 */
    var el = e.target && e.target.closest ? e.target.closest('.kw') : null;
    if (el) showTip(el);
  });
  document.addEventListener('mouseout', function (e) {
    if (lastPtr !== 'mouse') return;
    var el = e.target && e.target.closest ? e.target.closest('.kw') : null;
    if (!el) return;
    var to = e.relatedTarget;
    if (to && el.contains(to)) return;
    hideTip();
  });
  window.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);

  /* 飘字挂在**传进来的槽位元素**上，不再按序号去查 ——
     两屏各有一套槽位，按序号查会飘到备战的格子里去。 */
  function floatNum(box, text, color) {
    if (!box) return;
    var s = document.createElement('span');
    s.textContent = text;
    /* top: -15px —— 浮在卡**上面**。压在卡顶会和卡自己的「27×2」叠成「27×2+54」。
       槽位没有 overflow:hidden，让它溢出到框外是安全的。 */
    s.style.cssText = 'position:absolute;left:50%;top:-15px;transform:translateX(-50%);' +
      'font-size:12.5px;font-weight:800;color:' + (color || '#A97517') + ';' +
      'pointer-events:none;white-space:nowrap;z-index:3;' +
      'animation:fly ' + (FLY / 1000) + 's ease forwards';
    box.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, FLY);
  }

  /* fly 关键帧用 JS 注入一次，省得 CSS 里再写一段跟它无关的东西 */
  (function () {
    var st = document.createElement('style');
    st.textContent = '@keyframes fly{0%{opacity:0;transform:translate(-50%,4px)}' +
                     '20%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}';
    document.head.appendChild(st);
  })();

  /* 出战屏的队列：**进战斗时建一次**，之后只切 class。
     每次都重建的话，新元素没有"上一帧"，transform 过渡会直接跳变，看起来是硬闪。 */
  function buildBattleSlots() {
    if (!elBslots) return;
    elBslots.innerHTML = '';
    bslotEls = [];
    var cap = slotCap();
    for (var i = 0; i < cap; i++) {
      var b = document.createElement('div');
      b.className = 'slot';
      b.setAttribute('data-bslot', i);
      var uid = S.slots[i];
      var c = uid ? cardById(uid) : null;
      /* 队列里的卡用紧凑卡面（不显示描述）：6 张并排只够放
         「数字 / 星 / 图形 / 卡名 / 类型」。 */
      if (c) b.appendChild(cardEl(c.id, c.lv, { tight: true }));
      else b.classList.add('empty');
      var no = document.createElement('span');
      no.className = 'slotno';
      no.textContent = (i + 1);
      b.appendChild(no);
      bslotEls.push(b);
      elBslots.appendChild(b);
    }
    /* 列数交给 CSS 变量（--cap）。不要直接写 gridTemplateColumns ——
       窄屏要靠媒体查询换一套卡宽，内联样式会把那条规则压死。 */
    elBslots.style.setProperty('--cap', cap);
  }

  /* 出战队列里的**实时数值**：把某张牌左上角从"卡面基础值"换成"实际打出值"。
     per / times 直接取 resolve() 日志里的数 —— 别在这里重算加算逻辑，
     否则两套算法迟早漂移（这坑在 S.score 上踩过）。

     比卡面基础值高的那一部分会变黄（伤害和连击**各自独立判断**：
     追击指令只顶伤害、蓄能只顶连击，两者分开才看得出来是谁干的）。

     后面再加"直接加连击数"的 buff 时，唯一要动的就是调用点：
     数值变了就 setSlotVal(槽位, per, times)，它负责重绘 + 闪一下。 */
  function setSlotVal(slot, per, times) {
    var b = bslotEls[slot];
    if (!b || !b.querySelector) return;
    var el = b.querySelector('.cf-dmg');
    if (!el) return;
    var base = baseValOf(slot);
    var t = (times === undefined || times === null) ? 1 : times;
    /* base 为 null 只可能是「幻化复刻」这种自己卡面没伤害数字的卡：
       它平时是空的，战斗中才有数，所以从"无"到"有"也算顶上去（变黄更显眼）。 */
    var up = base
      ? { per: per > base.per, hit: t > base.times }
      : { per: per > 0, hit: false };
    var next = fmtDmg(per, times, up);
    if (el.innerHTML === next) return;         /* 没变就别重排，免得抖一下 */
    el.innerHTML = next;
    el.classList.remove('bump');
    if (el.offsetWidth !== undefined) el.offsetWidth;   /* 强制回流，连着触发也能重播动画 */
    el.classList.add('bump');
  }

  function paint() {
    if (!S) return;
    /* 卡面是整块重建的，名词气泡的锚点跟着没了 —— 别让它留在屏幕上指着一片空白 */
    hideTip();
    syncScreen();
    paintPrep();
    paintPeek();          /* 手牌点开的那张（切屏/换卡/取消选中都要跟着收） */
    paintShop();
    paintBattle();
    if (LAB) labPaint();      /* 实验室面板跟着一起刷（正常玩不执行） */
  }

  /* ---------- 备战屏 ---------- */

  /* 这张卡能不能被"S.targeting 那张升级卡"升级？
     条件三件套：目标不是无等级卡、目标等级没超出升级卡的权限、还没满级。 */
  function canUp(uid) {
    if (!S.targeting || uid === S.targeting) return false;
    return upgradeableBy(cardById(S.targeting), cardById(uid));
  }

  /* 增益徽章：备战页只要 keep:true 的（过回合不清空的那种），出战页全要。
     ⚠️ 别在别处再写一份"要不要显示"的判断 —— 只由 BUFFS[key].keep 决定。
     尾巴固定是「+N 连击」（N = 层数 / every），别在"进度 x/10"和"+N"之间来回换 ——
     同一块地方两种含义，玩家会以为数值在跳。 */
  function paintBuffs(el, opt) {
    if (!el) return;
    var list = buffList(opt);
    el.innerHTML = list.map(function (b) {
      var every = b.every || 0;
      var tail = every > 0 ? '+' + Math.floor(b.n / every) + ' 连击' : '';
      return '<span class="bchip" title="' + (BUFFS[b.key].tip || '') + '">' +
        b.name + '<i>' + b.n + '</i>' + (tail ? '<em>' + tail + '</em>' : '') + '</span>';
    }).join('');
  }

  function paintPrep() {
    var cap = slotCap();

    $('s-round-n').textContent = S.round;
    $('s-coin').textContent = S.coins;
    $('s-deck').textContent = S.deck.length;
    paintBuffs($('s-buffs'), { keepOnly: true });
    /* 本回合的事件徽章（礼盒 / 夜市 / 必现 / 复制） */
    var ev = $('s-event');
    if (ev) {
      var evTxt = eventChipText();
      ev.textContent = evTxt;
      ev.classList.toggle('on', !!evTxt);
    }

    /* 备战屏不再显示"预计得分"（玩家要求去掉），但 order() 还要用一次：
       判断有没有牌、决定出战按钮亮不亮。 */
    var any = order().some(function (x) { return !!x; });

    /* 「效果没生效」的查表：{ 槽位序号: 原因 }。
       **判定规则只写在 resolve() 里**（复活一次就是重跑一遍同一套逻辑），
       这里只把结果搬给卡面，绝不另写一份条件 —— 两边一旦分叉，
       会出现"卡面说明亮、打出来却没生效"这种事。
       例：抢占先机没放最左、幻化复刻前面没有能复刻的牌。
       ⚠️ 这里必须把蓄能传进去：蓄能会改连击数，虽然不影响 dead，
          但同一次结算要两端一致，别让预览和实战跑在两个世界上。 */
    var deadAt = {};
    if (any) {
      resolve(order(), { charge: S.charge, power: powerNow() })
        .log.forEach(function (e) { if (e.dead) deadAt[e.slot] = e.note; });
    }

    $('s-cap').textContent = S.slots.slice(0, cap).filter(function (x) { return !!x; }).length + ' / ' + cap;

    /* 第一个有牌的槽 —— 「开幕」类的那半句描述只有落在这里才该亮着。
       和 resolve 里的 firstReal 同义（那边是"整条队列第一个有牌的"，备战页只看解锁的槽）。 */
    var firstFilled = -1;
    for (var fq = 0; fq < cap; fq++) if (S.slots[fq]) { firstFilled = fq; break; }

    /* 槽位：DOM 只建一次，之后只改 class 和内容（paint 每次操作都会跑） */
    if (slotEls.length !== MAX_SLOT) {
      elSlots.innerHTML = '';
      slotEls = [];
      for (var i = 0; i < MAX_SLOT; i++) {
        var b = document.createElement('div');
        b.className = 'slot';
        b.setAttribute('data-slot', i);
        b.addEventListener('click', (function (k) {
          return function () { if (!swallowClick()) clickSlot(k); };
        })(i));
        slotEls.push(b);
        elSlots.appendChild(b);
      }
    }
    for (var j = 0; j < MAX_SLOT; j++) {
      var box = slotEls[j];
      var locked = j >= cap;
      box.classList.toggle('lock', locked);
      var uid = S.slots[j];
      var c = uid ? cardById(uid) : null;
      /* ⚠️ 槽里可能留着一个**已经不存在的 uid**（卡被卖了 / 合成了，而槽位没同步清）。
         这里必须兜住：直接 c.id 会把整个 paint 崩掉，整页白屏。
         顺手把这个死 uid 清掉，免得每帧都要兜一次。 */
      if (uid && !c) { S.slots[j] = null; uid = null; }
      var filled = !!uid;
      box.classList.toggle('empty', !locked && !filled);
      box.classList.toggle('can', !locked && !!S.pending && S.phase === 'prep');
      /* 内容每次重建：最多 6 个槽，重建比差分便宜，也不会有残留。
         序号放右下角（放左上会被卡牌盖住），锁着的槽不显示 */
      box.innerHTML = '<span class="slotno">' + (j + 1) + '</span>';
      if (!locked && filled) {
        var ce = cardEl(c.id, c.lv, {
          upable: canUp(uid), pick: true, uid: uid,
          dim: !!deadAt[j], why: deadAt[j], sell: S.sellMode,
          sellTip: S.sellMode ? sellText(c.id, c.lv) : ''
        });
        (function (k, u, el) {
          el.addEventListener('click', function (ev) {
            ev.stopPropagation();
            if (swallowClick()) return;      /* 刚拖完，别把浏览器补的 click 当成"取回" */
            clickSlot(k);   /* 升级卡等目标时，clickSlot 内部会转成"升级这张" */
          });
          el.addEventListener('pointerdown', function (ev) { armDrag(ev, u, k, el); });
        })(j, uid, ce);
        /* 描述里"只在最左才生效"的那半句（糖果盛宴）：
           没摆在第一个有牌的槽位就单独变暗，前半句照常。
           ⚠️ 这里不能写 `c.descOpen` —— paintPrep 里的 c 是**卡组里的那张卡**
              （{uid,id,lv}），不是 CARDS 里的定义。直接看有没有渲染出 .dneed 最稳。 */
        var dne = ce.querySelector('.dneed');
        if (dne && j !== firstFilled) dne.classList.add('off');
        box.appendChild(ce);
      }
    }

    /* 手牌 */
    elHand.innerHTML = '';
    /* 手机上那张卡只有 70×93，塞描述等于看不清（用户 2026-10-28）：
       手牌一律用**紧凑卡面**（`.tight` = 不要描述，和出战顺序那排一样），
       想看效果就点一下 —— paintPeek() 会把它原地放大。 */
    var phone = phoneUI();
    var hs = handCards();
    if (!hs.length) {
      var tip = document.createElement('div');
      tip.className = 'empty-tip';
      /* 开局一张卡都没有（起始卡组已删，第 1 回合的卡由事件发），
         这句话要分开说 —— 不然零卡时显示"卡都放上去了"会让人以为游戏坏了 */
      tip.textContent = S.deck.length ? '卡都放上去了。' : '还没有卡牌 —— 去商店（或让事件发）拿几张。';
      elHand.appendChild(tip);
    }
    hs.forEach(function (c) {
      var e = cardEl(c.id, c.lv, {
        sel: S.pending === c.uid,
        pick: true,
        tight: phone,       /* 手机手牌不显示描述，点开才看完整卡面 */
        upable: canUp(c.uid),
        uid: c.uid,
        sell: S.sellMode,
        sellTip: S.sellMode ? sellText(c.id, c.lv) : ''
      });
      e.addEventListener('click', function () {
        if (swallowClick()) return;
        clickCard(c.uid);          /* 升级卡挑目标时，点别的卡 = 升级它 */
      });
      /* 桌面端可以直接把手牌拖进槽位；触屏这条路会被 armDrag 自己挡掉 */
      e.addEventListener('pointerdown', function (ev) { armDrag(ev, c.uid, -1, e); });
      elHand.appendChild(e);
    });

    $('btn-fight').disabled = !any;
    /* 商店不是每回合都有 —— 没有的时候按钮**留着但变灰**，不消失（位置固定，免得布局跳） */
    $('btn-shop').disabled = !shopAvailable();
    /* 出售：一张卡都没有的时候没法卖（也就没法点） */
    var sellBtn = $('btn-sell');
    if (sellBtn) {
      sellBtn.classList.toggle('on', !!S.sellMode);
      sellBtn.disabled = !S.deck.length;
    }
    $('hint').textContent =
      S.sellMode ? '出售模式：点一张卡把它卖掉（再点"出售"退出）' :
      S.targeting ? '点一张卡把它升 1 级（再点自己取消）' :
      (S.pending ? '点一个槽位放入' :
        (any ? '点槽位取回 · 也可以拖动' : '点一张卡，再点槽位放入'));
    maybeDragTip();          /* 触屏第一次进备战页时弹一次"长按能拖"的提示 */
  }

  /* ---------- 商店屏 ---------- */

  function paintShop() {
    if (S.phase !== 'shop') return;

    var cost = rerollCost();

    $('sh-round-n').textContent = S.round;
    $('sh-coin').textContent = S.coins;
    /* 有免费次数就显示还剩几次（此时按钮不花钱）；否则显示 1 币 */
    $('sh-rcost').textContent = S.freeReroll > 0 ? ('免费 ' + S.freeReroll) : (cost + ' 币');
    $('sh-rcost').classList.toggle('free', S.freeReroll > 0);
    /* 钱不够就灰着，但**位置不动** —— 按钮忽隐忽现比变灰难受得多 */
    $('sh-btn-reroll').disabled = S.freeReroll > 0 ? false : S.coins < cost;

    buildShelf();
  }

  /* 货架上这张卡能不能和**手里已有的牌**合成升星（商店屏高亮用）。
     · 判定只复用 canMerge()，不在这儿另写一套"同名同级"比较
     · 扫 S.deck 就等于「出战槽 + 卡组」都扫了 —— S.slots 里存的是 **uid**，
       卡本体全在 deck 里（inSlot / cardById 就是这么分工的）
     · ⚠️ 升级卡（晋升激励 / 升级补丁）**故意不算**：它们是拿去升别人星的道具，
       自己不能合成。noLv 卡本来就被 canMerge 挡掉了，这里再显式挡一道 c.upgrade，
       免得以后给它们加了字段又漏出来高亮成"可合成"骗人（用户明确要求排除）。 */
  function shelfMerges(o) {
    if (!o || o.sold) return false;
    var c = CARDS[o.id];
    if (!c || c.upgrade) return false;
    var probe = { id: o.id, lv: o.lv || 1 };
    for (var i = 0; i < S.deck.length; i++) if (canMerge(probe, S.deck[i])) return true;
    return false;
  }

  /* 三格货架。货是 rollShop() 摇出来的（全部卡都可能出现，见那边的注释），
     这一层只负责画：卡片 + 下面一颗买按钮。
     ⚠️ 每次都整块重建：最多 3 格，重建比差分便宜，也不会有"已售"残留。
     顺带也是「可合成」高亮**唯一的刷新点** —— 买完牌 paint() 会重跑这里，
     刚合出来的 2 星不会再被别的同名 1 星高亮，逻辑天然自洽，不用额外监听。 */
  function buildShelf() {
    if (!elShelf) return;
    elShelf.innerHTML = '';
    var list = S.shop || [];

    for (var i = 0; i < 3; i++) {
      var cell = document.createElement('div');
      cell.className = 'baycell';
      var o = list[i];

      if (!o) {
        cell.className += ' none';
        var tip = document.createElement('span');
        tip.className = 'baynone';
        tip.textContent = '空';
        cell.appendChild(tip);
        elShelf.appendChild(cell);
        continue;
      }

      var mg = shelfMerges(o);
      if (o.sold) cell.className += ' sold';
      else if (mg) cell.className += ' merge';
      cell.appendChild(cardEl(o.id, o.lv || 1));

      if (mg) {
        var tag = document.createElement('b');
        tag.className = 'baymerge';
        tag.textContent = '可合成';
        cell.appendChild(tag);
      }

      var b = document.createElement('button');
      b.className = 'buy' + (o.sold ? '' : ' pri');
      b.textContent = o.sold ? '已售出' : ('买下 · ' + o.price + ' 币');
      b.disabled = o.sold || S.coins < o.price;
      if (mg) b.title = '买下后可以和手里的同名卡合成升星';
      (function (k) {
        b.addEventListener('click', function () { buyOffer(k); });
      })(i);
      cell.appendChild(b);

      elShelf.appendChild(cell);
    }
  }

  /* ---------- 出战屏 ---------- */

  function bumpScore() {
    var el = $('b-score');
    el.classList.remove('bump');
    void el.offsetWidth;          /* 强制作废上一轮动画（假 DOM 里是 undefined，无害） */
    el.classList.add('bump');
  }

  function paintBattle() {
    if (S.phase === 'prep' || S.phase === 'shop') return;   /* 这两屏不碰这块，省得白跑一遍 */

    var th = tiersOf(S.round);
    var max = th[2] || 1;

    $('b-round-n').textContent = S.round;
    $('b-coin').textContent = S.coins;
    $('b-score').textContent = S.score;
    /* 演出席左上角的增益徽章：出战页**全部**显示（含会清空的那种），
       和备战页只显示 keep 的那批不一样，所以这里不传 keepOnly。 */
    paintBuffs($('b-buffs'), {
      power: livePower >= 0 ? livePower : null,
      load: S.phase === 'battle' ? liveLoad : 0
    });

    /* 对面站谁：只看 ROUNDS 里的 mob 字段（纯外观，别在这里加数值条件） */
    var mob = $('mob');
    if (mob) {
      var boss = mobOfRound(S.round) === 'boss';
      mob.classList.toggle('is-boss', boss);
      mob.classList.toggle('is-small', !boss);
    }
    /* 条长 = 第三档阈值，够了就顶满（分数不封顶，会继续涨） */
    $('b-fill').style.width = Math.min(100, S.score / max * 100) + '%';

    /* 三档标记上的金币数按**本回合**的表来（第 9 回合是 [0,0,0]，
       那一回合不靠档位给币，所以干脆不写"+0 币"） */
    var tc = tierCoinOf(S.round);
    var noCoin = !tc[0] && !tc[1] && !tc[2];
    for (var t = 0; t < 3; t++) {
      var hit = S.score >= th[t];
      var tick = $('b-tick-' + t);
      tick.style.left = Math.min(100, th[t] / max * 100) + '%';
      tick.classList.toggle('on', hit);
      $('b-tk-' + t).textContent = th[t];
      $('b-tg-' + t).textContent = noCoin ? '' : ('+' + tc[t] + ' 币');
    }

    var got = coinsFor(S.score, S.round);
    $('b-gain').textContent = noCoin ? '最终分数' : ('+' + got + ' 币');
    $('b-gain').classList.toggle('zero', !noCoin && got === 0);
    $('b-gain').classList.toggle('final', noCoin);

    var total = 0;
    for (var k = 0; k < slotCap(); k++) if (S.slots[k]) total++;
    $('b-step').textContent = (S.phase === 'battle' ? Math.max(0, S.step + 1) : total) + ' / ' + total;

    for (var i = 0; i < bslotEls.length; i++) {
      var b = bslotEls[i];
      b.classList.toggle('act', S.phase === 'battle' && i === S.step);
      b.classList.toggle('done',
        (S.phase === 'battle' && S.step >= 0 && i < S.step) ||
        ((S.phase === 'result' || S.phase === 'over') && !!S.slots[i]));
    }

    $('btn-skip').hidden = S.phase !== 'battle';
  }

  /* 中央演出席：上方小字（哪张牌）、中间大数字（这一击的伤害）、下方补充说明。
     idle = true 表示这一击没伤害（空过 / 升级道具），数字换成灰字。
     ⚠️ 拆成 setLabel / setNum 两半，是为了让**数字晚一拍**：
        攻击前摇时只出卡名，刀落下那一帧（42% / 穿刺 50%）数字才砸进来。 */
  function setLabel(label, sub) {
    var lab = $('hitlab'); if (lab) lab.textContent = label;
    var s = $('hitsub'); if (s) s.textContent = sub || '';
  }
  function setNum(num, idle) {
    var n = $('hitnum');
    if (!n) return;
    n.textContent = num;
    n.classList.toggle('idle', !!idle);
    n.classList.remove('dim', 'pop');
    void n.offsetWidth;              /* 强制作废上一轮动画，否则连击时不会再弹 */
    if (!idle) n.classList.add('pop');
  }
  function setStage(label, num, sub, idle) { setLabel(label, sub); setNum(num, idle); }

  /* 冲击圈：每出手一次炸一圈，颜色跟着卡牌类型走；同时抖一下整个演出席。
     ⚠️ 抖的是 .arena 整体，别抖 .stage —— 那会把两个角色的相对位置抖散。 */
  function boom(cls, kind) {
    var b = $('boom');
    if (!b) return;
    /* 第二参数是**冲击圈形状**：chop 下劈 / sweep 横扫 / thrust 贯穿（见 CSS 的 .boom.*） */
    b.className = 'boom ' + (cls || 'atk') + ' ' + (kind || 'chop');
    void b.offsetWidth;
    b.classList.add('go');
    var a = $('arena');
    if (a && a.classList) {
      a.classList.remove('shake');
      void a.offsetWidth;
      a.classList.add('shake');
      timers.push(setTimeout(function () { a.classList.remove('shake'); },
        Math.round(200 * SPEED)));
    }
  }

  /* 穿刺专用的演出层：漫画集中线 + 贯穿白线 + 黑白帧。
     ⚠️ 必须**命中帧**才放（放早了就变成"蓄力时先炸"）。
     黑白帧走 .arena 的 filter 过渡（加类、不是动画 —— .arena 上已经挂着 .shake）。 */
  /* 漫画拟声字（v3.0）：只在**撞击点**出现 —— 斩 / 唰 / 贯穿 / 破 / 铛。
     序号 `_sfxSeq` 是给连击用的：上一条的定时器不能把新一轮的 show 摘掉。
     ⚠️ 文字走 CSS 的 `content: attr(data-text)`，所以这里是 setAttribute 而不是 textContent。 */
  function mangaSfx(kind) {
    var el = $('manga-sfx');
    if (!el) return;
    var types = ['chop', 'sweep', 'pierce', 'finish', 'guard'];
    var type = kind === 'atk2' ? 'sweep' : (types.indexOf(kind) >= 0 ? kind : 'chop');
    var text = { chop: '斩！', sweep: '唰！', pierce: '贯穿！', finish: '破！', guard: '铛！' };
    el.classList.remove('show', 'sfx-chop', 'sfx-sweep', 'sfx-pierce', 'sfx-finish', 'sfx-guard');
    el.setAttribute('data-text', text[type]);
    el._sfxSeq = (el._sfxSeq || 0) + 1;
    var my = el._sfxSeq;
    void el.offsetWidth;                 /* 强制回流：连着两击也能重播 */
    el.classList.add('sfx-' + type, 'show');
    timers.push(setTimeout(function () {
      if (el._sfxSeq === my) el.classList.remove('show');
    }, Math.round(450 * SPEED)));
  }

  function impactBurst(kind) {
    var a = $('arena');
    if (!a || !a.classList) return;
    a.classList.remove('impact', 'mono', 'impact-normal', 'impact-chop', 'impact-sweep');
    void a.offsetWidth;
    a.classList.add('impact', 'mono');
    mangaSfx(kind === 'finish' ? 'finish' : 'pierce');
    timers.push(setTimeout(function () { a.classList.remove('impact'); },
      Math.round(420 * SPEED)));
    timers.push(setTimeout(function () { a.classList.remove('mono'); },
      Math.round(110 * SPEED)));
  }
  /* 普通攻击的冲击帧：短，不抢终结技的完整黑白演出（白闪 + 方向性斩痕 + 碎屑） */
  function normalImpact(kind) {
    var a = $('arena');
    if (!a || !a.classList) return;
    var cls = kind === 'atk2' ? 'impact-sweep' : 'impact-chop';
    a.classList.remove('impact-chop', 'impact-sweep', 'impact-normal');
    void a.offsetWidth;
    a.classList.add(cls, 'impact-normal');
    mangaSfx(kind);
    timers.push(setTimeout(function () { a.classList.remove('impact-normal'); },
      Math.round(72 * SPEED)));
    timers.push(setTimeout(function () { a.classList.remove(cls); },
      Math.round(330 * SPEED)));
  }
  /* 演出层的复位（开打前 / 跳过演出时都要跑，否则会残留震屏、黑白、集中线、镜头） */
  function resetArenaFx() {
    var a = $('arena');
    if (a && a.classList) {
      a.classList.remove('shake', 'pierce', 'fin', 'impact', 'mono',
        'cam-chop', 'cam-sweep', 'impact-chop', 'impact-sweep', 'impact-normal');
    }
    /* v3：拟声字是靠定时器摘 show 的，跳过演出时定时器被清掉 → 得手动收 */
    var sfx = $('manga-sfx');
    if (sfx && sfx.classList) sfx.classList.remove('show');
  }

  /* ---------- 怪物身上的伤害跳字 ----------
     规则：**每一下伤害跳一个数**。100×1 跳一个 100，100×2 跳两个 100，以此类推。
     数字取的是 `per`（每击伤害），不是 `dmg`（总伤害）—— 总伤害已经在
     中央演出席那个大数字里了，这里要的是"挨了几下、每下多疼"。
     ⚠️ 连击上限（v0.8.41 改）：用户要"叠了高连击的把怪淹掉"的爽感，所以上限从 10 提到
        **240**（窄屏 120）。这不是玩法上限，只是 DOM 性能的保险丝 —— 满蓄能的 1001 连击
        会跳满 240 个，剩下的靠中央大数字和「×N 连击」那行交代。
     ⚠️ 落点用**固定表轮转**，不用 Math.random —— 演出要可复现，截图才好比对。
        表从 12 个点扩到 260 个（确定性 LCG 生成）：240 个字挤在 12 个点会糊成一坨，
        摊开之后才看得出"一片数字在飞"。
     ⚠️ 节点挂在 #mob 里面的 #hitnums 上（和 .boom 同理），坐标按怪物框的百分比算，
        换屏幕宽度不会飞偏。 */
  var HIT_FLOAT = (typeof window !== 'undefined' && window.innerWidth &&
                   window.innerWidth < 620) ? 120 : 240;   /* 一次攻击最多跳几个字（性能保险丝） */
  var hitPosIdx = 0;       /* 轮转下标：连着两张牌不会都从同一个点冒出来 */
  /* 260 个落点，确定性生成（同一次运行永远一样，截图可复现）。
     x ∈ 20~80%、y ∈ 10~78%，铺满整个怪物（只集中在上半部会显得没淹住）。 */
  var HIT_POS = (function () {
    var a = [], seed = 20261027;
    var rnd = function () {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    };
    for (var i = 0; i < 260; i++) {
      a.push([Math.round(20 + rnd() * 60), Math.round(10 + rnd() * 68)]);
    }
    return a;
  })();

  function mobFloats(times, per) {
    var layer = $('hitnums');
    if (!layer || !(times > 0) || !(per > 0)) return;
    var n = Math.min(times, HIT_FLOAT);
    /* 多下的时候把出手节奏摊开，但整串要在下一张牌开口（ANIM）之前收尾 */
