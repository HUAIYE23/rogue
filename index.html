<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>井底牌局</title>
<style>
/* 井底牌局 · 单文件零依赖（框架版 v0.4.1）
   视觉沿用 game-hub 的暖米色纸感（#F2F0E9），卡牌按类型分三种色：
     攻击 = 陶土红 / 增益 = 苔绿 / 特殊 = 靛紫。

   ⚠️ 四层结构，别混：
     1) 纯逻辑 resolve()   —— 输入槽位顺序，输出战斗日志。不碰 DOM、不碰计时器。
     2) 状态机 S           —— 回合 / 阶段 / 金币 / 卡组 / 槽位。
     3) 回放 playback()    —— 拿着日志一条条演，演完调 applyResult()。
     4) 三屏渲染 paintPrep() / paintShop() / paintBattle()
        —— 屏幕归属由 phase 派生（prep / shop / 其余都归出战屏），不单独存状态。
   测试只跑 1 和 2，所以不需要假造动画，也不会因为 420ms 的延迟而 flaky。 */

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #F2F0E9; color: #5C544C;
  font: 14px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  display: flex; justify-content: center;
  padding: 18px 16px 26px;
  -webkit-tap-highlight-color: transparent;
}
.app { width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: 14px; }
/* 出战屏保持原来的 860：擂台的镜头/穿刺特写都是按这个宽度调的，别跟着放宽。
   备战 / 商店这两屏才是"看卡"的地方 —— 放宽带是为了把卡面撑大（v0.8.28 用户：
   "卡牌描述的字小的快看不见了"）。 */
body.battle .app { max-width: 860px; }

/* ---------- 顶部：回合 / 退出 / 金币 ---------- */
.ptop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pleft { display: flex; align-items: center; gap: 9px; }
.rp { font-size: 13px; font-weight: 600; color: #4E473F; background: #E8E2D4;
  padding: 6px 12px 7px; border-radius: 9px; letter-spacing: .02em; }
.rp b { font-size: 18px; color: #A97517; font-variant-numeric: tabular-nums; }
.rp i { font-style: normal; font-size: 11px; color: #A09C92; }
.qbtn { font-size: 11.5px; padding: 6px 12px; border-radius: 8px; color: #8E8578;
  background: transparent; border-color: transparent; }
.qbtn:hover { background: #E8E2D4; color: #6B645B; border-color: #E8E2D4; }

.sbox { min-width: 66px; padding: 5px 10px 6px; border-radius: 9px; background: #DED8C8; text-align: center; }
.sbox b { display: block; font-size: 9px; font-weight: 500; letter-spacing: .12em; color: #8E8578; }
.sbox span { display: block; font-size: 17px; font-weight: 700; color: #4E473F; font-variant-numeric: tabular-nums; }
.sbox.coin span { color: #A97517; }

/* ---------- 增益徽章（蓄能等） ----------
   备战页挂在 .pleft 里（"退出"右边），出战页绝对定位到 .arena 左上角。
   层数本身用 <i>，斜杠后的说明用 <em>（都重置掉默认斜体）。 */
.blist { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bchip { display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 10px 5px;
  border-radius: 999px; background: rgba(76, 122, 30, .13); color: #4C7A1E;
  border: 1px solid rgba(76, 122, 30, .22); font-size: 10.5px; font-weight: 600;
  letter-spacing: .04em; white-space: nowrap; }
.bchip i { font-style: normal; font-size: 14px; font-weight: 800;
  font-variant-numeric: tabular-nums; }
.bchip em { font-style: normal; font-size: 9.5px; font-weight: 500; opacity: .72; }
/* 出战页：压在演出席左上角，别盖住角色（角色在中下方） */
.blist.babs { position: absolute; left: 10px; top: 8px; z-index: 3; max-width: 60%; }

.hint { margin-left: auto; font-size: 11px; color: #A09C92; }
.th i { font-style: normal; color: #A09C92; font-variant-numeric: tabular-nums; }
.th i.hit { color: #A97517; font-weight: 700; }
.hpbar { height: 9px; border-radius: 5px; background: #E6E0D2; overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; border-radius: 5px;
  background: #C05A32; transition: width .3s ease; }

/* ---------- 卡组 / 出战顺序 ---------- */
.lab { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #A09C92;
  letter-spacing: .08em; margin-bottom: 8px; }
.lab span { color: #8E8578; font-variant-numeric: tabular-nums; }
.lab .sub { font-size: 10.5px; color: #B4AFA3; letter-spacing: 0; }

/* 出战顺序：第 1 回合只解锁 2 格，但**永远按 6 列排**，
   这样每格宽度不会随回合跳动，解锁的过程是"格子亮起来"而不是"格子被撑开" */
.slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; }
/* 备战槽（v0.8.28 放大）：
   —— 槽按 3:4 走，宽度由 6 等分决定，高度**跟着宽度自动算**（不再写死 176px）。
   —— 卡面用 `container-type: inline-size` + `cqi` 自己算 --u：
        --u = (槽宽 − 左右各 5px) / 12   →  卡面正好铺满槽（12em × 16em），
        换屏幕宽度时卡面等比缩放，**不会出现"卡比格子宽、压到隔壁"**。
      以前是写死 `--u: 10.4px`，格子一变宽卡还是那么大，右侧永远空一条。
   ⚠️ `.slot` 是共用的（出战屏的 `.bslots .slot` 也用），所以只对 `.slots` 下的生效。 */
.slots .slot { container-type: inline-size; aspect-ratio: 3 / 4; min-height: 0; }
.slots .slot .cf { --u: calc((100cqi - 10px) / 12); width: auto; height: auto; }
.slot { position: relative; min-height: 176px; border-radius: 12px; border: 1px dashed #C9C2B2;
  background: #EFEBE0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color .12s, background .12s,
  transform .18s ease, box-shadow .18s ease, opacity .2s ease; }
.slot.lock { border-style: solid; border-color: #E2DCCC; background: #E8E3D7; cursor: default; }
.slot.lock::after { content: "未解锁"; font-size: 10px; color: #B4AFA3; letter-spacing: .06em; }
.slot.empty::after { content: "空"; font-size: 12px; color: #C2BCAE; }
.slot.can { border-color: #A97517; background: #FBF3E2; }
/* 出手弹跳。⚠️ 关键帧**自带 -7px 的抬升基线**（和 .bslots .slot.act 一致）：
   animation 会盖掉元素上的 transform，如果从 translateY(0) 起跳，
   动画这一整段时间里"当前出手的那张"反而落回原位，结束后再猛地弹起来。
   另外它比 ANIM 短（×.62），一拍里先跳完再静置，慢节奏下才不会像卡住。 */
.slot.fire { animation: fire calc(.42s * var(--spd, 1) * .62) ease; }
@keyframes fire { 0% { transform: translateY(-7px); } 26% { transform: translateY(-17px); }
  58% { transform: translateY(-3px); } 100% { transform: translateY(-7px); } }
.slot .slotno { position: absolute; right: 6px; bottom: 4px; font-size: 9.5px; color: #C2BCAE;
  pointer-events: none; }
.slot.lock .slotno { display: none; }

/* 卡组：卡片按 3:4 排版，留着以后贴卡面 */
.hand { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 9px; min-height: 40px; }
.hand .empty-tip { font-size: 12px; color: #B4AFA3; padding: 14px 2px; }

/* ============================================================
   卡面（正式样式，与 _cards.html / _codex.html 同一份）
   ————————————————————————————————————————————
   尺寸单位：--u（1 单位 = --u 像素），所有排版用 em，比例恒 3:4。
   各处的 --u 由下面的「容器尺寸」统一给，不要在 JS 里写内联 --u。
   上半 = 伤害×连击 / 等级星 / 图形 / 卡名 / 双类型；下半 = 效果描述。
   ============================================================ */
.cf {
  --u: 10px;
  --ink: #8C3C20;
  --ink2: #8A6250;
  --accent: #A8492A;
  --chip: rgba(168, 73, 42, .13);
  --star: #B9B3A6;

  /* 品质底色兜底 = 灰色（漏写 data-q 也不会变白卡） */
  --bg1: #F8F5EF;
  --bg2: #E9E3D6;
  --bd: #CEC6B6;
  --line: #DDD6C7;

  /* 描述两态：默认明亮（生效中），加 .dim 变暗淡（未生效） */
  --desc-ink: var(--ink2);
  --desc-kw: var(--accent);
  --desc-bg: rgba(255, 255, 255, .42);
  --dim-ink: #9E978C;
  --dim-kw: #9C8B7E;

  box-sizing: border-box;
  position: relative;
  flex: none;
  width: 12em;
  height: 16em;
  font-size: var(--u);
  display: flex;
  flex-direction: column;
  padding: 0.85em 0.85em 0;
  border-radius: 0.85em;
  border: 1px solid var(--bd);
  background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 66%);
  box-shadow: inset 0 0 0 0.22em rgba(255, 255, 255, .5),
              0 2px 6px rgba(120, 84, 62, .10);
  overflow: hidden;
  user-select: none;
  transition: transform .12s ease, box-shadow .14s ease;
}

/* ---------- 类型：只管文字 / 数字 / 标签的颜色 ---------- */
.cf.atk  { --dim-kw: #B08D7C; }
.cf.buff { --ink: #3F6B16; --ink2: #6E7A50; --accent: #4C7A1E;
           --chip: rgba(76, 122, 30, .13); --dim-kw: #8E967E; }
.cf.sp   { --ink: #463C9E; --ink2: #6F6A9B; --accent: #534AB7;
           --chip: rgba(83, 74, 183, .13); --dim-kw: #8D89A6; }

/* ---------- 品质：只管底色 / 描边 / 分隔线（别在类型里写 --bg*） ---------- */
.cf[data-q="gray"]   { --bg1: #F8F5EF; --bg2: #E9E3D6; --bd: #CEC6B6; --line: #DDD6C7; }
.cf[data-q="blue"]   { --bg1: #F2F7FD; --bg2: #DEEAF8; --bd: #B6CCE6; --line: #C9DBEF; }
.cf[data-q="purple"] { --bg1: #F7F3FD; --bg2: #E6DEF7; --bd: #C4B9E4; --line: #D7CDEE; }
.cf[data-q="gold"]   { --bg1: #FEF8E9; --bg2: #F6E7C4; --bd: #DCC28C; --line: #EFDAB0; }

/* ---------- 等级：一灰 / 二蓝 / 三金 / 四彩 ---------- */
.cf[data-lv="1"] { --star: #B9B3A6; }
.cf[data-lv="2"] { --star: #4C7FB0; }
.cf[data-lv="3"] { --star: #C79A2E; }
/* 四星（v0.8.31）：**四颗彩色星**，每颗一个颜色，一眼区别于 1~3 星的单色。
   颜色写在 .cf-stars 的子选择器上（单颗 <svg> 的 color 覆盖父级的 --star 即可，
   图标 symbol 用的是 fill="currentColor"）。 */
.cf[data-lv="4"] { --star: #C79A2E; }
.cf-stars .st4.c1 { color: #E0574E; }
.cf-stars .st4.c2 { color: #E8A83C; }
.cf-stars .st4.c3 { color: #4C9E5A; }
.cf-stars .st4.c4 { color: #4C7FB0; }
/* 3★ 时给"能升四星"的卡补一颗**暗色空位**（用户 2026-10-27：表示该卡可以升级四星）。
   比正常星暗一档 + 细描边，看着像"还没点亮"，不会误读成已经有 4 颗星。 */
.cf-stars .st4.ghost { color: #CFC7B4; opacity: .5; }
/* 四星那句「额外释放一次！」：画在描述区**正上方**（分隔线位置不动，整排卡不会错位）。
   这一行是从图形那里抠出来的空间 —— 四星卡的 .cf-art 缩到 3.4em，间距也收一点。 */
.cf-dbl { display: flex; align-items: center; justify-content: center; flex: none;
  height: 1.25em; margin: 0 -0.85em; padding: 0 .8em;
  border-top: 1px solid var(--line);
  background: rgba(232, 168, 60, .18);
  font-size: .84em; font-weight: 800; letter-spacing: .05em;
  color: #A8681A; white-space: nowrap; }
/* 四星卡的图形缩一档，给「额外释放一次！」那行腾地方。
   ⚠️ 只对 `.dbl4`（真的有那行的卡）生效：升值打击 / 幻化复刻的四星没有那行，
      跟着缩会白留一条空隙。 */
.cf.dbl4 .cf-art { width: 3.4em; height: 3.4em; }
.cf.dbl4 .cf-body { gap: .28em; padding: .1em 0 .25em; }
/* 出战队列是紧凑模式（连描述都不画），这行也不画 */
.cf.tight .cf-dbl { display: none; }

/* ---------- 描述暗淡（效果未生效） ---------- */
.cf.dim {
  --desc-ink: var(--dim-ink);
  --desc-kw: var(--dim-kw);
  --desc-bg: rgba(255, 255, 255, .14);
}

.cf-top { display: flex; align-items: flex-start; justify-content: space-between;
  gap: .3em; height: 1.7em; flex: none; }
.cf-dmg { display: flex; align-items: baseline; font-size: 1.65em; font-weight: 800;
  line-height: 1; letter-spacing: -.02em; color: var(--accent);
  font-variant-numeric: tabular-nums; }
.cf-dmg i { font-style: normal; font-size: .68em; font-weight: 700; opacity: .82; margin-left: .04em; }
/* 数字太长（上限 9999999×1001 一共 12 个字符）→ 按字符数缩两档，别顶穿卡面/压到星星。
   档位由 fmtDmg() 按字符数写死，缩放用 em（相对 .cf-dmg 的 1.65em）。 */
.cf-dmg .f1 { font-size: .8em; letter-spacing: -.04em; }
.cf-dmg .f2 { font-size: .66em; letter-spacing: -.05em; }
.cf-dmg .f3 { font-size: .5em; letter-spacing: -.06em; }
/* 局内被顶高的数值 → 黄色（用户 2026-10-26：伤害或连击比**卡面基础值**高就高亮）。
   只由 setSlotVal() 打标，备战页/图鉴/填写页永远不带这个 class。
   ⚠️ 用 #B87700 而不是亮黄：卡面是米黄纸底，亮黄会糊掉；这个色在纸底上够跳也够"黄"。 */
.cf-dmg .vup { color: #B87700; font-weight: 900;
  text-shadow: 0 0 .22em rgba(232, 168, 40, .55); }
.cf-dmg i.vup { opacity: 1; }
/* 演出中数值被顶上去时闪一下 —— 只由 setSlotVal() 加 .bump，别在别处复用 */
.cf-dmg { transform-origin: left top; }
.cf-dmg.bump { animation: dmgUp calc(.36s * var(--spd, 1)) ease-out; }
@keyframes dmgUp {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.16); color: #C0552E; }
  100% { transform: scale(1); }
}
.cf-stars { display: flex; gap: .12em; padding-top: .12em; color: var(--star); }
.cf-stars svg { width: 1.15em; height: 1.15em; display: block; }

.cf-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: .45em; padding: .1em 0 .4em; }
.cf-art { width: 4.2em; height: 4.2em; flex: none; }
.cf-art svg { width: 100%; height: 100%; display: block; }
.cf-name { font-size: 1.42em; font-weight: 800; line-height: 1.05; color: var(--ink);
  letter-spacing: .04em; text-align: center; white-space: nowrap; }
.cf-kind { display: flex; align-items: center; gap: .34em; font-size: .9em;
  line-height: 1; white-space: nowrap; }
.cf-kind b { font-weight: 700; color: var(--accent); background: var(--chip);
  padding: .24em .52em; border-radius: .4em; }
.cf-kind i { font-style: normal; color: var(--ink2); opacity: .95; }

.cf-desc { flex: none; height: 5.1em; margin: 0 -0.85em; padding: .65em .8em;
  border-top: 1px solid var(--line); background: var(--desc-bg);
  font-size: .92em; line-height: 1.4; color: var(--desc-ink);
  display: flex; align-items: center; overflow: hidden;
  transition: color .16s ease, background .16s ease; }
/* ⚠️ 必须再包一层：.cf-desc 是 flex 容器，直接放“文字 + span.kw”
   会被拆成多个 flex item，句子就断成几截了。 */
.cf-desc-in { width: 100%; }

/* 描述里的名词 */
.cf .kw { font-weight: 800; color: var(--desc-kw); text-decoration: underline dashed;
  text-decoration-thickness: .09em; text-underline-offset: .2em; cursor: help;
  transition: color .16s ease; }
.cf .kw:hover { background: var(--chip); border-radius: .22em; }
.cf.dim .kw:hover { color: var(--accent); }

/* 描述里"只有在某个位置才生效"的那半句（v0.8.26 糖果盛宴的「开幕」）：
   卡面永远显示；玩家没把它摆到该在的位置时**只暗这半句**，前半句照常亮着。
   ⚠️ .off 只由 paintPrep 给**槽位里的卡**加 —— 手牌 / 图鉴 / 商店里没有"位置"，永远不暗。 */
.cf-desc-in .dneed { display: inline; }
.cf-desc-in .dneed.off { opacity: .3; }

/* 紧凑模式：出战队列里空间小，只留「数字 / 星 / 图形 / 卡名 / 类型」 */
.cf.tight .cf-desc { display: none; }
.cf.tight .cf-body { padding: .3em 0 1em; gap: .6em; }
.cf.tight .cf-art { width: 4.8em; height: 4.8em; }

/* ---------- 容器尺寸：一张卡摆在哪，就换哪个 --u ---------- */
/* 手牌：v0.8.28 从 9.4 提到 11.6（113×150 → 139×185），描述字号 10.7px。
   手牌是自动换行的，放大只会少放一张，不会溢出。 */
.hand .cf { --u: 11.6px; }
/* ⚠️ 备战槽的 --u 不在这里给：它按槽宽用 cqi 现算（见上面「备战槽」那段），
   写死一个数会在窄屏压到隔壁、在宽屏右侧空一条。这里只留出战屏的兜底。 */
.slot .cf { --u: 10.4px; }
.baycell .cf { --u: 13.6px; }
.bslots .cf { --u: 9px; }

/* 手牌会涨到十几张，装不下自动换行 */
.hand .cf { flex: 0 0 auto; }

/* 槽里的卡绝对定位铺满（留 5px 边）：槽只有 min-height，
   百分比高度在 flex 里会算成 auto，卡就不撑满了。 */
.slot .cf { position: absolute; inset: 5px; }
.slot .slotno { z-index: 2; }

.cf.sel { outline: 2px solid #A97517; outline-offset: 1px; transform: translateY(-3px); }
.cf.pick { cursor: pointer; }
.cf.pick:hover { transform: translateY(-3px); }
/* 升级卡选中时，可被升级的目标卡亮起来 */
.cf.upable { box-shadow: inset 0 0 0 .22em rgba(255,255,255,.5),
  0 0 0 2px #A97517, 0 8px 18px rgba(120,84,62,.22); }
/* 拖拽时提示"拖到这张身上可以合成升星" */
.cf.merge-hot { transform: translateY(-2px);
  box-shadow: inset 0 0 0 .22em rgba(255,255,255,.5),
    0 0 0 2px #C79A2E, 0 10px 20px rgba(199,154,46,.3); }

/* 名词解释浮层。
   ⚠️ 必须挂在 body 上：.cf 有 overflow:hidden，浮层放在卡面里会被裁掉。
   用 position:fixed 跟着名词走；页面一滚就收起来，比跟着飘干净。 */
#kw-tip {
  position: fixed; z-index: 999; left: 0; top: 0;
  max-width: 15.5em; padding: .62em .78em .7em;
  border-radius: .55em; background: #4A443C; color: #F3EDDE;
  box-shadow: 0 .5em 1.4em rgba(48, 40, 30, .3);
  font-size: 12px; line-height: 1.55;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(3px);
  transition: opacity .12s ease, transform .12s ease;
  --ax: 50%;
}
#kw-tip.on { opacity: 1; visibility: visible; transform: translateY(0); }
#kw-tip b { display: block; color: #F0CB82; font-size: 12.5px;
  letter-spacing: .06em; margin-bottom: .15em; }
#kw-tip::after { content: ""; position: absolute; left: var(--ax); bottom: -.27em;
  width: .64em; height: .64em; background: #4A443C;
  transform: translateX(-50%) rotate(45deg); border-radius: .08em; }
#kw-tip.below::after { bottom: auto; top: -.27em; }

/* 底部：左商店 / 中出售区 / 右出战 */
.pfoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pfoot-l { display: flex; align-items: center; gap: 8px; }
.pfoot #btn-shop, .pfoot #btn-prep { min-width: 112px; padding: 11px 20px; }
.pfoot #btn-sell { min-width: 82px; padding: 11px 16px; }
/* 出售模式：按钮变红，卡片也加一圈红边提示"点一下就没了" */
.pfoot #btn-sell.on { background: #F7E1D8; border-color: #C07A56; color: #9A4A28;
  font-weight: 700; }
.cf.sellable { box-shadow: inset 0 0 0 .22em rgba(255, 255, 255, .5),
  0 0 0 2px #C0704A, 0 8px 18px rgba(160, 80, 50, .2); }

/* ---------- 出售区（电脑端专用） ----------
   触屏不拖卡，所以这一块整个隐藏，手机继续用左下角的「出售」按钮 + 点卡卖掉。
   桌面上那个按钮则反过来隐藏（见下面 @media (hover:none) 那段的反向规则）。 */
.sellzone { flex: 1 1 auto; max-width: 470px; min-height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 0 14px; border: 1.5px dashed transparent; border-radius: 10px;
  font-size: 12.5px; color: #9A4A28; white-space: nowrap; overflow: hidden;
  opacity: 0; visibility: hidden;      /* 平时不可见，但**留位置**：拖动时出现不会把布局顶跳 */
  transition: opacity .14s, background .14s, border-color .14s; }
.sellzone .szlab { font-size: 10.5px; letter-spacing: .04em; color: #B98A6E; }
.sellzone .szcard { font-weight: 700; color: #6B4A38; max-width: 120px;
  overflow: hidden; text-overflow: ellipsis; }
.sellzone .szval { font-weight: 700; color: #A8492A; font-variant-numeric: tabular-nums; }
.sellzone .szval.chg { color: #2F7A6B; }        /* 积蓄系：卖的是蓄能，换个色 */
.sellzone .szval.full { color: #8E8578; font-weight: 500; }   /* 蓄能已满：卖了不涨 */
body.dragging .sellzone { opacity: 1; visibility: visible;
  border-color: #D9A084; background: #FDF3EE; }
body.dragging .sellzone.over { border-color: #B4572E; background: #F7E1D8;
  box-shadow: 0 0 0 3px rgba(180, 87, 46, .16); }
.sellzone.over .szlab { color: #B4572E; }
/* 触屏（v0.8.49）：**不再有「出售」按钮**，改成"拖到从底部滑出的抛售条"上。
   这条是固定浮层：平时收在屏幕外，拖起卡才滑出来 —— 不占布局位置，
   也就不会像桌面那样靠"留白占位"把底栏挤动。 */
@media (hover: none), (pointer: coarse) {
  .pfoot #btn-sell { display: none; }
  .sellzone {
    position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 58;
    max-width: none; min-height: 48px; margin: 0;
    transform: translateY(160%);
    transition: transform .18s ease, opacity .14s, background .14s, border-color .14s;
  }
  body.dragging .sellzone { transform: none; }
}
/* 反过来：桌面鼠标设备隐藏「出售」按钮（拖拽取而代之） */
@media (hover: hover) and (pointer: fine) {
  .pfoot #btn-sell { display: none; }
}
.pfoot #btn-fight { min-width: 210px; padding: 13px 36px; font-size: 15px;
  font-weight: 700; letter-spacing: .14em; }
.bfoot { display: flex; justify-content: flex-end; }

button { font: inherit; font-size: 12.5px; padding: 9px 15px; border-radius: 9px;
  border: 1px solid #C9C2B2; background: #FBF9F3; color: #6B645B; cursor: pointer;
  transition: background .12s, transform .07s; }
button:hover { background: #fff; }
button:active { transform: translateY(1px); }
button.pri { background: #7A6F5E; border-color: #7A6F5E; color: #FBF6E9; }
button.pri:hover { background: #6C6252; }
button:disabled { opacity: .38; cursor: default; transform: none; background: #EFEBE0;
  border-color: #DCD5C5; color: #A09C92; }
button:disabled:hover { background: #EFEBE0; color: #A09C92; }
button.big { flex: 1; padding: 12px; font-size: 14px; font-weight: 600; }
button.ghost { background: transparent; }

/* ---------- 浮层（结算 / 提示） ---------- */
.mask { position: fixed; inset: 0; background: rgba(60, 54, 46, .38);
  display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
.mask.on { display: flex; }
.panel { width: 100%; max-width: 520px; max-height: 88vh; overflow: auto;
  background: #FBF9F3; border-radius: 14px; padding: 16px 16px 15px;
  box-shadow: 0 18px 50px rgba(60, 54, 46, .22); }
.panel h2 { margin: 0 0 3px; font-size: 16px; color: #4E473F; }
.panel p.sub { margin: 0 0 12px; font-size: 11.5px; color: #A09C92; }

/* ---------- 排行榜（v1.10，仅服务器版） ----------
   面板复用 .panel；这里只加"标签页 + 榜单行"两坨样式。
   ⚠️ 昵称是玩家输入，渲染时必须过 lbEsc()，别直接拼 HTML。 */
.lbtabs { display: flex; gap: 4px; margin: 10px 0 8px; }
.lbtabs button { flex: 1; font-size: 12px; padding: 6px 0; border-radius: 8px; cursor: pointer;
  border: 1px solid #E2DCCC; background: #FBF8F0; color: #8E8578; }
.lbtabs button.on { background: #7A6F5E; border-color: #7A6F5E; color: #FBF6E9; font-weight: 700; }
.lbrk { font-size: 12px; font-weight: 800; color: #B0AA9C; text-align: center;
  font-variant-numeric: tabular-nums; }
.lbp-row.top1 .lbrk { color: #C08A16; }
.lbnm { font-size: 12.5px; color: #4E473F; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.lbsc { font-size: 13px; font-weight: 800; color: #A8492A; font-variant-numeric: tabular-nums; }
.lbempty { padding: 26px 0; text-align: center; font-size: 12px; color: #B0AA9C; }
.lbmine { background: none; border: none; padding: 0 2px; font-size: 11px; color: #A97517;
  cursor: pointer; text-decoration: underline; }

/* ---------- 整页排行榜（/rogue/lb，v0.8.46） ----------
   页面本身是 index.html 的一个模式（server.js 的 /rogue/lb 直接发这份文件）：
   卡面样式和 cardEl() 都在这份文件里，另建一个 html 就得复制整份卡面 CSS，改一次走样一次。
   这里只做两件事：藏掉游戏界面、摆一整页榜单。 */
body.lbon .app, body.lbon .mask { display: none !important; }
.lbpage { display: none; }
body.lbon .lbpage { display: block; width: 100%; max-width: 1120px; }
.lbp-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.lbp-title { font-size: 21px; font-weight: 800; color: #4E473F; letter-spacing: .02em; }
.lbp-sub { font-size: 11.5px; line-height: 1.75; color: #9A9184; margin-top: 5px; max-width: 780px; }
.lbp-sub b { color: #8E8578; }
.lbp-act { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
.lbp-me { font-size: 11.5px; color: #9A9184; }
.lbp-me b { color: #4E473F; }
.lbp-back { border: 1px solid #E2DCCC; background: #FBF8F0; }
.lbp-tabs { margin: 14px 0 12px; }
.lbp-tabs button { font-size: 13px; padding: 8px 0; }
.lbp-list { display: flex; flex-direction: column; gap: 10px; }
.lbp-row { border-radius: 12px; border: 1px solid #EFE9DB; background: #FDFBF5;
  padding: 10px 12px 12px; }
.lbp-row.top1 { border-color: #DCC48A; background: #FFFBEF; }
.lbp-row.me { box-shadow: inset 0 0 0 1px rgba(201,169,78,.38); }
.lbp-head { display: flex; align-items: baseline; gap: 10px; }
.lbp-head .lbrk { width: 26px; font-size: 13px; }
.lbp-head .lbnm { flex: 1; font-size: 13.5px; font-weight: 600; }
.lbp-head .lbsc { font-size: 15px; }
.lbp-path { font-size: 10.5px; color: #8E8578; background: #EFEBE0; border-radius: 999px;
  padding: 2px 8px; }
/* 一排卡面：--u 只给这一处，卡本身仍是 12em × 16em（11px → 132×176） */
/* 卡组换行而不是横向滚动：一排看不全时宁可折行，也不想让玩家以为卡被裁掉了。 */
.lbp-deck { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.lbp-deck .cf { --u: 11px; }
.lbp-nocard { font-size: 11px; color: #B0AA9C; align-self: center; white-space: nowrap; }
@media (max-width: 820px) {
  .lbp-top { flex-direction: column; }
  .lbp-act { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; }
  .lbp-deck .cf { --u: 8px; }
}

/* ---------- 卡牌图鉴浮层 ----------
   和结算 / 事件共用 .mask 的遮罩，但面板更宽（要摆一整排卡）。
   ⚠️ 卡面直接复用 cardEl()，和手牌 / 商店是同一份渲染，别另写一套。
   ⚠️ 数据读 CARDS（和结算同源）；`_codex.html` 里那份是设计稿，别往这儿抄。 */
.cdxmask { z-index: 30; }
.cdxpanel { width: 100%; max-width: 940px; max-height: 88vh; display: flex; flex-direction: column;
  background: #FBF9F3; border-radius: 16px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(60, 54, 46, .22); }
.cdxhd { display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  border-bottom: 1px solid #E7E0CF; background: #FDFBF5; }
.cdxhd b { font-size: 15px; color: #4E473F; letter-spacing: .04em; }
.cdxsub { font-size: 11.5px; color: #A09C92; font-variant-numeric: tabular-nums; }
.cdxlv { margin-left: auto; display: flex; gap: 4px; }
.cdxlv button { font-size: 11.5px; padding: 5px 11px; border-radius: 8px;
  border: 1px solid #E2DCCC; background: #FBF8F0; color: #8E8578; cursor: pointer; }
.cdxlv button.on { background: #7A6F5E; border-color: #7A6F5E; color: #FBF6E9; font-weight: 700; }
.cdxx { width: 30px; height: 30px; padding: 0; border-radius: 8px; font-size: 17px; line-height: 1;
  border: 1px solid #E2DCCC; background: #FBF8F0; color: #8E8578; cursor: pointer; }
.cdxx:hover { background: #F0EADB; color: #6B645B; }
.cdxfl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 10px 16px; border-bottom: 1px solid #EFE9DB; }
.cdxlab { font-size: 11px; color: #B0AA9C; letter-spacing: .08em; }
.cdxchip { font-size: 12px; padding: 4px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid #DCD5C5; background: #FBF9F3; color: #8E8578; }
.cdxchip:hover { border-color: #BCB4A2; }
.cdxchip.on { background: #7A6F5E; border-color: #7A6F5E; color: #FBF6E9; font-weight: 700; }
.cdxsep { width: 1px; height: 16px; background: #E2DCCC; margin: 0 4px; }
.cdxgrid { flex: 1; min-height: 0; overflow-y: auto; padding: 16px;
  display: grid; gap: 14px; justify-items: center;
  grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); }
.cdxgrid .cf { --u: 11px; }   /* 132×176，一行能摆 6 张（v0.8.28 放大） */
.cdxempty { grid-column: 1 / -1; padding: 40px 0; text-align: center;
  font-size: 12.5px; color: #B0AA9C; letter-spacing: .06em; }
@media (max-width: 560px) and (orientation: landscape),
       (max-width: 560px) and (pointer: fine) {
  .cdxgrid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; padding: 12px; }
  .cdxgrid .cf { --u: 7.4px; }
  .cdxhd { padding: 10px 12px; gap: 8px; }
  .cdxhd b { font-size: 13.5px; }
  .cdxfl { padding: 8px 12px; }
  .cdxchip { font-size: 11px; padding: 3px 9px; }
}

/* ---------- 新手教程浮层 ----------
   三层分工：
     #tuto-blk  z 39  挡操作（四块矩形夹出一个"允许区"，区外的点击全部吃掉）
     #tuto-hi   z 40  高亮 + 压暗（靠那圈 9999px 的 box-shadow 把框外压暗，不用额外遮罩）
     #tuto-bub  z 41  讲解气泡（本体 pointer-events:none，只有按钮能点 —— 免得挡住目标）
   ⚠️ 高亮区 = **本步允许操作的区域**，不是"想让你看的那一个元素"：
      两者不一致时（比如"合成"要拖整排手牌），亮的是允许区，玩家才不会以为别的卡点不动。
*/
.tuto-blk { position: fixed; inset: 0; z-index: 39; display: none; pointer-events: none; }
.tuto-blk.on { display: block; }
/* ⚠️ 容器本身必须 pointer-events:none，只有四块矩形 auto ——
   容器是 inset:0 盖满全屏的，一旦能收事件，中间的"洞"就永远点不到了（踩过）。 */
.tuto-blk i { position: absolute; display: block; background: transparent; pointer-events: auto; }
.tuto-hi { position: fixed; z-index: 40; pointer-events: none; border-radius: 12px;
  border: 2px solid #C79A2E; display: none;
  box-shadow: 0 0 0 3px rgba(199, 154, 46, .22), 0 0 0 9999px rgba(46, 40, 32, .38);
  transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease; }
.tuto-hi.on { display: block; }
.tutobub { position: fixed; z-index: 41; width: 320px; max-width: calc(100vw - 24px);
  padding: 12px 14px 11px; background: #FFFCF2; border: 1px solid #E0D3B0; border-radius: 12px;
  box-shadow: 0 12px 30px rgba(60, 54, 46, .28); pointer-events: none; }
.tutobub .stp { font-size: 10.5px; color: #B0AA9C; letter-spacing: .1em; margin-bottom: 3px; }
.tutobub .txt { font-size: 12.5px; line-height: 1.75; color: #5C564A; }
.tutobub .txt b { color: #8A5A12; }
.tutobub .ft { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.tutobub button { font: inherit; font-size: 12px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid #D9CFB4; background: #FBF8F0; color: #8E8578; pointer-events: auto; }
.tutobub .nx { background: #A97517; border-color: #A97517; color: #FFF9EC; font-weight: 700; }
.tutobub .nx:hover { background: #96690F; }
.tutobub .skip { border-color: transparent; background: transparent; font-size: 11px;
  color: #B0AA9C; text-decoration: underline; padding: 4px 2px; }
.tutobub .skip:hover { color: #8E8578; }
@media (max-width: 560px) { .tutobub { width: 280px; font-size: 12px; } }
.res-line { display: flex; align-items: baseline; justify-content: space-between;
  padding: 7px 0; border-bottom: 1px dashed #E6E0D2; font-size: 12px; color: #8E8578; }
.res-line b { font-size: 15px; color: #4E473F; font-variant-numeric: tabular-nums; }
.res-line.coin b { color: #A97517; }
.tierrow { display: flex; gap: 6px; margin: 10px 0 14px; }
.tier { flex: 1; text-align: center; font-size: 10.5px; padding: 6px 0; border-radius: 8px;
  background: #EFEBE0; color: #A09C92; border: 1px solid transparent; }
.tier.on { background: #FAEEDA; color: #854F0B; border-color: #EFCF9A; }

/* ============================================================
   第三屏：商店
   和出征屏一样，靠 body 上的一个类切换（body.shop），
   归属仍然从 S.phase 派生 —— 不额外存"当前在哪个界面"。
   顶栏是备战屏那份的**复制品**（id 前缀 sh-），
   这样"回合 / 退出 / 金币"三样在商店里位置一模一样，不用共享 DOM。
   ============================================================ */
#scr-shop { display: none; }
body.shop #scr-prep { display: none; }
body.shop #scr-shop { display: flex; }

/* 顶栏右侧：金币 + 下面的刷新按钮 */
.pright { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.reroll { display: flex; align-items: center; gap: 7px; }
.reroll button { padding: 5px 12px; font-size: 11.5px; }
.rcost { font-size: 11px; color: #A97517; font-variant-numeric: tabular-nums; }

/* 三个货格。卡片不参与拉伸，统一 3:4，和卡组里的卡是同一个比例 */
.bay { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.baycell { position: relative; border: 1px solid #E2DCCC; border-radius: 14px;
  background: linear-gradient(180deg, #FBF9F3 0%, #F4EFE2 100%);
  padding: 16px 14px; min-height: 384px;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; }
.baycell .card { flex: none; width: 100%; max-width: 190px; aspect-ratio: 3 / 4; cursor: default; }
.baycell .card:hover { transform: none; }
.baycell .buy { width: 100%; max-width: 190px; padding: 10px; font-size: 12.5px; font-weight: 600; }
.baycell.sold { background: #EFEBE0; }
.baycell.sold .card { opacity: .3; filter: grayscale(.7); }
.baycell.none { border-style: dashed; justify-content: center; background: #F2EEE3; }
.baynone { font-size: 12px; color: #C2BCAE; letter-spacing: .12em; }

/* 货架上「能和手里的同名卡合成升星」的那一格（用户 2026-10-26 要求）：
   金框呼吸 + 卡面外圈金描边 + 顶上一枚「可合成」小标 + 买按钮变金。
   ⚠️ 小标必须**绝对定位**，别加成货格的 flex 子元素 ——
      货格是 justify-content:space-between 的定高布局，塞个元素进去会把卡挤歪。
   ⚠️ 买按钮的样式只给 :not(:disabled)：否则会盖掉 button:disabled 的「买不起」灰脸。 */
.baycell.merge { border-color: #D8A32B;
  background: linear-gradient(180deg, #FFF8E2 0%, #F6EAC8 100%);
  animation: bayMergeGlow 2.2s ease-in-out infinite; }
@keyframes bayMergeGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(216, 163, 43, 0), 0 6px 16px -12px rgba(216, 163, 43, .45); }
  50%      { box-shadow: 0 0 0 3px rgba(216, 163, 43, .18), 0 10px 24px -8px rgba(216, 163, 43, .62); }
}
.baycell.merge .cf { outline: 2px solid rgba(216, 163, 43, .85); outline-offset: 2px; }
.baymerge { position: absolute; z-index: 3; top: -6px; left: 50%; transform: translateX(-50%);
  padding: 2px 8px; border-radius: 999px;
  background: linear-gradient(180deg, #F8CD55, #DFA318); border: 1px solid #C68F10;
  color: #40300A; font-size: 10px; font-weight: 800; line-height: 1.3;
  letter-spacing: .08em; white-space: nowrap; pointer-events: none;
  box-shadow: 0 2px 5px rgba(150, 110, 20, .3); }
.baycell.merge .buy:not(:disabled) { background: linear-gradient(180deg, #F8CD55, #E3AA20);
  border-color: #C68F10; color: #40300A; font-weight: 800; }
/* 上面那条比 button:hover 更具体，会把 hover 的白底吃掉，这里补一个更亮的金 */
.baycell.merge .buy:not(:disabled):hover { background: linear-gradient(180deg, #FFDF83, #EFB62C); }

/* ============================================================
   第二屏：出战界面（v0.5.0 重做）
   ————————————————————————————————————————————
   没有怪物血条 —— **伤害不再被截断**，打多少就是多少分。
   自上而下：左上 回合+退出 / 上方 三档进度条 / 中间 演出 / 下方 出手顺序。
   ============================================================ */
#scr-battle { display: none; min-height: calc(100vh - 64px); }
body.battle #scr-prep { display: none; }
body.battle #scr-battle { display: flex; }

/* ---------- 上方：分数 + 三档进度条 ---------- */
.prog { display: flex; flex-direction: column; gap: 9px; }
.prog-top { display: flex; align-items: baseline; gap: 9px; }
.plab { font-size: 10.5px; letter-spacing: .16em; color: #A09C92; }
#b-score { font-size: 27px; font-weight: 800; line-height: 1; color: #A97517;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
#b-score.bump { animation: bump calc(.26s * var(--spd, 1)) ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
.pgain { margin-left: auto; font-size: 12.5px; font-weight: 700; color: #A97517;
  font-variant-numeric: tabular-nums; }
.pgain.zero { color: #B4AFA3; font-weight: 400; }
/* 最后一回合：不给币，这里改写「最终分数」 */
.pgain.final { color: #7A6F5E; letter-spacing: .04em; }

/* ---------- 本回合事件徽章（备战屏顶栏） ---------- */
.evchip { display: none; max-width: 268px; padding: 5px 10px 6px; border-radius: 999px;
  background: rgba(83, 74, 183, .10); border: 1px solid rgba(83, 74, 183, .22);
  color: #534AB7; font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evchip.on { display: block; }

/* ---------- 事件选择面板（回合开始的二选一） ---------- */
.evs { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.ev { display: block; width: 100%; text-align: left; padding: 13px 15px 12px;
  border-radius: 11px; border-color: #DFD8C8; background: #FCFAF4; cursor: pointer; }
.ev:hover { background: #FFFDF8; border-color: #C9BFA6; }
.ev b { display: block; font-size: 13.5px; color: #4E473F; letter-spacing: .04em; margin-bottom: 3px; }
.ev span { display: block; font-size: 11.5px; line-height: 1.65; color: #7E776C; }
/* 事件卡里原来还有一行 `<i>`（黄色的小字，写"三张都是灰色、之后商店只刷通用和本系"）。
   v0.8.42 起不再渲染 —— 那是隐藏机制，不能摆在玩家面前。数据 `EVENTS[].note` 还在，
   只有实验室（?lab=1）会显示，调数值时还能查。别把这条样式也删了又当它不存在：
   以后真要在卡上加说明，重新加一条规则即可。 */
.rcost.free { color: #4C7A1E; }
.res-line.final b { font-size: 20px; color: #A8492A; }

/* 条本身。三档刻度用 em 画，标签挂在刻度下面（第一档常居左、最后一档贴右，
   否则会顶出容器）。条的总长 = 第三档阈值，超过就顶满。 */
.pbar { position: relative; height: 15px; border-radius: 8px; background: #E6E0D2; margin-bottom: 26px; }
.pbar > i { display: block; height: 100%; width: 0; border-radius: 8px;
  background: linear-gradient(90deg, #C79A2E 0%, #A97517 100%);
  transition: width .34s cubic-bezier(.3,1,.5,1); }
.pbar > em { position: absolute; top: -3px; width: 2px; height: 21px; background: #CFC7B4;
  transform: translateX(-1px); transition: background .2s, box-shadow .2s; }
.pbar > em.on { background: #7A6F5E; }
.pbar > em > b { position: absolute; top: 21px; left: 50%; transform: translateX(-50%);
  font-size: 11px; font-weight: 600; color: #B4AFA3; white-space: nowrap;
  font-variant-numeric: tabular-nums; transition: color .2s; }
.pbar > em.on > b { color: #A97517; }
.pbar > em > span { position: absolute; top: 37px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: #C6C0B2; white-space: nowrap; transition: color .2s; }
.pbar > em.on > span { color: #A97517; font-weight: 600; }
.pbar > em:first-of-type > b, .pbar > em:first-of-type > span { left: 0; transform: none; }
.pbar > em:last-of-type > b, .pbar > em:last-of-type > span { left: auto; right: 0; transform: none; }

/* ---------- 演出席 ----------
   ⚠️ 角色动作一律用 calc(.38s * var(--spd, 1)) —— 比一张牌的间隔（.42s × spd）
      略短，保证一拍里动作演完再切下一张；写死秒数就会和 SPEED 错位。
   ⚠️ 一个元素上**只能挂一组 transform 动画**（后加的会盖掉前面的），
      所以分层：.fig 管"前冲/挨打"，里面的 .breath 管呼吸，.arm-* 管手臂。 */
.arena { position: relative; flex: 1 1 auto; min-height: 268px; border-radius: 16px;
  border: 1px solid #E2DCCC; overflow: hidden;
  background: radial-gradient(circle at 50% 58%, #FCFAF4 0%, #F2ECDE 58%, #E9E2D0 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 16px 16px 12px; }

/* 地平线：贴着 .stage 底部（= 脚底）。⚠️ 挂在 .stage 上而不是 .arena 上，
   否则窄屏 / 宽屏下这条线会横穿整个画面，脚却只占中间一小块。 */
.stage { position: relative; z-index: 2; display: flex; align-items: flex-end;
  justify-content: center; width: 100%; max-width: 460px; margin: 0 auto; gap: 2px; }
.stage::after { content: ""; position: absolute; left: -34px; right: -34px; bottom: -3px;
  height: 1px; pointer-events: none;
  background: linear-gradient(90deg, rgba(178,168,148,0) 0%, rgba(178,168,148,.5) 14%,
    rgba(178,168,148,.5) 86%, rgba(178,168,148,0) 100%); }

.fighter { position: relative; flex: none; }
.fighter .fig { display: block; height: auto; }
/* 脚下阴影 */
.fighter::after { content: ""; position: absolute; left: 50%; bottom: -2px; width: 66%; height: 9px;
  transform: translateX(-50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(120,104,80,.24) 0%, rgba(120,104,80,0) 72%); }

/* ---------- 火柴人（玩家）：一套有骨骼分层的 rig ----------
   一眼看上去是一张图，实际是**五层各自绕自己的关节转**：
     .fig        整个人（前冲 / 后坐 / 落地）    原点 50% 98%（脚底）
       .breath   呼吸（只在待机时跑，出手时关掉，免得破坏停顿帧）
         .body   残影（drop-shadow 拖尾，只包身体，不包刀光）
           .legs > .leg-front / .leg-back      原点 48,80（髋）
           .torso > .arm-back / .spine / .head / .arm-front   原点 48,80、48,48（肩）
         .swoosh-wind / .swoosh / .swoosh-2 / .swoosh-3      刀光（不参与任何旋转）
   ⚠️ SVG 里旋转必须 transform-box: view-box + **固定 px 的原点**，
      不写的话 px 按"元素包围盒"算，关节会跑掉。
   ⚠️ 出手时刀会甩到 viewBox 外（-90° 时刀尖在 y≈-4），所以 .fig 要 overflow: visible，
      否则刀尖会被裁掉一截。 */
.hero .fig { width: clamp(72px, 11.5vh, 112px); aspect-ratio: 96 / 132;
  overflow: visible; position: relative; z-index: 1; }
/* 一次攻击的总时长：等于游戏里一张牌的间隔 ANIM（420×spd），1000ms @ spd 2.5。
   ⚠️ 必须定义在 **.arena** 上，不能只写在 .hero 上：
      镜头（`.arena.pierce .stage`）和主角是两个分支，只写在 .hero 上的话
      `.stage` 取不到这个变量，整条 `animation` 声明会被判为无效 → **镜头动画根本不会跑**
      （踩过：一开始就写在 .hero 上，逐帧截图时才发现 stage 的 transform 一直是 none）。
   穿刺单独放慢到 620ms（1.55×），见 .arena.pierce。 */
.arena { --atk: calc(.40s * var(--spd, 1)); }
.arena.pierce { --atk: calc(.62s * var(--spd, 1)); }
/* 破防处决更慢（2.45×）：拔剑 → 突进 → 顶盾僵持 → 压裂 → 破盾贯穿 → 回位收鞘。 */
.arena.fin { --atk: calc(.98s * var(--spd, 1)); }
.hero .fig line, .hero .fig .head, .hero .fig .spine {
  fill: none; stroke: #45403A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.hero .fig .blade { stroke: #8A6A44; stroke-width: 5.2; }
.hero .fig .tip { fill: #B0801C; stroke: none; }

.hero .torso, .hero .arm-front, .hero .arm-back,
.hero .leg-front, .hero .leg-back, .hero .elbow-front, .hero .elbow-back,
.hero .knee-front, .hero .knee-back, .hero .weapon, .hero .head,
.hero .scarf-tail, .hero .scabbard, .hero .foot-front, .hero .foot-back,
.hero .sword-shine { transform-box: view-box; }
.hero .torso, .hero .leg-front, .hero .leg-back { transform-origin: 48px 80px; }
.hero .arm-front, .hero .arm-back { transform-origin: 48px 48px; }
.hero .elbow-front, .hero .weapon { transform-origin: 62px 50px; }
.hero .elbow-back { transform-origin: 39px 57px; }
.hero .knee-front { transform-origin: 55px 96px; }
.hero .knee-back { transform-origin: 41px 96px; }
.hero .foot-front { transform-origin: 61px 112px; }
.hero .foot-back { transform-origin: 36px 112px; }
.hero .head { transform-origin: 48px 36px; }
.hero .scarf-tail { transform-origin: 46px 39px; }
.hero .weapon { transform-origin: 75px 42px; opacity: 0; }
.hero .sword-shine { transform-origin: 88px 31px; }
.hero .scabbard { transform-origin: 45px 72px; }
.hero .pelvis, .hero .shoulders { fill: none; stroke: #45403A; stroke-width: 4.2;
  stroke-linecap: round; }
.hero .weapon path { stroke-linecap: round; stroke-linejoin: round; }
.hero .sword-grip { fill: none; stroke: #3B332C; stroke-width: 4.5; }
.hero .sword-pommel { fill: #B68A48; stroke: #6F5128; stroke-width: 1.2; }
.hero .sword-guard { fill: none; stroke: #B68A48; stroke-width: 3.5; }
.hero .sword-blade { fill: url(#bladeSteel); stroke: #51463C; stroke-width: 1.2; }
.hero .sword-edge { fill: none; stroke: #FFF6D9; stroke-width: 1.6; }
.hero .sword-shine { fill: none; stroke: #FFF1B8; stroke-width: 2.1; opacity: 0;
  filter: drop-shadow(0 0 3px #E8B852); }
.hero .scabbard path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.hero .sheath-body { stroke: #2D2A28; stroke-width: 8; }
.hero .sheath-inlay { stroke: #5D554B; stroke-width: 2; }
.hero .sheath-mouth, .hero .sheath-cap { stroke: #B68A48; stroke-width: 3; }
.hero .sheathed-handle path { stroke: #45403A; stroke-width: 4; }
.hero .sheathed-handle .sword-guard { stroke: #B68A48; stroke-width: 3; }
.hero .sheath-glint { stroke: #FFE6A0; stroke-width: 2.2; opacity: 0;
  filter: drop-shadow(0 0 4px rgba(238,180,72,.9)); }
.hero .face { fill: none; stroke: #45403A; }

@keyframes heroBreath { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.4px); } }
.hero .breath { animation: heroBreath 2.8s ease-in-out infinite; }
/* 出手期间停呼吸：呼吸那 2px 的上下浮动会让"命中停顿"这张定格一抖一抖的 */
.hero.atk .breath, .hero.atk2 .breath, .hero.atk3 .breath { animation: none; }

/* ============================================================
   攻击：一段 1000ms（`.40s × spd`）的五幕剧，百分比就是分镜表。
   ————————————————————————————————————————————
   0–26%   前摇：重心后坐、腰后仰、刀举到脑后（越压越慢）
   26–31%  **压到底的静止**：数值和 26% 一样 —— 没有这一拍就没有张力
   31–42%  爆发：110ms 内整个人扑出去 + 腰甩 + 刀抡过 150°
   42–52%  命中停顿：**所有数值和 42% 一模一样**，100ms 完全定格
            （JS 在 ANIM×0.42 这一帧才炸冲击圈 / 抖怪 / 跳字，所以"刀到"和"挨打"是同一瞬间）
   52–70%  击退：反作用力把自己弹回来一点，怪物同时被推飞
   70–100% 收招：走位收回、刀带回来、92% 处一个小过冲再落定
   ⚠️ 手臂的缓动曲线别收得太狠：`cubic-bezier(.1,.92,.18,1)` 在 10% 处就吃掉 62% 的行程，
      视觉上"刀早就抡完了"，前摇白做。这里用 (.18,.72,.42,1)。
   ============================================================ */
@keyframes heroDash {
  0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
  7%   { transform: translate(-3%, 1%) rotate(-2deg) scale(.99); }
  16%  { transform: translate(-7%, 3%) rotate(-4.5deg) scale(.975); }
  26%  { transform: translate(-10%, 5%) rotate(-6deg) scale(.965); }
  31%  { transform: translate(-10%, 5%) rotate(-6deg) scale(.965);
         animation-timing-function: cubic-bezier(.16,.76,.28,1); }
  38%  { transform: translate(18%, -2%) rotate(2deg) scale(1.025); }
  42%  { transform: translate(28%, 2%) rotate(4deg) scale(1.02); }
  52%  { transform: translate(28%, 2%) rotate(4deg) scale(1.02); }
  58%  { transform: translate(20%, 1%) rotate(2.5deg) scale(1.01); }
  70%  { transform: translate(12%, 0) rotate(1.5deg) scale(1); }
  82%  { transform: translate(4%, 0) rotate(.5deg) scale(1); }
  92%  { transform: translate(1%, 0) rotate(0deg) scale(1); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}
/* 残影：高速移动时身后拖两层半透明影子（drop-shadow 偏移做，零额外 DOM）。
   ⚠️ 只挂在 .body 上 —— 挂到 .fig 会把刀光也复制一份，糊成一团。 */
@keyframes heroSmear {
  0%, 32%  { filter: none; }
  38%      { filter: drop-shadow(-7px 0 0 rgba(69,64,58,.22)) drop-shadow(-16px 0 0 rgba(69,64,58,.1)); }
  42%, 52% { filter: drop-shadow(-6px 0 0 rgba(69,64,58,.17)) drop-shadow(-13px 0 0 rgba(69,64,58,.07)); }
  64%      { filter: none; }
  100%     { filter: none; }
}
/* 穿刺版残影：拖得更远（人已经到对面了，身后一串"曾经在这里"的影子） */
@keyframes heroSmearLong {
  0%, 30%  { filter: none; }
  36%      { filter: drop-shadow(-14px 0 0 rgba(69,64,58,.3)) drop-shadow(-30px 0 0 rgba(69,64,58,.16))
                     drop-shadow(-48px 0 0 rgba(69,64,58,.08)); }
  42%, 52% { filter: drop-shadow(-12px 0 0 rgba(69,64,58,.26)) drop-shadow(-26px 0 0 rgba(69,64,58,.13))
                     drop-shadow(-42px 0 0 rgba(69,64,58,.06)); }
  60%      { filter: none; }
  100%     { filter: none; }
}
/* 上身绕髋 (48,80) 后仰蓄力 / 前压甩斩 —— 主要的前倾在这里，
   根部（.fig）只转 8°，不然整个人会像扑倒（腿还留在原地）。 */
@keyframes heroLean {
  0%   { transform: rotate(0deg); }
  10%  { transform: rotate(-3deg); }
  18%  { transform: rotate(-7deg); }
  26%  { transform: rotate(-11deg); }
  31%  { transform: rotate(-11deg); animation-timing-function: cubic-bezier(.18,.72,.42,1); }
  40%  { transform: rotate(12deg); }
  42%, 52% { transform: rotate(19deg); }
  62%  { transform: rotate(10deg); animation-timing-function: cubic-bezier(.25,.8,.3,1); }
  74%  { transform: rotate(7deg); }
  88%  { transform: rotate(2deg); }
  94%  { transform: rotate(-2deg); }
  100% { transform: rotate(0deg); }
}
@keyframes heroSlash {
  0%   { transform: rotate(65deg); }                 /* 0–20%：看清楚的拔剑 */
  8%   { transform: rotate(60deg); }
  14%  { transform: rotate(36deg); }
  20%  { transform: rotate(-28deg); }
  26%  { transform: rotate(-84deg); }
  31%  { transform: rotate(-92deg); animation-timing-function: cubic-bezier(.18,.72,.42,1); }
  40%  { transform: rotate(30deg); }
  42%, 52% { transform: rotate(54deg); }
  62%  { transform: rotate(42deg); }
  76%  { transform: rotate(26deg); }
  84%  { transform: rotate(18deg); }                 /* 80–100%：回腰、对准鞘口 */
  92%  { transform: rotate(56deg); }
  97%, 100% { transform: rotate(65deg); }
}
@keyframes heroBackArm {
  0%, 8% { transform: rotate(0deg); }
  18%  { transform: rotate(24deg); }                 /* 蓄力时反手向后撑 */
  26%  { transform: rotate(30deg); }
  31%  { transform: rotate(30deg); animation-timing-function: cubic-bezier(.18,.72,.42,1); }
  40%  { transform: rotate(-26deg); }                /* 甩腰时反向配平 */
  42%, 52% { transform: rotate(-34deg); }
  68%  { transform: rotate(-14deg); }
  84%  { transform: rotate(-4deg); }
  100% { transform: rotate(0deg); }
}
@keyframes heroLegF {
  0%, 8% { transform: rotate(0deg); }
  20% { transform: rotate(-4deg); }
  26%, 31% { transform: rotate(-9deg); }
  38% { transform: rotate(4deg); }
  42%, 52% { transform: rotate(10deg); }
  70% { transform: rotate(5deg); }
  84% { transform: rotate(-2deg); }
  100% { transform: rotate(0deg); }
}
@keyframes heroLegB {
  0%, 8% { transform: rotate(0deg); }
  20% { transform: rotate(3deg); }
  26%, 31% { transform: rotate(7deg); }
  42%, 52% { transform: rotate(-9deg); }
  70% { transform: rotate(-4deg); }
  84% { transform: rotate(2deg); }
  100% { transform: rotate(0deg); }
}

/* 刀光：三条同心弧（外晕 / 主光 / 高光芯），用 pathLength=100 做"画出来"的效果。
   两套：`-d` = 下劈（上半圈）/ `-s` = 横扫（下半圈），同一圆心、反向 sweep。
   ⚠️ 弧心就是肩关节 (48,48)、半径 52–56 = 刀尖轨迹。
      端点是**刀的行程**（下劈 -144°→+48°、横扫 +109°→-34°），
      改动作角度就要跟着改端点，否则光弧会跑到刀的后面去。 */
.hero .arc-d, .hero .arc-s, .hero .wind-d, .hero .wind-s, .hero .thr {
  stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
/* ⚠️ `.thr`（穿刺的直线刀光）**必须**在这条基础规则里：漏了它，刀光没有 dasharray/dashoffset，
   平时就是一条完整的线挂在刀尖上永远不消失（用户 2026-10-26 截图报的就是这个）。 */
@keyframes swooshDraw {
  0%, 30%  { opacity: 0; stroke-dashoffset: 100; }
  34%      { opacity: .85; stroke-dashoffset: 100; }
  42%      { opacity: 1; stroke-dashoffset: 0; }      /* 与命中帧同刻画完 */
  52%      { opacity: 1; stroke-dashoffset: 0; }      /* 定格期间刀光留着 */
  72%      { opacity: 0; stroke-dashoffset: 0; }
  100%     { opacity: 0; stroke-dashoffset: 0; }
}
/* 前摇微光：一小段弧正好压在举起来（或垂下去）的刀身上，蓄满就消失，把注意力交给主光 */
@keyframes swooshWind {
  0%, 6%   { opacity: 0; stroke-dashoffset: 100; }
  18%      { opacity: .5; stroke-dashoffset: 52; }
  26%      { opacity: .95; stroke-dashoffset: 0; }
  31%      { opacity: 0; stroke-dashoffset: 0; }
  100%     { opacity: 0; stroke-dashoffset: 100; }
}

/* ============================================================
   变体 B：横扫（.atk2）
   ————————————————————————————————————————————
   和 A 的区别（一眼能看出来才算两个动作）：
     · 刀从**身后低位**起（+148°，刀尖几乎点地）→ 往上挑起 170°，收在肩前上方（-22°）
     · 人只前压 22%、腰只前倾 11° —— 横扫靠拧，不靠扑
     · 刀光是**下半圈**弧，和下劈的上半圈正好互补
   ============================================================ */
@keyframes heroDash2 {
  0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
  7%   { transform: translate(-3%, 1%) rotate(-2deg) scale(.99); }
  16%  { transform: translate(-8%, 4%) rotate(-5deg) scale(.975); }
  26%  { transform: translate(-10%, 3%) rotate(-5deg) scale(.98); }
  31%  { transform: translate(-10%, 3%) rotate(-5deg) scale(.98);
         animation-timing-function: cubic-bezier(.14,.78,.25,1); }
  38%  { transform: translate(12%, 0) rotate(1deg) scale(1.025); }
  42%  { transform: translate(25%, 0) rotate(4deg) scale(1.02); }
  52%  { transform: translate(25%, 0) rotate(4deg) scale(1.02); }
  58%  { transform: translate(18%, 0) rotate(2.5deg) scale(1.01); }
  70%  { transform: translate(10%, 0) rotate(1deg) scale(1); }
  82%  { transform: translate(3%, 0) rotate(.5deg) scale(1); }
  92%  { transform: translate(1%, 0) rotate(0deg) scale(1); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}
@keyframes heroLean2 {
  0%   { transform: rotate(0deg); }
  10%  { transform: rotate(-2deg); }
  18%  { transform: rotate(-5deg); }
  26%  { transform: rotate(-7deg); }
  31%  { transform: rotate(-7deg); animation-timing-function: cubic-bezier(.18,.72,.42,1); }
  40%  { transform: rotate(8deg); }
  42%, 52% { transform: rotate(11deg); }
  62%  { transform: rotate(7deg); animation-timing-function: cubic-bezier(.25,.8,.3,1); }
  74%  { transform: rotate(4deg); }
  88%  { transform: rotate(1deg); }
  94%  { transform: rotate(-1.5deg); }
  100% { transform: rotate(0deg); }
}
/* 横扫的手臂：+148° 是"刀垂在身后、刀尖点地"，一路减到 -22° 就是往上挑出去 */
@keyframes heroSweep {
  0%   { transform: rotate(65deg); }
  8%   { transform: rotate(59deg); }
  14%  { transform: rotate(30deg); }
  20%  { transform: rotate(82deg); }
  26%  { transform: rotate(132deg); }
  31%  { transform: rotate(148deg); animation-timing-function: cubic-bezier(.18,.72,.42,1); }
  40%  { transform: rotate(10deg); }
  42%, 52% { transform: rotate(-22deg); }
  62%  { transform: rotate(2deg); }

/* ============================================================
   穿刺的"演出层"：这三样都挂在 .arena 上（不在 .hero 里面）——
   因为它们要盖住整个画面：镜头推近 / 漫画集中线 / 一条贯穿画面的白线。
   ⚠️ 都必须 z-index ≤ 1：角色是 .stage 的 z-index 2，不能被这些盖住。
   ============================================================ */
.arena .burst, .arena .pierce-line { position: absolute; z-index: 1; opacity: 0; pointer-events: none; }
/* 漫画集中线：从怪物位置向四周放射，中间挖空（别糊住角色） */
.arena .burst { left: -10%; right: -10%; top: -14%; bottom: -14%;
  background: repeating-conic-gradient(from 0deg at 64% 50%,
    rgba(255,255,255,.92) 0deg .9deg, rgba(255,255,255,0) .9deg 3.4deg);
  -webkit-mask-image: radial-gradient(circle at 64% 50%, rgba(0,0,0,0) 20%, #000 54%, rgba(0,0,0,0) 88%);
  mask-image: radial-gradient(circle at 64% 50%, rgba(0,0,0,0) 20%, #000 54%, rgba(0,0,0,0) 88%); }
/* 贯穿线：从左到右一道白金色的长线，跟着穿刺方向走 */
.arena .pierce-line { left: 5%; top: 57%; width: 84%; height: 3px;
  transform-origin: 0 50%; transform: scaleX(0); border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, #fff 16%, #FFE9AE 58%, rgba(255,233,174,0) 100%);
  box-shadow: 0 0 16px rgba(255,236,180,1), 0 0 34px rgba(255,220,140,.55); }
.arena.impact .burst { animation: burstIn calc(.24s * var(--spd, 1)) ease-out; }
.arena.impact .pierce-line { animation: lineDash calc(.30s * var(--spd, 1)) ease-out; }
@keyframes burstIn {
  0%   { opacity: 0; transform: scale(.72); }
  14%  { opacity: .95; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.14); }
}
@keyframes lineDash {
  0%   { opacity: 0; transform: scaleX(0); }
  20%  { opacity: 1; transform: scaleX(.6); }
  55%  { opacity: .9; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(1); }
}
/* ---------- 穿刺的镜头：**贴着他推近** ----------
   不是简单放大：21% 开始推，一路跟着他摇过去，**在"即将刺中"的 36–44% 推到最紧（1.75×）**，
   50% 刺入后定格，再一路拉回全景。
   这时整段动画也被拉长到 1.55×（见 .arena.pierce 的 --atk），所以「推镜 + 慢放」是叠在一起的。
   ⚠️ 摇镜的方向是反的：人要往右冲，画面（.stage 里的内容）就要往左移。
      数值按「stage 宽 460px」估的，改比例要重新对一次构图。
   ⚠️ 50–62% 和主角的定格同步（数值不跳），不然特写会自己抖起来。 */
.arena.pierce .stage { animation: camPush var(--atk) cubic-bezier(.35,.05,.25,1); }
/* 破防处决复用推镜节奏：50–62% 正好是顶盾僵持段，镜头也定在最紧特写。 */
.arena.fin .stage { animation: camPush var(--atk) cubic-bezier(.35,.05,.25,1); }
@keyframes camPush {
  0%, 16%   { transform: scale(1) translate(0, 0); }
  21%       { transform: scale(1.10) translate(-1%, .3%); }
  26%       { transform: scale(1.30) translate(-5%, .8%); }
  36%       { transform: scale(1.40) translate(-9%, 1.2%); }
  44%       { transform: scale(1.52) translate(-19%, 1.6%); }
  50%       { transform: scale(1.58) translate(-21%, 1.9%); }
  62%       { transform: scale(1.58) translate(-21%, 1.9%); }     /* 定格在最紧的特写 */
  70%       { transform: scale(1.34) translate(-13%, 1.1%); }
  80%       { transform: scale(1.12) translate(-4%, .4%); }
  92%, 100% { transform: scale(1) translate(0, 0); }
}

/* ============================================================
   v2 普通攻击运镜：下劈先拉后压，横扫先反摇再顺斩方向甩镜。
   特写只在命中前后短暂出现，幅度小于终结技，避免六张牌连续晕镜。
   ============================================================ */
.arena.cam-chop .stage, .arena.cam-sweep .stage { transform-origin: 66% 55%; }
.arena.cam-chop .stage { animation: camChop var(--atk) cubic-bezier(.3,.06,.25,1); }
.arena.cam-sweep .stage { animation: camSweep var(--atk) cubic-bezier(.28,.06,.24,1); }
@keyframes camChop {
  0%, 12% { transform: translate(0, 0) scale(1); }
  26%, 31% { transform: translate(1.5%, 1%) scale(.97); }
  38% { transform: translate(-2%, -1%) scale(1.08); }
  42%, 52% { transform: translate(-7%, 2%) scale(1.19); }
  64% { transform: translate(-3%, 1%) scale(1.08); }
  84%, 100% { transform: translate(0, 0) scale(1); }
}
@keyframes camSweep {
  0%, 12% { transform: translate(0, 0) scale(1); }
  26%, 31% { transform: translate(4%, 1%) scale(1.025); }
  38% { transform: translate(-2%, -1%) scale(1.07); }
  42%, 52% { transform: translate(-9%, 1%) scale(1.16); }
  62% { transform: translate(-12%, 0) scale(1.10); }
  82%, 100% { transform: translate(0, 0) scale(1); }
}
.arena .cine-flash, .arena .cine-bars { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.arena .cine-flash { z-index: 7; background: radial-gradient(circle at 70% 46%,

/* 特写期间把下方那行说明淡掉：镜头一推近，角色就会把它压住 */
.arena.pierce .hitsub { animation: subFade var(--atk) linear; }
.arena.fin .hitsub { animation: subFade var(--atk) linear; }
@keyframes subFade {

  86%, 100% { opacity: 1; }
}

/* ---------- 黑白帧 ----------
   定格那一下整幅画面褪成黑白（动画里的"冲击帧"）。
   ⚠️ 走 **.arena 的 filter + transition**，不是 animation：
     · `.arena` 已经挂着 `.shake` 的 animation，再写一条 filter 的 animation 会被简写顶掉
     · 试过两种"叠一层"的写法都不行：`backdrop-filter` 在本页拍出来还是彩色；
       `mix-blend-mode: saturation` 叠中性灰也被合成层吃掉了（两层都不能用）
     filter 作用在 .arena 上 = 连集中线、贯穿线、伤害数字一起变灰，才是真正的黑白帧。
   ⚠️ transition 时长必须跟着 --spd：固定 80ms 的话，慢放时黑白会"啪"地跳进来。 */
.arena { transition: filter calc(.05s * var(--spd, 1)) linear; }
.arena.mono { filter: grayscale(1) contrast(1.3) brightness(1.04); }
.arena.impact-normal { filter: grayscale(.72) contrast(1.2) brightness(1.07); }

/* 增益：原地升起 + 双臂上举 + 光环 */
@keyframes heroRise {
  0% { transform: translateY(0) scale(1); } 32% { transform: translateY(-10px) scale(1.05); }
  64% { transform: translateY(-7px) scale(1.04); } 100% { transform: translateY(0) scale(1); } }
@keyframes armUpF { 0% { transform: rotate(0deg); } 32% { transform: rotate(-46deg); }
  64% { transform: rotate(-38deg); } 100% { transform: rotate(0deg); } }
@keyframes armUpB { 0% { transform: rotate(0deg); } 32% { transform: rotate(78deg); }
  64% { transform: rotate(70deg); } 100% { transform: rotate(0deg); } }
.hero.buff .fig { animation: heroRise calc(.38s * var(--spd, 1)) ease-in-out; }
.hero.buff .arm-front { animation: armUpF calc(.38s * var(--spd, 1)) ease-in-out; }
.hero.buff .arm-back { animation: armUpB calc(.38s * var(--spd, 1)) ease-in-out; }

/* ============================================================
   增益特效（v0.8.16-stage）：一个动作 → 四层特效
   ————————————————————————————————————————————
   ① .pillar  身后的柔和光柱，随身体升起
   ② .ring    脚下的光环扩散（两圈，第二圈晚 20%）
   ③ .streak  四条气浪从脚下往上抽（各自错开，不是一起走）
   ④ .spark   五个光点往上飘（确定性偏移，不用 Math.random）
   ⚠️ 颜色全部走 `--bfx`（"R,G,B" 三段数字，由 JS 按卡片品质写进去）：
      写成 rgb() 而不是十六进制，是为了能配 rgba(var(--bfx), .3) 这种半透明。
   ⚠️ 时长统一用 `--bf`（= .38s × spd），必须和上面那三条 heroRise/armUp 一致，
      否则特效会比动作先收尾，看着像"人还没抬手光就散了"。
   ⚠️ 全部挂在 .bfx 里（z-index:0），.fig 是 z-index:1 —— 别把光柱盖在人身上。 */
.hero { --bf: calc(.38s * var(--spd, 1)); --bfx: 156,148,130; }
.hero .bfx { position: absolute; z-index: 0; left: 50%; bottom: 0; width: 140px; height: 100%;
  transform: translateX(-50%); pointer-events: none; opacity: 0; }
.hero .bfx i { position: absolute; display: block; opacity: 0; }
.hero.buff .bfx { opacity: 1; }

/* ① 光柱：糊一点，只当"能量在往上涌"的底 */
.hero .pillar { left: 50%; bottom: 2px; width: 86px; height: 104%; margin-left: -43px;
  border-radius: 50% 50% 10px 10px; filter: blur(7px);
  background: linear-gradient(0deg, rgba(var(--bfx), .55) 0%,
    rgba(var(--bfx), .22) 46%, rgba(var(--bfx), 0) 88%); }
@keyframes bfxPillar {
  0%   { opacity: 0; transform: scaleY(.55) scaleX(.7); }
  20%  { opacity: .85; transform: scaleY(1) scaleX(1); }
  62%  { opacity: .5; transform: scaleY(1.02) scaleX(1.04); }
  100% { opacity: 0; transform: scaleY(1.1) scaleX(1.1); }
}
.hero.buff .pillar { animation: bfxPillar var(--bf) ease-out; }

/* ② 地面光环：一圈扩散 + 一圈更晚更淡的，做出"能量从地里顶上来" */
.hero .ring { left: 50%; bottom: -3px; width: 46px; height: 14px; margin-left: -23px;
  border: 2px solid rgb(var(--bfx)); border-radius: 50%;
  box-shadow: 0 0 10px rgba(var(--bfx), .8); }
.hero.buff .ring { animation: bfxRing var(--bf) cubic-bezier(.2,.7,.3,1); }
.hero.buff .ring::after { content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 2px solid rgba(var(--bfx), .55);
  animation: bfxRing2 var(--bf) cubic-bezier(.2,.7,.3,1) calc(var(--bf) * .22); opacity: 0; }
@keyframes bfxRing {
  0%   { opacity: .95; transform: scale(.35); }
  55%  { opacity: .5; transform: scale(1.7); }
  100% { opacity: 0; transform: scale(2.7); }
}
@keyframes bfxRing2 {
  0%   { opacity: .8; transform: scale(.5); }
  100% { opacity: 0; transform: scale(3.2); }
}

/* ③ 气浪：四条细光往上抽，各自错开 0 / .10 / .22 / .05 个 --bf */
.hero .streak { width: 2px; border-radius: 2px;
  background: linear-gradient(0deg, rgba(var(--bfx), 0) 0%,
    rgba(var(--bfx), .85) 45%, #FFFDF4 100%); }
.hero .s1 { left: 34px; bottom: 10px; height: 34px; }
.hero .s2 { left: 66px; bottom: 8px;  height: 46px; }
.hero .s3 { left: 88px; bottom: 12px; height: 30px; }
.hero .s4 { left: 50px; bottom: 6px;  height: 40px; }
@keyframes bfxStreak {
  0%   { opacity: 0; transform: translateY(12px) scaleY(.35); }
  22%  { opacity: 1; }
  70%  { opacity: .8; }
  100% { opacity: 0; transform: translateY(-52px) scaleY(1); }
}
.hero.buff .streak { animation: bfxStreak var(--bf) ease-out; }
.hero.buff .s1 { animation-delay: calc(var(--bf) * .02); }
.hero.buff .s2 { animation-delay: calc(var(--bf) * .12); }
.hero.buff .s3 { animation-delay: calc(var(--bf) * .24); }
.hero.buff .s4 { animation-delay: calc(var(--bf) * .06); }

/* ④ 光点：五个小亮点往上飘（偏移写死，跟着气浪错开） */
.hero .spark { width: 5px; height: 5px; border-radius: 50%;
  background: #FFFBE8; box-shadow: 0 0 8px rgba(var(--bfx), 1), 0 0 14px rgba(var(--bfx), .5); }
.hero .k1 { left: 40px; bottom: 16px; }
.hero .k2 { left: 60px; bottom: 10px; }
.hero .k3 { left: 78px; bottom: 20px; }
.hero .k4 { left: 52px; bottom: 6px; }
.hero .k5 { left: 88px; bottom: 14px; }
@keyframes bfxSpark {
  0%   { opacity: 0; transform: translate(0, 4px) scale(.4); }
  18%  { opacity: 1; transform: translate(1px, -6px) scale(1); }
  100% { opacity: 0; transform: translate(-2px, -64px) scale(.7); }
}
.hero.buff .spark { animation: bfxSpark var(--bf) ease-out; }
.hero.buff .k1 { animation-delay: calc(var(--bf) * .08); }
.hero.buff .k2 { animation-delay: calc(var(--bf) * .26); }
.hero.buff .k3 { animation-delay: calc(var(--bf) * .16); }
.hero.buff .k4 { animation-delay: calc(var(--bf) * .34); }
.hero.buff .k5 { animation-delay: calc(var(--bf) * .04); }

/* 光环换成卡片品质色（原来是固定的暗金）＋ 身体带一层同色边缘光 */
.hero .aura { position: absolute; left: 50%; top: 6px; width: 92px; height: 104px; opacity: 0;
  transform: translate(-50%, 0) scale(.6); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 50% 56%,
    rgba(var(--bfx), .38) 0%, rgba(var(--bfx), 0) 72%); }
.hero.buff .aura { animation: auraUp calc(.38s * var(--spd, 1)) ease-out; }
@keyframes auraUp {
  0% { opacity: 0; transform: translate(-50%, 0) scale(.55); }
  26% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -9px) scale(1.45); } }

/* 边缘光：整个人套一层同色 drop-shadow，抬手那一下最亮 */
@keyframes bfxRim {
  0%   { filter: none; }
  26%  { filter: drop-shadow(0 0 7px rgba(var(--bfx), .95)) drop-shadow(0 0 16px rgba(var(--bfx), .45)); }
  70%  { filter: drop-shadow(0 0 4px rgba(var(--bfx), .5)); }
  100% { filter: none; }
}
.hero.buff .breath { animation: bfxRim var(--bf) ease-out; }

/* ---------- 怪物：小怪 / boss ----------
   两型共用同一个 viewBox（140×152），切型只换哪一组建显示 ——
   viewBox 一样，尺寸就不会跳，切换时布局纹丝不动。 */
.mob .fig { width: clamp(88px, 13.5vh, 132px); aspect-ratio: 140 / 152; }
.mob.is-boss .fig { width: clamp(100px, 15.5vh, 152px); }
.mob .m-boss { display: none; }
.mob.is-boss .m-boss { display: block; }
.mob.is-boss .m-small { display: none; }
.mob .breath { transform-box: view-box; transform-origin: 70px 152px;
  animation: mobBreath 3.1s ease-in-out infinite; }
@keyframes mobBreath { 0%, 100% { transform: translateY(0) scale(1, 1); }
  50% { transform: translateY(-2px) scale(1.012, .988); } }

/* ---------- 怪物模型细节与终结技防御 ----------
   盾层常驻在同一 viewBox 里，命中时只换类，不增删节点。 */
.mob .breath { filter: drop-shadow(0 3px 2px rgba(68,54,38,.18)); }
.mob .guard-rig { opacity: 0; transform-box: view-box; transform-origin: 42px 76px;
  pointer-events: none; }
.mob .guard-shield { fill: #6B5D48; stroke: #2F2924; stroke-width: 4;
  filter: drop-shadow(0 0 5px rgba(255,221,151,.35)); }
.mob .guard-face { fill: #A68B5D; stroke: #57462F; stroke-width: 2; }
.mob .guard-mark { fill: #D79A3B; stroke: #6B4322; stroke-width: 1.5; opacity: .8; }
.mob .guard-crack { fill: none; stroke: #FFF2C7; stroke-width: 2.2; opacity: 0;
  filter: drop-shadow(0 0 4px rgba(255,222,143,.9)); }
.mob .guard-chip { fill: #8B7658; stroke: #3B3128; stroke-width: 1.2; opacity: 0; }
@keyframes mobGuardBrace {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  2%, 13% { transform: translate(-2%, 2%) rotate(-4deg) scale(1.04, .94); }
  20% { transform: translate(1%, 0) rotate(2deg) scale(1); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}
@keyframes mobGuardStrain {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); }
  18%, 55% { transform: translate(1%, 1%) rotate(2deg) scale(.98, 1.02); }
  72% { transform: translate(-1%, 0) rotate(-1deg) scale(1); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}
@keyframes mobFinishDead {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
  16% { transform: translate(3%, -3%) rotate(8deg) scale(.98, 1.04); opacity: 1; }
  38% { transform: translate(10%, 7%) rotate(22deg) scale(1.06, .82); opacity: .92; }
  68%, 100% { transform: translate(15%, 14%) rotate(32deg) scale(1.08, .66); opacity: .34; }
}
@keyframes guardRaise {
  0% { opacity: 0; transform: translate(-16px, 4px) rotate(-18deg) scale(.75); }
  18%, 100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
}
@keyframes guardCrackIn {
  0% { opacity: 0; transform: scale(.7); }
  30%, 100% { opacity: 1; transform: scale(1); }
}
@keyframes guardBreak {
  0% { opacity: 1; transform: scale(1); filter: brightness(2); }
  30% { opacity: .9; transform: scale(1.16); filter: brightness(2.6); }
  100% { opacity: 0; transform: scale(1.8) rotate(12deg); filter: none; }
}
@keyframes guardChipFly {
  0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translate(var(--gx), var(--gy)) rotate(var(--gr)) scale(.55); }
}
.mob.guarding .fig { transform-origin: 50% 94%; animation: mobGuardBrace calc(.28s * var(--spd, 1)) ease-out; }
.mob.guard-strain .fig { animation: mobGuardStrain calc(.22s * var(--spd, 1)) ease-in-out; }
.mob.finisher-dead .fig { transform-origin: 50% 94%;
  transform: translate(15%, 14%) rotate(32deg) scale(1.08, .66); opacity: .34;
  animation: mobFinishDead calc(.42s * var(--spd, 1)) ease-in; }
.mob.guarding .breath, .mob.guard-strain .breath { animation: none; }
.mob.finisher-dead .breath { animation: mobWhiteFlash calc(.18s * var(--spd, 1)) linear; }
.mob.guarding .guard-rig, .mob.guard-strain .guard-rig { animation: guardRaise calc(.18s * var(--spd, 1)) ease-out; }
.mob.guarding .guard-rig, .mob.guard-strain .guard-rig { opacity: 1; }
.mob.guard-strain .guard-crack { animation: guardCrackIn calc(.18s * var(--spd, 1)) ease-out; }
.mob.guard-break .guard-rig { opacity: 1; animation: none; }
.mob.guard-break .guard-shield, .mob.guard-break .guard-face, .mob.guard-break .guard-mark {
  animation: guardBreak calc(.26s * var(--spd, 1)) ease-out; }
.mob.guard-break .guard-crack { opacity: 1; }
.mob.guard-break .guard-chip { animation: guardChipFly calc(.36s * var(--spd, 1)) cubic-bezier(.16,.68,.32,1); }
.mob.guard-break .g2, .mob.guard-break .g4 { animation-delay: calc(.025s * var(--spd, 1)); }

/* 怪物挨打：命中帧才起播（JS 在 ANIM×0.42 触发），所以 0% 就是"被打中"那一刻。
   0–2%   被砸中瞬间的横向压扁（squash）
   2–15%  和主角的"命中停顿"同频定格
   15–38% 被推飞：向右弹开 + 反向倾斜 + 拉伸
   38–100% 落地回弹、晃两下、站回原位
   ⚠️ 时长 `.24s × spd`（600ms）比一张牌短：从 42% 处起播，正好在下一张牌开口前收完。 */
@keyframes mobHurt {
  0%   { transform: translateX(0) rotate(0deg) scale(1, 1); }
  2%   { transform: translateX(2.5%) rotate(-1.5deg) scale(.965, 1.035);
         animation-timing-function: cubic-bezier(.1,.9,.25,1); }
  15%  { transform: translateX(2.5%) rotate(-1.5deg) scale(.965, 1.035); }
  30%  { transform: translateX(10%) rotate(4.5deg) scale(1.03, .97); }
  44%  { transform: translateX(8.5%) rotate(3.4deg) scale(1, 1); }
  62%  { transform: translateX(4%) rotate(1.4deg) scale(1, 1); }
  80%  { transform: translateX(-1.6%) rotate(-.5deg) scale(1, 1); }
  92%  { transform: translateX(.6%) rotate(.2deg) scale(1, 1); }
  100% { transform: translateX(0) rotate(0deg) scale(1, 1); }
}
.mob.hurt .fig { transform-origin: 50% 96%;
  animation: mobHurt calc(.24s * var(--spd, 1)) ease-out; }
/* 挨打时停呼吸：和主角同理，"定格"那一下不能有 2px 的呼吸抖动 */
.mob.hurt .breath { animation: none; }

/* 被**贯穿**：不是被推飞，而是原地被顶穿 —— 纵向压一下、抖两下、站住。
   （所以不能复用 mobHurt 的横移：那一套是"被打飞"，和穿刺的受力方式不一样） */
@keyframes mobPierced {
  0%   { transform: scale(1, 1) translateX(0); }
  4%   { transform: scale(.93, 1.08) translateX(1%); }
  14%  { transform: scale(.93, 1.08) translateX(1%); }
  22%  { transform: scale(1.06, .94) translateX(-1.6%); }
  32%  { transform: scale(.98, 1.02) translateX(.9%); }
  42%  { transform: scale(1.02, .98) translateX(-.5%); }
  56%  { transform: scale(1, 1) translateX(0); }
  100% { transform: scale(1, 1) translateX(0); }
}
.mob.pierced .fig { transform-origin: 50% 92%;
  animation: mobPierced calc(.26s * var(--spd, 1)) ease-out; }
.mob.pierced .breath { animation: none; }

/* ============================================================
   v2 受力差异：下劈向下压缩，横扫横向挑飞；两者都有白闪与二次回弹。
   这些类只在命中帧挂上，时长仍与 hitDur() 同步。
   ============================================================ */
@keyframes mobHurtDown {
  0% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  2%, 15% { transform: translate(1%, 5%) rotate(-3deg) scale(1.10, .82); }
  30% { transform: translate(8%, -4%) rotate(5deg) scale(.96, 1.06); }
  46% { transform: translate(6%, 1%) rotate(3deg) scale(1.02, .98); }
  66% { transform: translate(2%, 0) rotate(-1deg) scale(1); }
  82% { transform: translate(-1%, 0) rotate(.5deg) scale(1); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}
@keyframes mobHurtSweep {
  0% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
  2%, 15% { transform: translate(4%, -2%) rotate(8deg) scale(.94, 1.05); }
  30% { transform: translate(21%, -9%) rotate(19deg) scale(1.04, .96); }
  46% { transform: translate(14%, -3%) rotate(12deg) scale(1); }
  64% { transform: translate(5%, 1%) rotate(-3deg) scale(1); }
  82% { transform: translate(-2%, 0) rotate(1deg) scale(1); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}
.mob.hurt-down .fig, .mob.hurt-sweep .fig { transform-origin: 50% 96%; }
.mob.hurt-down .fig { animation: mobHurtDown calc(.24s * var(--spd, 1)) ease-out; }
.mob.hurt-sweep .fig { animation: mobHurtSweep calc(.24s * var(--spd, 1)) ease-out; }
.mob.hurt-down .breath, .mob.hurt-sweep .breath, .mob.pierced .breath {
  animation: mobWhiteFlash calc(.16s * var(--spd, 1)) linear; }
@keyframes mobWhiteFlash {
  0% { filter: brightness(3.4) saturate(0) drop-shadow(0 0 7px rgba(255,238,190,.95)); }
  24% { filter: brightness(2.1) saturate(.2) drop-shadow(0 0 4px rgba(255,238,190,.7)); }
  100% { filter: none; }
}

.mob .hit-fx { position: absolute; inset: 0; z-index: 5; opacity: 0; pointer-events: none; }
.mob.hit-chop .hit-fx, .mob.hit-sweep .hit-fx, .mob.hit-thrust .hit-fx { opacity: 1; }
.mob .hit-fx i { position: absolute; display: block; opacity: 0; pointer-events: none; }
.mob .hit-core { left: 50%; top: 42%; width: 72px; height: 72px; margin: -36px 0 0 -36px;
  border-radius: 50%; background: radial-gradient(circle, #FFF 0 8%, rgba(255,239,190,.92) 16%,
    rgba(229,157,65,.38) 38%, rgba(229,157,65,0) 70%); }
.mob .hit-ring { left: 50%; top: 42%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border: 2px solid rgba(255,246,218,.95); border-radius: 50%;
  box-shadow: 0 0 8px rgba(210,139,52,.5); }
.mob .slash-cut { left: -12%; top: 42%; width: 124%; height: 5px; border-radius: 50%;
  background: linear-gradient(90deg, rgba(255,255,255,0), #FFF 18%, #FFE4A3 55%, rgba(255,211,125,0));
  box-shadow: 0 0 7px #FFF, 0 0 18px rgba(221,148,50,.85); transform-origin: 50% 50%; }
.mob .debris { left: 50%; top: 44%; width: 5px; height: 9px; border-radius: 1px;
  background: #E7B35E; box-shadow: 0 0 4px rgba(255,225,158,.8); }
.mob .d2, .mob .d5 { width: 3px; height: 6px; background: #FFF4D6; }
.mob .d3, .mob .d6 { width: 7px; height: 3px; }
.mob.hit-chop .hit-core, .mob.hit-sweep .hit-core, .mob.hit-thrust .hit-core {
  animation: hitCore calc(.22s * var(--spd, 1)) ease-out; }
.mob.hit-chop .hr1, .mob.hit-sweep .hr1, .mob.hit-thrust .hr1 {
  animation: hitRing calc(.30s * var(--spd, 1)) ease-out; }
.mob.hit-chop .hr2, .mob.hit-sweep .hr2, .mob.hit-thrust .hr2 {
  animation: hitRing calc(.34s * var(--spd, 1)) ease-out calc(.035s * var(--spd, 1)); }
.mob.hit-chop .slash-cut { animation: cutChop calc(.26s * var(--spd, 1)) ease-out; }
.mob.hit-sweep .slash-cut { animation: cutSweep calc(.28s * var(--spd, 1)) ease-out; }
.mob.hit-thrust .slash-cut { animation: cutThrust calc(.30s * var(--spd, 1)) ease-out; }
.mob.hit-chop .debris, .mob.hit-sweep .debris, .mob.hit-thrust .debris {
  animation: debrisFly calc(.38s * var(--spd, 1)) cubic-bezier(.16,.68,.32,1); }
.mob.hit-chop .d2, .mob.hit-chop .d4, .mob.hit-chop .d6,
.mob.hit-sweep .d2, .mob.hit-sweep .d4, .mob.hit-sweep .d6,
.mob.hit-thrust .d2, .mob.hit-thrust .d4, .mob.hit-thrust .d6 {
  animation-delay: calc(.025s * var(--spd, 1)); }
@keyframes hitCore {
  0% { opacity: 1; transform: scale(.2); }
  24% { opacity: 1; transform: scale(1.25); }
  100% { opacity: 0; transform: scale(1.8); }
}
@keyframes hitRing {
  0% { opacity: .95; transform: scale(.25); }
  100% { opacity: 0; transform: scale(2.45); }
}
@keyframes cutChop {
  0% { opacity: 0; transform: translate(-12%, -38%) rotate(62deg) scale(.15, 2.2); }
  18% { opacity: 1; transform: translate(0, 0) rotate(62deg) scale(1, 1); }
  45% { opacity: 1; transform: translate(4%, 7%) rotate(62deg) scale(1.08, .45); }
  100% { opacity: 0; transform: translate(8%, 12%) rotate(62deg) scale(1.2, .1); }
}
@keyframes cutSweep {
  0% { opacity: 0; transform: translate(-22%, 22%) rotate(-13deg) scale(.1, 2); }
  18% { opacity: 1; transform: translate(0, 0) rotate(-13deg) scale(1, 1); }
  45% { opacity: 1; transform: translate(12%, -8%) rotate(-13deg) scale(1.12, .4); }
  100% { opacity: 0; transform: translate(24%, -14%) rotate(-13deg) scale(1.22, .1); }
}
@keyframes cutThrust {
  0% { opacity: 0; transform: translate(-40%, 0) rotate(-5deg) scale(.1, 2); }
  20% { opacity: 1; transform: translate(0, 0) rotate(-5deg) scale(1.35, .8); }
  100% { opacity: 0; transform: translate(38%, 0) rotate(-5deg) scale(1.5, .1); }
}
@keyframes debrisFly {
  0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  70% { opacity: .9; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--dr)) scale(.35); }
}
.boom.chop { border-color: #D18A32; box-shadow: 0 0 10px rgba(209,138,50,.35); }
.boom.sweep { border-color: #C75D36; border-style: dashed; }
.boom.thrust { border-color: #FFF0C2; border-width: 3px; }

/* ---------- 中间：这一击的说明 + 大数字 ----------
   flex: 0 0 132px —— 中间必须是**固定宽度**，不能 flex:1。
   让它去吃掉剩余空间的话，左右两个角色会被推到画面两端（860px 宽时中间空 500px），
   看着像两军对垒而不是近身。align-self: stretch 配合撑满高度，数字才落在"胸口"。 */
.mid { flex: 0 0 132px; align-self: stretch; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px; padding: 0 4px 20px; }
.hitlab { position: relative; z-index: 2; font-size: 11px; letter-spacing: .08em;
  color: #A09C92; min-height: 1.4em; text-align: center; line-height: 1.35; max-width: 132px; }
.hitnum { position: relative; z-index: 2; font-size: clamp(34px, 4.6vh, 54px); font-weight: 800; line-height: 1;
  color: #A97517; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.hitnum.idle { font-size: 14px; font-weight: 600; letter-spacing: .18em; color: #C9C2B2; }
.hitnum.pop { animation: hitpop calc(.4s * var(--spd, 1)) cubic-bezier(.3,1.5,.5,1); }
@keyframes hitpop { 0% { transform: scale(.7); opacity: .25; } 55% { transform: scale(1.09); } 100% { transform: scale(1); } }
.hitsub { position: relative; z-index: 2; font-size: 11.5px; color: #B4AFA3; min-height: 1.5em;
  text-align: center; max-width: 94%; line-height: 1.4; }

/* 冲击圈：每出手一次炸一圈，颜色跟着卡牌类型走。
   ⚠️ 这个 div 挂在 #mob **里面**，坐标相对怪物自己算（left/top 50%）——
     挂在外层 .arena 上就得按百分比猜位置，换个屏幕宽度立刻打偏。 */
.boom { position: absolute; left: 50%; top: 42%; width: 64px; height: 64px;
  margin: -32px 0 0 -32px; border-radius: 50%; border: 2px solid #C05A32;
  opacity: 0; pointer-events: none; z-index: 3; }
.boom.buff { border-color: #4C7A1E; }
.boom.sp { border-color: #534AB7; }
.boom.go { animation: boom calc(.55s * var(--spd, 1)) ease-out; }
@keyframes boom { 0% { transform: scale(.45); opacity: .85; } 100% { transform: scale(3.1); opacity: 0; } }
/* 命中帧的两层加料（纯伪元素，**不用改 JS 结构**）：
     ::after  白色爆闪 —— 命中那一瞬间整个怪物位置"过曝"一下
     ::before 第二道白环 —— 比主冲击圈晚一点、细一点，制造层次
   注意 .boom 自带的 opacity 动画会把子元素一起渐隐，所以这两层只能短、要抢在 0.2s 内演完。 */
.boom::before, .boom::after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  border-radius: 50%; opacity: 0; pointer-events: none; }
.boom.go::after { animation: boomFlash calc(.26s * var(--spd, 1)) ease-out; }
.boom.go::before { animation: boomRing2 calc(.34s * var(--spd, 1)) ease-out;
  border: 1.5px solid rgba(255,255,255,.85); }
@keyframes boomFlash {
  0%   { opacity: 1; transform: scale(.55);
         background: radial-gradient(circle, rgba(255,255,255,.92) 0%, rgba(255,238,196,.5) 40%, rgba(255,238,196,0) 72%); }
  100% { opacity: 0; transform: scale(1.6);
         background: radial-gradient(circle, rgba(255,255,255,.92) 0%, rgba(255,238,196,.5) 40%, rgba(255,238,196,0) 72%); }
}
@keyframes boomRing2 {
  0%   { opacity: .8; transform: scale(.85); }
  100% { opacity: 0; transform: scale(2.6); }
}

/* 命中震动：整个演出席（含增益徽章、下方说明）抖一下 —— 这是"重量感"最便宜的一招。
   ⚠️ 抖的是 .arena 整体，别去抖 .stage，否则两个角色的相对位置会错开。 */
@keyframes arenaShake {
  0%   { transform: translate(0, 0); }
  14%  { transform: translate(-3px, 1.5px); }
  32%  { transform: translate(2.5px, -1px); }
  52%  { transform: translate(-2px, .6px); }
  72%  { transform: translate(1.4px, 0); }
  88%  { transform: translate(-.6px, 0); }
  100% { transform: translate(0, 0); }
}
.arena.shake { animation: arenaShake calc(.18s * var(--spd, 1)) ease-out; }

/* 伤害跳字：一刀跳出 count 个数字（count = 这一击的连击数），每个数字自己往上飘。
   ⚠️ 位置由 JS 写 left/top（百分比，相对怪物框），不在这里钉死 —— 每一下要错开。
   ⚠️ 时长必须用 calc(… * var(--spd))，和 .boom / .hurt 同一个倍率，
      否则调 SPEED 时跳字会跟动作脱节。 */
.hitnums { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 4; }
.hitnum-f { position: absolute; transform: translate(-50%, -50%);
  font-size: clamp(13px, 3.4vw, 17px); font-weight: 800; color: #B23A2C; line-height: 1;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255, 252, 244, .95), 0 0 5px rgba(255, 252, 244, .9);

/* 窄屏断点：和 index.html 的 @media (max-width: 560px) 里「出战屏」那几条一致 */

  .hero .fig { width: 62px; }

  .mob.is-boss .fig { width: 88px; }
