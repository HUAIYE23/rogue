      try { dragTipDone = localStorage.getItem(DRAG_TIP_KEY) === '1'; }
      catch (e) { dragTipDone = true; }
    }
    if (dragTipDone || dragTipTimer) return;
    var coarse = (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0) ||
                 (typeof window !== 'undefined' && 'ontouchstart' in window) ||
                 ((typeof matchMedia === 'function') && matchMedia('(hover: none)').matches);
    if (!coarse || !document.body || !document.createElement) { dragTipDone = true; return; }
    if (maskOpen()) return;              /* 浮层开着：等它关掉的那次 paint */
    dragTipTimer = setTimeout(function () {
      dragTipTimer = 0;
      if (maskOpen()) return;            /* 这中间又开了浮层 → 这一轮不作数 */
      dragTipDone = true;
      try { localStorage.setItem(DRAG_TIP_KEY, '1'); } catch (e) {}
      var t = document.createElement('div');
      t.className = 'dragtip';
      t.innerHTML = '<b>点一下</b>看完整效果 · <b>长按</b>可以拖：' +
        '<b>拖到同名卡</b>升星 · <b>拖到空槽</b>装配 · <b>拖到底部</b>卖掉';
      document.body.appendChild(t);
      var kill = function () {
        if (t.parentNode) t.parentNode.removeChild(t);
        document.removeEventListener('pointerdown', kill, true);
      };
      setTimeout(kill, 9000);
      document.addEventListener('pointerdown', kill, true);
    }, 420);
  }

  /* 桌面：按下就开始（移动 6px 才算真拖）；触屏：先按住 170ms。
     两种指针共用下面那套 ghost / 落点判定，只是"何时拿起来"不同。 */
  function armDrag(e, uid, fromSlot, srcEl) {
    if (S.phase !== 'prep') return;
    var touch = (e.pointerType === 'touch' || e.pointerType === 'pen');
    if (!touch && (e.pointerType !== 'mouse' || e.button !== 0)) return;
    drag = { uid: uid, fromSlot: fromSlot, sx: e.clientX, sy: e.clientY,
             offX: 0, offY: 0, started: false, srcEl: srcEl, ghost: null,
             touch: touch, hold: 0, aborted: false };

    if (touch) {
      drag.hold = setTimeout(touchHold, DRAG_HOLD);
      /* 拿起来之后必须拦住页面滚动。pointermove 拦不住 touch 滚动，
         只能挂非 passive 的 touchmove（默认 passive 的 preventDefault 是空操作）。 */
      document.addEventListener('touchmove', onTouchMove, { passive: false });
      document.addEventListener('contextmenu', onTouchContext, true);
    }
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragEnd);
    document.addEventListener('pointercancel', onDragEnd);
  }

  /* 触屏按住到点：这一刻才建 ghost、才拦滚动 */
  function touchHold() {
    if (!drag || drag.started || drag.aborted) return;
    drag.hold = 0;
    startGhost();
    if (!drag.ghost) { cancelHold(); return; }
    /* 轻震一下当"拿起来了"的反馈（不支持就算了，别抛错） */
    try { if (navigator.vibrate) navigator.vibrate(10); } catch (err) {}
  }

  function onTouchMove(e) {
    if (drag && drag.started) e.preventDefault();
  }
  /* 长按在 iOS / Android 上会弹"拷贝 / 存储图像"菜单，拖拽期间吃掉它 */
  function onTouchContext(e) {
    if (drag && drag.started) e.preventDefault();
  }
  /* 放弃这次拖拽（手先动了 = 他想滚动）：清长按计时，剩下的交给浏览器 */
  function cancelHold() {
    if (!drag) return;
    if (drag.hold) { clearTimeout(drag.hold); drag.hold = 0; }
    drag.aborted = true;
  }

  function onDragMove(e) {
    if (!drag || drag.aborted) return;
    if (!drag.started) {
      var dx = Math.abs(e.clientX - drag.sx), dy = Math.abs(e.clientY - drag.sy);
      if (drag.touch) {
        /* 还没到长按时间就动了 → 他在滚页面，别抢 */
        if (dx > TOUCH_MIN || dy > TOUCH_MIN) { cancelHold(); return; }
        return;
      }
      if (dx < DRAG_MIN && dy < DRAG_MIN) return;
      startGhost();
      if (!drag.ghost) return;
    }
    /* 假横屏时 body 转过 90°：指针是视口坐标，left/top 要本地坐标 */
    var gp = toLocal(e.clientX, e.clientY);
    drag.ghost.style.left = (gp.x - drag.offX) + 'px';
    drag.ghost.style.top = (gp.y - drag.offY) + 'px';
    var at = dropAt(e.clientX, e.clientY, drag.touch);
    markDropTarget(at, drag.uid);
    e.preventDefault();
  }

  function startGhost() {
    var c = cardById(drag.uid);
    if (!c || !drag.srcEl.getBoundingClientRect) return;
    var r = drag.srcEl.getBoundingClientRect();
    var g = cardEl(c.id, c.lv, { tight: true });
    g.className += ' ghostcard';
    /* 假横屏时 body 转过 90°：本地宽高和屏幕上的宽高是反的，按**本地**尺寸给，
       否则幽灵卡会被拉成一条细长条（屏幕上 112×147，本地得给 147×112）。 */
    var gw = r.width, gh = r.height;
    if (landForcedOn()) { gw = r.height; gh = r.width; }
    g.style.width = gw + 'px';
    g.style.height = gh + 'px';
    document.body.appendChild(g);

    drag.ghost = g;
    drag.offX = gw / 2;           /* 让卡片的中心跟着指针 */
    drag.offY = gh / 2;
    drag.started = true;
    drag.srcEl.classList.add('src-fade');
    document.body.classList.add('dragging');
    /* 拖起来的时候把"点开看"的大卡收掉：否则同一张牌会同时以两种尺寸出现 */
    var pkG = $('peek');
    if (pkG) pkG.className = 'peek';
    if (drag.touch) document.body.classList.add('touchdrag');   /* "出售"按钮呼吸提示只给触屏 */

    var cap = slotCap();
    for (var i = 0; i < cap; i++) slotEls[i].classList.add('hot');

    /* 同名同级的卡亮起来：告诉玩家"拖到这张身上就升星" */
    markMergeTargets(drag.uid);

    /* 底部出售区这时才显形，并写上这张卡的卖价（平时是隐藏的） */
    paintSellZone(drag.uid);
  }

  /* 指针底下是什么？返回 { slot, uid, sell }：slot = 备战槽位序号（-1 没落在槽上），
     uid = 落点那张卡的 uid（0 表示没落在卡上），sell = 是否落在出售目标上。
     ghost 是 pointer-events:none，不会被自己挡住。
     ⚠️ `touch` 必须**当参数传**：onDragEnd 里 `drag` 已经置空了，
        在函数里读全局 `drag.touch` 永远拿不到（踩过：拖到「出售」上却判成没落在目标）。 */
  function dropAt(x, y, touch) {
    var out = { slot: -1, uid: 0, sell: false };
    if (!document.elementFromPoint) return out;
    var el = document.elementFromPoint(x, y);
    while (el && el !== document.body) {
      /* 桌面和触屏都拖到底部抛售区（触屏下它是从屏幕底滑出来的固定条）。 */
      if (el.id === 'sellzone') out.sell = true;
      if (!out.uid && el.classList && el.classList.contains('cf')) {
        var u = parseInt(el.getAttribute('data-uid'), 10);
        if (!isNaN(u)) out.uid = u;
      }
      if (out.slot < 0 && el.classList && el.classList.contains('slot')) {
        var k = parseInt(el.getAttribute('data-slot'), 10);
        if (!isNaN(k)) out.slot = k;
      }
      el = el.parentNode;
    }
    return out;
  }

  function markDropTarget(at, dragUid) {
    var cap = slotCap();
    var me = cardById(dragUid);
    var target = at.uid ? cardById(at.uid) : null;
    /* 落在可合成 / 可升级的卡上时，不再把那个槽位高亮成"放进去" —— 两个提示会打架 */
    var merging = canMerge(me, target) || upgradeableBy(me, target);

    /* 出售区自己亮不亮；指针一离开就立刻熄掉，别和槽位的提示同时亮 */
    if (elSell) elSell.classList.toggle('over', !!at.sell);

    for (var i = 0; i < cap; i++) {
      slotEls[i].classList.toggle('over', !at.sell && !merging && i === at.slot);
    }
  }

  /* 拖拽时把"能落上去的卡"标出来：
     · 普通卡 → 同名同等级（两张合成升 1 星）
     · 升级卡（晋升激励 / 升级补丁）→ 射程内的**任意**卡，整张消耗掉换 1 星 */
  function markMergeTargets(uid) {
    if (!document.querySelectorAll) return;
    var me = cardById(uid);
    var all = document.querySelectorAll('.cf.merge-hot');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('merge-hot');
    if (!me || !CARDS[me.id]) return;

    /* 升级卡：目标不同名，不能用属性选择器筛，只能挨个问 upgradeableBy */
    if (CARDS[me.id].upgrade) {
      var pool = document.querySelectorAll('.cf');
      for (var k = 0; k < pool.length; k++) {
        var u = parseInt(pool[k].getAttribute('data-uid'), 10);
        if (isNaN(u) || u === uid) continue;
        if (upgradeableBy(me, cardById(u))) pool[k].classList.add('merge-hot');
      }
      return;
    }

    if (CARDS[me.id].noLv && !CARDS[me.id].starTo) return;   /* 进化链的 noLv 卡可以合 */
    if ((me.lv || 1) >= maxLvOf(me)) return;

    var same = document.querySelectorAll(
      '[data-card="' + me.id + '"][data-lv="' + (me.lv || 1) + '"]');
    for (var j = 0; j < same.length; j++) {
      if (same[j].getAttribute('data-uid') !== String(uid)) same[j].classList.add('merge-hot');
    }
  }

  function clearMergeHot() {
    if (!document.querySelectorAll) return;
    var all = document.querySelectorAll('.cf.merge-hot');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('merge-hot');
  }

  function onDragEnd(e) {
    if (drag && drag.hold) { clearTimeout(drag.hold); drag.hold = 0; }
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);
    document.removeEventListener('touchmove', onTouchMove, { passive: false });
    document.removeEventListener('contextmenu', onTouchContext, true);

    var d = drag;
    drag = null;
    if (!d || !d.started) return;          /* 只是点了一下 → 交给 click 去处理 */

    var at = e.type === 'pointercancel' ? { slot: -1, uid: 0, sell: false }
                                        : dropAt(e.clientX, e.clientY, d.touch);
    cleanupDrag(d);
    clickShield = Date.now() + 300;

    /* 落在底部出售区 → 直接卖掉。走的是和左下角按钮同一个 sellCard()，
       所以积蓄系给蓄能、蓄势技巧给卡这些特例全都自动一致。 */
    if (at.sell) { if (!sellCard(d.uid)) paint(); return; }

    /* 落在卡上：同名同级 → 合成升星；手里是升级卡 → 直接把它用掉升 1 星。
       都不是就照常放槽位。 */
    var me = cardById(d.uid), hit = at.uid ? cardById(at.uid) : null;
    if (hit && canMerge(me, hit)) {
      mergeCards(at.uid, d.uid);
    } else if (hit && upgradeableBy(me, hit)) {
      useUpgrade(d.uid, at.uid);
    } else if (at.slot >= 0) {
      moveTo(d.uid, d.fromSlot, at.slot);
    } else {
      paint();                              /* 落在外面：原样回弹，状态一点没动 */
    }
  }

  function cleanupDrag(d) {
    if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    if (d.srcEl) d.srcEl.classList.remove('src-fade');
    document.body.classList.remove('dragging');   /* 出售区跟着一起消失 */
    document.body.classList.remove('touchdrag');
    if (elSell) elSell.classList.remove('over');
    clearMergeHot();
    var cap = slotCap();
    for (var i = 0; i < cap; i++) {
      slotEls[i].classList.remove('hot');
      slotEls[i].classList.remove('over');
    }
  }

  /* ---------- 浮层 ---------- */

  function hideMask() { elMask.classList.remove('on'); elPanel.innerHTML = ''; }

  /* 关掉一个"叠在事件面板上面"的弹窗之后，要回到该回的那一屏：
     · 事件还没选（`S.pickOpen`）→ 把事件面板重新摆出来。**这一步不能省**：
       开局一张卡都不发，牌全靠事件给，事件面板没了就等于这局卡死（只能刷新）。
     · 其它情况就是普通地关掉遮罩、回备战屏。
     ⚠️ 凡是**可能在事件面板之上打开**的弹窗（昵称、教程询问…），关闭时必须走这里，
       不要再直接调 hideMask() —— v0.8.45 修的 bug 就是昵称弹窗把它挤没了。 */
  function closeOverlay() {
    if (S && S.pickOpen) showEventPanel();
    else hideMask();
  }

  function showResult(res) {
    var th = tiersOf(S.round), n = tierCount(res.dmg, S.round);
    var tierCoin = coinsFor(res.dmg, S.round);
    var tc = tierCoinOf(S.round);
    /* 最后一回合不给币（ROUNDS 里 coin 全 0）—— 这回合的伤害就是最终分数 */
    var isLast = !tc[0] && !tc[1] && !tc[2];

    var h = '<h2>' + (isLast ? '最后一回合' : '本回合结束') + '</h2>' +
            '<p class="sub">第 ' + S.round + ' 回合 · ' +
              (n >= 3 ? '三档全中' : (n > 0 ? '达成 ' + n + ' 档' : '一档都没够到')) + '</p>' +
            '<div class="tierrow">';
    for (var i = 0; i < 3; i++) {
      h += '<div class="tier' + (n > i ? ' on' : '') + '">' +
        th[i] + (isLast ? '' : ' · +' + tc[i] + ' 币') + '</div>';
    }
    if (isLast) {
      h += '</div>' +
           '<div class="res-line final"><span>最终分数</span><b>' + res.dmg + '</b></div>';
      if (res.coins) {
        h += '<div class="res-line coin"><span>卡牌给的金币</span><b>+' + res.coins + '</b></div>';
      }
    } else {
      h += '</div>' +
           '<div class="res-line"><span>本回合分数</span><b>' + res.dmg + '</b></div>';
      if (res.coins) {
        h += '<div class="res-line coin"><span>卡牌给的金币</span><b>+' + res.coins + '</b></div>';
      }
      h += '<div class="res-line coin"><span>档位奖励</span><b>+' + tierCoin + '</b></div>' +
           '<div class="res-line coin"><span>本回合共得</span><b>+' + (res.coins + tierCoin) + '</b></div>';
    }
    /* 战斗里"获得"的卡：告诉玩家卡片，否则手里多一张会莫名其妙 */
    (res.gain || []).forEach(function (g) {
      h += '<div class="res-line"><span>获得卡牌</span><b>' +
        CARDS[g.id].name + ' ' + g.lv + ' 星</b></div>';
    });
    h += '<div class="res-line"><span>累计分数</span><b>' + S.total + '</b></div>';
    h += '<button class="pri big" id="btn-next" style="margin-top:14px;width:100%">' +
         (S.round >= TOTAL_ROUNDS ? '看结果' : '进入第 ' + (S.round + 1) + ' 回合') + '</button>';
    elPanel.innerHTML = h;
    elMask.classList.add('on');
    $('btn-next').addEventListener('click', nextRound);
  }

  function showFinal(noSubmit) {
    /* 评价只看累计分数和"三档总和"的关系；"打不过就输"还没做（框架版没有失败条件） */
    var sumTh = ROUNDS.reduce(function (a, r) { return a + r.th[2]; }, 0);
    var rate = S.total / sumTh;
    var title = rate >= 0.95 ? '井底通明' : rate >= 0.75 ? '看得见底' : '还差一口气';
    var h = '<h2>' + title + '</h2><p class="sub">9 回合结束</p>' +
            '<div class="res-line"><span>累计分数</span><b>' + S.total + ' / ' + sumTh + '</b></div>' +
            '<div class="res-line coin"><span>剩余金币</span><b>' + S.coins + '</b></div>' +
            '<div class="res-line"><span>卡组张数</span><b>' + S.deck.length + '</b></div>' +
            (LB_ON && LB_API !== false && lbName() && !noSubmit ? '<p class="sub" id="lb-send" style="margin-top:10px">正在记入排行榜…</p>' : '') +
            (LB_ON && LB_API !== false ? '<p class="sub" style="margin-top:8px">' +
              '<button class="lbmine" id="lb-goto">看看排行榜（卡组按卡面显示）</button></p>' : '') +
            '<button class="pri big" id="btn-again" style="margin-top:14px;width:100%">再来一局</button>';
    elPanel.innerHTML = h;
    elMask.classList.add('on');
    /* ⚠️ 这颗链接原来被写在「再来一局」的回调里，等于**从来没绑上**（点了不跳）。
       必须跟 btn-again 平级绑，否则通关后想去看看榜单根本点不动。 */
    if ($('lb-goto')) $('lb-goto').addEventListener('click', lbOpen);
    $('btn-again').addEventListener('click', function () {
      hideMask();
      newGame();
      paint();
    });
    /* 通关即上报（只有服务器版 + 有昵称才发）。
       noSubmit：从排行榜回来后重摆这份面板，分数没变，别重复上报。 */
    if (LB_ON && LB_API !== false && lbName() && !noSubmit) lbSubmit();
  }

  /* ---------- 首次进入：问一句要不要走教程（v0.8.25） ---------- */

  /* ⚠️ 必须在 `newGame()` **之后**调：
       ① 身后那一屏备战界面已经画好了，浮层盖上去才不显得空；
       ② newGame 已经把「开局事件」面板摆上来了，这里换掉面板内容后要**还原**它
          （只有 `S.pickOpen` 为真才还原 —— 那是"事件还没选"的唯一标志，
           为假说明事件已经自动生效，本来就不该有面板）。
     ⚠️ "第一次"靠 localStorage 里一个标记记着（`rogue.tutoAsked`）。这是本作**唯一**
        用到本地存储的地方，纯 UX 标记、不参与玩法；file:// 下某些浏览器会抛
        SecurityError，所以读写都包了 try —— 拿不到就当没问过，不报错。 */
  function tutoAsked() {
    try { return localStorage.getItem('rogue.tutoAsked') === '1'; } catch (e) { return false; }
  }
  function markTutoAsked() {
    try { localStorage.setItem('rogue.tutoAsked', '1'); } catch (e) {}
  }

  function askTutoFirst() {
    elPanel.innerHTML =
      '<h2>第一次来？</h2>' +
      '<p class="sub">要不要先走一遍新手教程？只打前 2 回合，大约 3 分钟，' +
        '把事件、摆放、合成、商店、出售都过一遍。</p>' +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
        '<button id="f-skip" style="flex:1">直接开打</button>' +
        '<button class="pri" id="f-go" style="flex:1">先学教程</button>' +
      '</div>';
    elMask.classList.add('on');
    $('f-skip').addEventListener('click', function () {
      markTutoAsked();
      closeOverlay();
    });
    $('f-go').addEventListener('click', function () {
      markTutoAsked();
      location.href = '_tutorial.html';
    });
  }

  /* ---------- 退出：回游戏大厅（v0.8.24 接进大厅时接上） ---------- */

  /* 三种打开方式各走各的：
       ① 被 iframe 嵌着（以后挂在建筑里）→ postMessage 给父页 { type: 'rogue-exit' }
       ② http 起服务（server.js 的 /rogue/）→ 回大厅 '/'
       ③ file:// 双击调试 → 没有大厅可回，刷新重开一局
     ⚠️ 走 http 时 `location.href='/'` 能回大厅，是因为 server.js 把 `/rogue` 302 到了
        `/rogue/`（带尾斜杠）。要是哪天改成直接发 `/rogue`，这里和 `_tutorial.html`
        的相对跳转会一起坏掉，见 server.js 顶部「井底牌局」那段注释。 */
  function leaveGame() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'rogue-exit' }, '*');
        return;
      }
    } catch (e) {}
    if (/^https?:$/.test(location.protocol)) { location.href = '/'; return; }
    location.reload();
  }

  /* ============================================================
     排行榜（v1.10）—— **只有服务器版才有**
     file:// 双击打开时没有后端，整个功能关掉（按钮也藏起来）。

     两张榜（用户 2026-10-27 定）：
       · 总榜：按**最后一回合**的得分排（不是九回合累计）；
       · 流派榜：火球 / 飞弹 / 糖果 各一张 —— "流派"就是开局礼盒锁的那条线（S.shopFilter）。
     两张都记录达成该分数时的卡组（出战槽位从左到右）。

     ⚠️ score 传的是 `S.score`（本回合分），**不是** `S.total` —— 通关面板那一刻
        S.score 还停在最后一回合的分数上（nextRound 进 over 分支前不会清零）。
     ============================================================ */
  /* ⚠️ 前面那句 typeof 守卫是给**单元测试的假 DOM 沙箱**留的：那边没有 location，
     写成裸的 location.protocol 会让整个脚本在 vm 里直接抛错（四个测试文件全挂）。 */
  var LB_ON = (typeof location !== "undefined") && /^https?:$/.test(location.protocol);
  /* 纯静态托管（GitHub Pages / Netlify / Vercel）上协议同样是 https，但**没有后端**。
     探一次 /api/rogue/lb：不是 200 就把排行榜整套关掉 —— 否则点「排行」会跳到不存在的
     `/lb`（404），通关面板还会一直挂着"正在记入排行榜…"。
     LB_API：null = 还没探出来 / true = 有后端 / false = 纯静态。 */
  var LB_API = null;
  function lbHide() {
    LB_API = false;
    var b = $('btn-lb');
    if (b) { b.hidden = true; b.style.display = 'none'; }
  }
  function lbProbe() {
    if (!LB_ON) return;
    try {
      fetch('/api/rogue/lb', { cache: 'no-store' }).then(function (r) {
        if (r && r.ok) LB_API = true; else lbHide();
      }).catch(function () { lbHide(); });
    } catch (e) { lbHide(); }   /* 老浏览器没有 fetch / 假 DOM 沙箱 */
  }
  var LB_KEY = 'rogue.name';
  var LB_SKIP = 'rogue.nameSkip';   /* 点过「先不打榜」的标记 */
  /* 整页排行榜（v0.8.46）：server.js 的 `/rogue/lb` 发的**就是这份 index.html**，
     靠 pathname 认页面。⚠️ 别为了它另建一个 html —— 卡面 CSS 和 cardEl() 都在这里，
     复制一份以后改卡面必然两边走样。file:// 的 pathname 是 index.html，永远不会命中。 */
  var LB_PAGE = (typeof location !== "undefined") && /\/lb\/?$/.test(location.pathname);
  var LB_TABS = ['总榜', '火球', '飞弹', '糖果', '基米', '猛击'];
  var LB_DATA = { total: [], paths: {} };
  var lbTab = '总榜';

  function lbName() {
    try { return (localStorage.getItem(LB_KEY) || "").trim(); } catch (e) { return ""; }
  }
  function lbSaveName(n) {
    try { localStorage.setItem(LB_KEY, n); localStorage.removeItem(LB_SKIP); } catch (e) {}
  }
  /* 点过「先不打榜」就别每次刷新再问一遍（用户 2026-10-27：昵称弹窗太烦）。
     想上榜随时能从「排行」面板里补填昵称 —— 那里现在没有昵称也会画一个按钮。 */
  function lbNameSkipped() {
    try { return localStorage.getItem(LB_SKIP) === "1"; } catch (e) { return false; }
  }
  function lbNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  /* 昵称是玩家输入 —— 拼进 HTML 之前必须转义，不然一个人叫 `<img onerror=...>` 就能搞事 */
  function lbEsc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  /* 首次进入先要个昵称（只有服务器版会调）。next = 之后的流程（问教程）。 */
  function askNameFirst(next) {
    elPanel.innerHTML =
      "<h2>起个名字</h2>" +
      '<p class="sub">排行榜要用，最多 12 个字；之后可以在「排行」里改。</p>' +
      '<input id="lb-input" maxlength="12" placeholder="比如：井底老王" autocomplete="off"' +
        ' style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid #E2DCCC;' +
        'background:#FFFDF8;font-size:14px;color:#4E473F;outline:none">' +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button id="lb-skip" style="flex:0 0 32%">先不打榜</button>' +
        '<button class="pri" id="lb-ok" style="flex:1">就用这个昵称</button>' +
      "</div>";
    elMask.classList.add("on");
    var inp = $("lb-input");
    if (inp && inp.focus) inp.focus();
    var ok = function () {
      var v = ((inp && inp.value) || "").trim().slice(0, 12);
      if (!v) { if (inp && inp.focus) inp.focus(); return; }
      lbSaveName(v); closeOverlay(); next();
    };
    $("lb-ok").addEventListener("click", ok);
    if (inp) inp.addEventListener("keydown", function (e) { if (e.key === "Enter") ok(); });
    $("lb-skip").addEventListener("click", function () {
      try { localStorage.setItem(LB_SKIP, "1"); } catch (e) {}
      closeOverlay(); next();
    });
  }

  /* 页头的「排行」不再开浮层，直接进整页排行榜（v0.8.46）。
     file:// 下 LB_ON 为假，按钮本来就是隐藏的，走不到这里。 */
  function lbOpen() {
    /* ⚠️ 必须等到探测成功（LB_API === true）才跳：`lb` 是服务器的整页路由，
       静态托管下跳过去就是 404，而且玩家这一局的存档会白存。 */
    if (!LB_ON || LB_API !== true) return;
    gameSave();          /* 排行榜是另一个页面，返回时靠这份存档接上这一局 */
    location.href = 'lb';
  }

  /* 一排卡面。老记录里只有 id/name/lv：id 认不出来就退化成文字牌，
     别让一个坏 id 把整行搞没（数据只增不删，旧记录必须还能显示）。 */
  function lbpDeck(deck) {
    var wrap = document.createElement('div');
    wrap.className = 'lbp-deck';
    if (!deck || !deck.length) {
      wrap.innerHTML = '<span class="lbp-nocard">这局没有记录卡组</span>';
      return wrap;
    }
    for (var i = 0; i < deck.length; i++) {
      var c = deck[i] || {};
      if (c.id && CARDS[c.id]) { wrap.appendChild(cardEl(c.id, c.lv || 1)); continue; }
      var chip = document.createElement('span');
      chip.className = 'lbp-nocard';
      chip.textContent = (c.name || c.id || '?') + (c.lv > 1 ? ' ' + c.lv + '★' : '');
      wrap.appendChild(chip);
    }
    return wrap;
  }

  function lbpEmpty(msg) {
    var box = $('lbp-list');
    if (box) box.innerHTML = '<div class="lbempty">' + msg + '</div>';
  }

  function lbpPaint() {
    var box = $('lbp-list');
    if (!box) return;
    var list = (lbTab === '总榜') ? (LB_DATA.total || []) : ((LB_DATA.paths || {})[lbTab] || []);
    var tabs = $('lbp-tabs');
    if (tabs) {
      var bs = tabs.querySelectorAll('button');
      for (var t = 0; t < bs.length; t++) {
        bs[t].className = (bs[t].getAttribute('data-tab') === lbTab) ? 'on' : '';
      }
    }
    if (!list.length) { lbpEmpty('这个榜还没有人上榜'); return; }
    var me = lbName();
    box.innerHTML = '';
    for (var i = 0; i < list.length; i++) {
      var r = list[i] || {};
      var row = document.createElement('div');
      row.className = 'lbp-row' + (i === 0 ? ' top1' : '') + (me && r.name === me ? ' me' : '');
      row.innerHTML = '<div class="lbp-head">' +
        '<span class="lbrk">' + (i + 1) + '</span>' +
        '<span class="lbnm">' + lbEsc(r.name || '无名') + '</span>' +
        (r.path ? '<span class="lbp-path">' + lbEsc(r.path) + '</span>' : '') +
        '<b class="lbsc">' + lbNum(r.score || 0) + '</b>' +
        '</div>';
      row.appendChild(lbpDeck(r.deck));
      box.appendChild(row);
    }
  }

  /* 整页排行榜的外壳：只建一次，之后切标签只重画笔列表 */
  function lbpBoot() {
    document.body.classList.add('lbon');
    /* 排行榜不参与假横屏（竖屏读内容不该被转 90°），这里立刻重算一次状态 */
    updateOrientation();
    document.title = '排行榜 · 井底牌局';
    var el = $('lbpage');
    if (!el) return;
    var who = lbName();
    el.innerHTML =
      '<div class="lbp-top">' +
        '<div><div class="lbp-title">排行榜</div>' +
          '<div class="lbp-sub">名次按<b>最后一回合</b>的得分排；流派榜按开局礼盒锁的那条线' +
            '（火球 / 飞弹 / 糖果）分开排。下面那排卡就是打出这个分数时的出战卡组。</div></div>' +
        '<div class="lbp-act">' +
          '<span class="lbp-me">昵称：<b>' + (who ? lbEsc(who) : '未设置') + '</b> ' +
            '<button class="lbmine" id="lbp-rename">' + (who ? '改名' : '填昵称') + '</button></span>' +
          '<button class="qbtn lbp-back" id="lbp-back">返回游戏</button>' +
        '</div>' +
      '</div>' +
      '<div class="lbtabs lbp-tabs" id="lbp-tabs">' + LB_TABS.map(function (t) {
        return '<button data-tab="' + t + '" class="' + (t === lbTab ? 'on' : '') + '">' + t + '</button>';
      }).join('') + '</div>' +
      '<div class="lbp-list" id="lbp-list"><div class="lbempty">加载中…</div></div>';
    var bs = el.querySelectorAll('#lbp-tabs button');
    for (var i = 0; i < bs.length; i++) {
      bs[i].addEventListener('click', function () {
        lbTab = this.getAttribute('data-tab'); lbpPaint();
      });
    }
    $('lbp-back').addEventListener('click', function () { location.href = './'; });
    $('lbp-rename').addEventListener('click', function () {
      var v = window.prompt('新昵称（最多 12 个字）', lbName());
      if (v === null) return;
      v = (v || '').trim().slice(0, 12);
      if (!v) return;
      lbSaveName(v);
      lbpBoot();      /* 重画：昵称和"自己那行"的高亮都要跟着变 */
    });
    lbLoad();
  }

  function lbLoad() {
    fetch("/api/rogue/lb", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { LB_DATA = d || { total: [], paths: {} }; lbpPaint(); })
      .catch(function () { lbpEmpty("连不上服务器，稍后再试"); });
  }

  /* 通关时提交：**只报最后一回合的分数**（S.score，不是 S.total） */
  function lbSubmit() {
    if (!LB_ON || LB_API === false || !lbName()) return;
    var deck = [];
    for (var i = 0; i < S.slots.length; i++) {
      var cd = S.slots[i] ? cardById(S.slots[i]) : null;
      if (cd) deck.push({ id: cd.id, name: CARDS[cd.id].name, lv: cd.lv || 1 });
    }
    var body = { name: lbName(), score: S.score, path: S.shopFilter || null, deck: deck, round: S.round };
    fetch("/api/rogue/lb", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (d) {
      var el = $("lb-send");
      if (!el) return;
      el.textContent = (d && d.ok)
        ? "已记入排行榜：本回合 " + lbNum(body.score) + " 分" + (d.better ? "（刷新了你的最好成绩）" : "")
        : "这次没能记入排行榜";
    }).catch(function () {
      var el = $("lb-send");
      if (el) el.textContent = "连不上服务器，没记入排行榜";
    });
  }

  function askQuit() {
    var toLobby = /^https?:$/.test(location.protocol);
    /* 三个按钮竖排（v0.8.43 加的「重开本回合」）：
       本地双击和内网联机都挂 —— 它跟协议无关，纯粹是一次状态回滚。
       ⚠️ 教程模式不挂：教程的步骤机是按固定流程推进的，中途回滚会把引导打乱。 */
    elPanel.innerHTML =
      '<h2>退出本局</h2>' +
      '<p class="sub">' + (toLobby
        ? '这一局的进度不会保留，退出后要重新开一局。'
        : '现在是本地双击打开，没有大厅可回 —— 退出等于重开一局。') + '</p>' +
      '<p class="sub" style="margin-top:8px;color:#8A6A2A">' +
        '重开本回合：回到本回合的<b>事件选择</b>，卡组、金币这些退回本回合开始时的样子；' +
        '事件和商店货架会<b>重新抽</b>。' +
      '</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">' +
        '<button id="q-back">继续打这局</button>' +
        (TUTO ? '' : '<button id="q-restart">重开本回合</button>') +
        '<button class="pri" id="q-go">' + (toLobby ? '回到大厅' : '重开一局') + '</button>' +
      '</div>';
    elMask.classList.add('on');
    $('q-back').addEventListener('click', hideMask);
    if (!TUTO) $('q-restart').addEventListener('click', function () { restartRound(); });
    $('q-go').addEventListener('click', leaveGame);
  }

  /* 「教程」按钮：去 `_tutorial.html`（教程入口页 → index.html?tuto=1）。
     ⚠️ 教程是**另开一局**，当前进度不会保留 —— 已经在打就弹个确认，别让人手滑丢掉进度。
     一局还没开始（第 1 回合 + 手上没牌）就直接跳。 */
  function askTuto() {
    var started = S.round > 1 || S.deck.length > 0;
    if (!started) { location.href = '_tutorial.html'; return; }
    elPanel.innerHTML =
      '<h2>去新手教程？</h2>' +
      '<p class="sub">教程会重新开一局，当前这一局的进度不会保留。</p>' +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
        '<button id="t-back" style="flex:1">继续打这局</button>' +
        '<button class="pri" id="t-go" style="flex:1">去教程</button>' +
      '</div>';
    elMask.classList.add('on');
    $('t-back').addEventListener('click', hideMask);
    $('t-go').addEventListener('click', function () { location.href = '_tutorial.html'; });
  }

  /* ---------- 事件 ---------- */

  $('btn-quit').addEventListener('click', askQuit);
  $('sh-btn-quit').addEventListener('click', askQuit);
  $('b-btn-quit').addEventListener('click', askQuit);
  $('btn-fight').addEventListener('click', startBattle);
  $('btn-shop').addEventListener('click', openShop);
  $('btn-prep').addEventListener('click', closeShop);
  $('btn-sell').addEventListener('click', function () { toggleSell(); });
  $('sh-btn-reroll').addEventListener('click', rerollShop);
  $('btn-skip').addEventListener('click', skipBattle);

  /* ============================================================
     卡牌图鉴（浮层）——页头的「图鉴」按钮打开
     ------------------------------------------------------------
     · 卡面复用 cardEl()，数据读 CARDS：和手牌 / 商店是**同一份渲染**，
       别在这儿另写一套卡表（`_codex.html` 里那份是当初的设计稿）
     · 两个筛选：分类（通用 / 飞弹 / 火球）+ 类型（攻击 / 辅助 / 变化），AND 关系
     · 等级只是**浏览用**的临时值（cdxLv），不碰任何真实卡牌状态
     ============================================================ */
  var cdxLv = 1, cdxMinor = '全部', cdxMajor = '全部';
  var CDX_MINOR = ['全部', '通用', '飞弹', '火球', '糖果', '基米', '猛击'];
  var CDX_MAJOR = ['全部', '攻击', '辅助', '变化'];

  function cdxIds() {
    return Object.keys(CARDS).filter(function (id) {
      var c = CARDS[id];
      if (cdxMinor !== '全部' && c.minor !== cdxMinor) return false;
      if (cdxMajor !== '全部' && c.major !== cdxMajor) return false;
      return true;
    });
  }
  function paintCdxFilters() {
    var el = $('cdx-fl');
    if (!el) return;
    function row(list, cur, key) {
      return list.map(function (v) {
        return '<button class="cdxchip' + (v === cur ? ' on' : '') + '" data-' + key +
          '="' + v + '">' + v + '</button>';
      }).join('');
    }
    el.innerHTML = '<span class="cdxlab">分类</span>' + row(CDX_MINOR, cdxMinor, 'minor') +
      '<span class="cdxsep"></span><span class="cdxlab">类型</span>' + row(CDX_MAJOR, cdxMajor, 'major');
  }
  function paintCdx() {
    var grid = $('cdx-grid');
    if (!grid) return;
    var lvEl = $('cdx-lv');
    if (lvEl) Array.prototype.forEach.call(lvEl.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', parseInt(b.getAttribute('data-lv'), 10) === cdxLv);
    });
    var ids = cdxIds();
    grid.innerHTML = '';
    ids.forEach(function (id) { grid.appendChild(cardEl(id, cdxLv)); });
    if (!ids.length) grid.innerHTML = '<div class="cdxempty">这个分类下没有卡牌</div>';
    var n = $('cdx-n');
    if (n) n.textContent = ids.length + ' / ' + Object.keys(CARDS).length + ' 张';
    paintCdxFilters();
  }
  function cdxOpen() {
    var el = $('cdx');
    return !!(el && el.classList.contains('on'));
  }
  function openCodex() {
    var el = $('cdx');
    if (!el) return;
    el.classList.add('on');
    paintCdx();
  }
  function closeCodex() {
    var el = $('cdx');
    if (el) el.classList.remove('on');
  }

  /* 图鉴里的交互：分类 / 类型 chip、等级、关闭 */
  $('cdx-fl').addEventListener('click', function (e) {
    var b = e.target.closest('.cdxchip');
    if (!b) return;
    if (b.hasAttribute('data-minor')) cdxMinor = b.getAttribute('data-minor');
    if (b.hasAttribute('data-major')) cdxMajor = b.getAttribute('data-major');
    paintCdx();
  });
  $('cdx-lv').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lv]');
    if (!b) return;
    cdxLv = parseInt(b.getAttribute('data-lv'), 10) || 1;
    paintCdx();
  });
  $('cdx-x').addEventListener('click', closeCodex);
  $('cdx').addEventListener('click', function (e) {
    if (e.target === this) closeCodex();     /* 点空白关，点面板不关 */
  });
  $('btn-codex').addEventListener('click', openCodex);
  $('btn-tuto').addEventListener('click', askTuto);
  /* 排行榜按钮：只有服务器版、且不在教程模式里才有意义。
     先探一次后端：纯静态托管（GitHub Pages 等）探完会把按钮自己收掉。 */
  lbProbe();
  if (LB_ON && !TUTO) $('btn-lb').addEventListener('click', function () { lbOpen(); });
  else { var lbBtn = $('btn-lb'); if (lbBtn) lbBtn.style.display = 'none'; }
  $('sh-btn-codex').addEventListener('click', openCodex);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (cdxOpen()) { closeCodex(); return; }      /* 图鉴开着就先关图鉴，别顺手退商店 */
    if (S.phase === 'battle') skipBattle();
    else if (S.phase === 'shop') closeShop();     /* 商店里按 Esc 回备战，和点"备战"一样 */
    else if (S.sellMode) { S.sellMode = false; paint(); }   /* 出售模式先退出 */
    else if (S.targeting) { S.targeting = 0; S.pending = 0; paint(); }   /* 取消选中的升级卡 */
  });

  /* ============================================================
     五、实验室（LAB）—— 只在 `index.html?lab=1` 时启用
     ------------------------------------------------------------
     目的：不花金币、不抽卡，直接拿到**任意卡牌 / 任意星级**，把组合丢进
     真实的战斗流程里看效果。入口页 `_lab.html` 会自动跳到 ?lab=1。

     ⚠️ 一条铁律：**这里不许出现任何伤害 / 连击 / 生效条件的计算**。
        面板只做两件事 —— 造牌（addCard / mergeCards）和把 resolve() 的结果摆出来。
        一旦在面板里自己算一遍，实验室和实战就会分叉，测出来的东西是假的。

     ⚠️ 战斗 / 结算阶段是只读的：加卡、升星、铺位一律被挡住，
        只有「回合」和「重开」能硬切（切之前会作废排队的演出）。
     ============================================================ */
  /* typeof 守卫：数值模拟脚本（_sim_cards.js）在裸 vm 里跑这段，没有 location。
     ?lab=1 和 #lab=1 都认（file:// 下改 hash 更方便）。 */
  var LAB = (typeof location !== 'undefined') &&
    /lab=1/.test((location.search || '') + (location.hash || ''));

  /* 新手教程：真引擎 + 引导气泡（见文件末尾「新手教程」一节）。
     ⚠️ 教程**不另做一套战斗逻辑** —— 只是把前两回合的开局固定住 + 盖一层气泡。 */
  var TUTO = (typeof location !== 'undefined') &&
    /tuto=1/.test((location.search || '') + (location.hash || ''));

  var labPrevHtml = '';      /* 预览区上次的 HTML，变了才重写，免得演出时闪 */

  function labEl(id) { return document.getElementById(id); }

  function labMsg(txt) {
    var el = labEl('lab-msg');
    if (!el) return;
    el.textContent = txt;
    el.classList.add('on');
    clearTimeout(labMsg.t);
    labMsg.t = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }

  function labMount() {
    var box = labEl('labp');
    if (!box) return;
    box.classList.add('on');
    box.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lab-on');

    /* 回合按钮：1..9 */
    var r = '';
    for (var i = 1; i <= TOTAL_ROUNDS; i++) {
      r += '<button data-lab="round" data-n="' + i + '">' + i + '</button>';
    }
    labEl('lab-rounds').innerHTML = r;

    /* 卡池：按小类分组（通用 / 飞弹 / 火球），保持卡表里的定义顺序 */
    var groups = [], byMinor = {};
    Object.keys(CARDS).forEach(function (id) {
      var g = CARDS[id].minor || '其他';
      if (!byMinor[g]) { byMinor[g] = []; groups.push(g); }
      byMinor[g].push(id);
    });
    labEl('lab-pool').innerHTML = groups.map(function (g) {
      return '<div class="lgrp">' + g + '</div>' + byMinor[g].map(function (id) {
        var c = CARDS[id];
        /* noLv 卡只有 1 星这一个选项，别摆出点不动的 2 / 3 */
        var st = '<span class="st" data-give="' + id + '" data-lv="1" title="加入 1 星">1</span>';
        if (!c.noLv) {
          st += '<span class="st" data-give="' + id + '" data-lv="2" title="加入 2 星">2</span>' +
                '<span class="st" data-give="' + id + '" data-lv="3" title="加入 3 星">3</span>';
          /* 四星（v0.8.31）：只有 maxLv:4 的卡才给这个按钮，别让所有卡都能造出 4 星 */
          if (maxLvOf(c) >= 4) {
            st += '<span class="st st4" data-give="' + id + '" data-lv="4" ' +
                  'title="加入 4 星（额外释放一次）">4</span>';
          }
        }
        return '<div class="lcard" data-q="' + (c.q || 'gray') + '">' +
          '<span class="nm" data-give="' + id + '" data-lv="1" title="' + c.name + '">' +
            c.name + '</span>' + st + '</div>';
      }).join('');
    }).join('');

    box.addEventListener('click', labClick);
    labEl('lab-fold').addEventListener('click', function () {
      /* 收起只是缩成胶囊，`on` 一直留着 —— 否则面板藏起来后再也点不回来 */
      var shut = box.classList.toggle('shut');
      document.body.classList.toggle('lab-on', !shut);
      this.textContent = shut ? '展开' : '收起';
    });
    labEl('lab-quit').addEventListener('click', function () {
      location.href = location.pathname;      /* 去掉 ?lab=1，回到正常游戏 */
    });
    labPaint();
  }

  function labClick(e) {
    var t = e.target, hit;
    if ((hit = t.closest && t.closest('[data-give]'))) {
      return labGive(hit.getAttribute('data-give'), parseInt(hit.getAttribute('data-lv'), 10));
    }
    if ((hit = t.closest && t.closest('[data-star]'))) {
      return labStar(parseInt(hit.getAttribute('data-star'), 10));
    }
    if (!(hit = t.closest && t.closest('[data-lab]'))) return;
    var act = hit.getAttribute('data-lab');
    /* `data-n="max"` = 直接顶到当前上限（实验室「拉满」用），别写死数字，
       否则以后改 MAX_CHARGE 又会漏掉这个按钮。 */
    var rawN = hit.getAttribute('data-n');
    var n = rawN === 'max' ? MAX_CHARGE : (parseInt(rawN, 10) || 0);

    if (act === 'round') return labGotoRound(n);
    if (act === 'coin') { S.coins += n; paint(); return labMsg('金币 ' + S.coins); }
    if (act === 'charge') {
      if (!n) S.charge = 0;        /* n=0 是「清空」，不是「加 0」 */
      else addCharge(n);
      paint();
      return labMsg('蓄能 ' + S.charge + ' 层（+' + Math.floor(S.charge / 10) + ' 连击）' +
        (S.charge >= MAX_CHARGE ? ' · 已满' : ''));
    }
    if (act === 'power') {
      /* 加的是**永久**那份：实验室要「设一次就不用再管」，跳回合也不清。 */
      if (!n) S.power = 0;
      else S.power = Math.max(0, Math.min(MAX_POWER - (S.powerRound || 0), S.power + n));
      paint();
      return labMsg('力量 ' + powerNow() + '（永久 ' + S.power + ' / 本回合 ' + S.powerRound + '）');
    }
    if (act === 'fill') return labFill();
    if (act === 'clearSlots') return labClearSlots();
    if (act === 'clearDeck') return labClearDeck();
    if (act === 'restart') { newGame(); return labMsg('已重开（卡组回到起始 4 张）'); }
  }

  /* 造一张卡进手牌。noLv 卡强制 1 星（和卡表一致）。 */
  function labGive(id, lv) {
    if (!CARDS[id]) return;
    if (S.phase === 'battle') return labMsg('战斗中不能改卡组 —— 先跳过或打完');
    var c = CARDS[id];
    var L = c.noLv ? 1 : Math.max(1, Math.min(maxLvOf(c), lv || 1));
    addCard(id, L);
    paint();
    labMsg('+' + c.name + '（' + L + ' 星）');
  }

  /* 升星 = **补一张同名同级再走真实的 mergeCards()**。
     这样 starCoin（升星给币）、starGain（火焰瓶给卡）、starTo（进化链）
     全都走实战那条路，不在实验室里另写一套。 */
  function labStar(slotIdx) {
    if (S.phase !== 'prep') return labMsg('只能在备战阶段升星');
    var uid = S.slots[slotIdx];
    var c = uid ? cardById(uid) : null;
    if (!c) return;
    var def = CARDS[c.id];
    if ((c.lv || 1) >= maxLvOf(def)) return labMsg('「' + def.name + '」已经是 ' + maxLvOf(def) + ' 星了');
    if (def.noLv && !def.starTo) return labMsg('「' + def.name + '」不参与合成（消耗品）');
    var lvBefore = c.lv || 1, nameBefore = def.name;
    var extra = addCard(c.id, lvBefore);
    if (!mergeCards(uid, extra)) return labMsg('这张卡现在合成不了');
    var now = cardById(uid);
    labMsg('合成：' + nameBefore + ' ' + lvBefore + ' 星 → ' +
      CARDS[now.id].name + ' ' + (now.lv || 1) + ' 星');
  }

  /* 切回合：决定槽位数（round+1，封顶 6）和分数线，用来测同一套卡在不同回合的表现 */
  function labGotoRound(n) {
    battleSeq++;                 /* 作废还在排队的演出步，避免迟到的 step 追上来 */
    clearTimers();
    hideMask();
    S.round = Math.max(1, Math.min(TOTAL_ROUNDS, n || 1));
    S.phase = 'prep';
    S.score = 0;
    S.powerRound = 0;            /* 跳回合等同过回合：临时力量清空，永久那份留着 */
    S.step = -1;
    S.pending = 0;
    S.targeting = 0;
    S.sellMode = false;
    S.earnCoins = 0;
    S.lastRes = null;
    for (var i = 0; i < S.slots.length; i++) S.slots[i] = null;
    /* 事件跟实战一样重抽（跳回合后照样要二选一），shopFilter 保留 */
    S.event = null;
    S.events = [];
    S.shopOn = false;
    S.freeReroll = 0;
    S.buyCopy = 0;
    S.shopMinQ = null;
    S.shop = null;
    paint();
    snapRound();             /* 跳回合也算"这一回合的开始"，重开本回合回到跳跃点 */
    openEvents();            /* 会再 paint 一次，面板盖在备战屏上 */
    labMsg('第 ' + S.round + ' 回合 · ' + slotCap() + ' 个槽位');
  }

  /* 把手牌依次塞进空槽（不动已经放好的） */
  function labFill() {
    if (S.phase !== 'prep') return labMsg('只能在备战阶段铺位');
    var cap = slotCap(), hand = handCards(), k = 0;
    for (var i = 0; i < cap; i++) {
      if (S.slots[i]) continue;
      if (k >= hand.length) break;
      S.slots[i] = hand[k++].uid;
    }
    paint();
    if (!k) labMsg('没有空槽或没有手牌了');
  }

  function labClearSlots() {
    if (S.phase === 'battle') return labMsg('战斗中不能清槽');
    for (var i = 0; i < S.slots.length; i++) S.slots[i] = null;
    S.pending = 0; S.targeting = 0;
    paint();
  }

  /* 清空卡组：连槽位一起清（否则槽里留着指向已删卡的 uid） */
  function labClearDeck() {
    if (S.phase === 'battle') return labMsg('战斗中不能清卡组');
    S.deck = [];
    for (var i = 0; i < S.slots.length; i++) S.slots[i] = null;
    S.pending = 0; S.targeting = 0; S.sellMode = false;
    paint();
    labMsg('卡组已清空');
  }

  /* 干跑预览：用**和 paintPrep 完全相同的参数**跑 resolve（只传蓄能、不传 rng）。
     不传 rng 时 rollGain 恒成功 = 上界，和卡面 deadAt 同源 —— 不传才能保证
     预览和「卡面变灰」看到的是同一个世界。 */
  function labPreview() {
    var ord = order();
    if (!ord.some(function (x) { return !!x; })) {
      return { html: '<div class="lprev"><div class="empty">槽位是空的 —— 先在卡池点几张，再点「铺满槽位」</div></div>',
        dmg: 0, tier: 0 };
    }
    var res = resolve(ord, { charge: S.charge, power: powerNow() });
    var th = tiersOf(S.round);
    var n = tierCount(res.dmg, S.round);

    var h = res.log.map(function (e) {
      /* ⚠️ 幻化卡在 resolve 里已经被替换成目标卡（e.id / e.name / e.lv 都是目标卡的），
         所以这里要**从槽位反查真实那张卡**来判断「能不能补一张同名卡升星」，
         否则会给幻化卡挂一个点了必然失败的 ↑。 */
      var realUid = S.slots[e.slot];
      var real = realUid ? cardById(realUid) : null;
      var rdef = real ? CARDS[real.id] : null;
      var realLv = real ? (real.lv || 1) : 1;
      var isCopy = !!e.copyTo;
      var val = e.dmg > 0
        ? (e.times > 1 ? e.per + '×' + e.times + '=' + e.dmg : String(e.dmg))
        : '—';
      /* noLv 卡通常不能合成，但**带 starTo 的进化链例外**（小火苗 → 新生之焰），
         判断要和 canMerge() 保持一致，否则链上的卡在这里就没有升星入口。 */
      var canStar = rdef && (rdef.starTo || !rdef.noLv) && realLv < maxLvOf(rdef);
      var title = (isCopy && rdef)
        ? '<span class="n">' + rdef.name + ' → ' + e.name +
          ' <i style="font-style:normal;color:#C2BCAE">' + (e.lv || 1) + '★</i></span>'
        : '<span class="n">' + e.name +
          ' <i style="font-style:normal;color:#C2BCAE">' + (e.lv || 1) + '★</i></span>';
      return '<div class="pl' + (e.dead ? ' dead' : '') + '">' +
        '<span class="no">' + (e.slot + 1) + '</span>' +
        title +
        '<span class="d' + (e.dmg > 0 ? '' : ' zero') + '">' + val + '</span>' +
        (canStar ? '<span class="up" data-star="' + e.slot + '" title="补一张同级合成升星">↑</span>' : '') +
        (e.note ? '<span class="nt">' + e.note + '</span>' : '') +
        '</div>';
    }).join('');

    h += '<div class="lsum"><b>' + res.dmg + '</b><span>分 · ' + n + ' / 3 档 · 共得 ' +
      (res.coins + coinsFor(res.dmg, S.round)) + ' 币</span></div>';
    h += '<div class="lsum sm"><span>分数线 ' + th.join(' / ') +
      (res.gain && res.gain.length
        ? ' · 结算后获得 ' + res.gain.map(function (g) { return CARDS[g.id].name; }).join('、')
        : '') + '</span></div>';
    return { html: '<div class="lprev">' + h + '</div>', dmg: res.dmg, tier: n };
  }

  function labPaint() {
    if (!LAB || !S) return;
    var rounds = labEl('lab-rounds');
    if (!rounds) return;
    var btns = rounds.children;
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].classList) btns[i].classList.toggle('on', (i + 1) === S.round);
    }
    var coin = labEl('lab-coin'), charge = labEl('lab-charge'), powerEl = labEl('lab-power');
    if (coin) coin.textContent = S.coins;
    if (charge) charge.textContent = S.charge;
    if (powerEl) powerEl.textContent = powerNow();   /* 永久 + 本回合，和备战页徽章一致 */

    var pv = labPreview();
    if (pv.html !== labPrevHtml) {
      labPrevHtml = pv.html;
      var box = labEl('lab-prev');
      if (box) box.innerHTML = pv.html;
    }
    /* 常驻摘要 */
    var totalEl = labEl('lab-total'), tierEl = labEl('lab-tier'), slotEl = labEl('lab-slotnum');
    var filled = S.slots.slice(0, slotCap()).filter(function (x) { return !!x; }).length;
    if (totalEl) totalEl.textContent = pv.dmg;
    if (tierEl) tierEl.textContent = pv.tier + ' / 3 档';
    if (slotEl) slotEl.textContent = filled + ' / ' + slotCap() + ' 槽';
  }

  /* ============================================================
     新手教程（?tuto=1）—— 真引擎 + 一层气泡
     ------------------------------------------------------------
     · **不复制任何战斗逻辑**：还是 newGame → 选事件 → 放卡 → 出战 → 结算。
       教程只做两件事：把前两回合的开局钉死（礼盒 / 强制开商店，见 openEvents），
       再盖一层引导气泡（本段）。
     · 每一步 = { hi: 要高亮的 CSS 选择器（null = 整屏压暗居中），txt, adv }
       adv = 'next'（玩家点「下一步」）/ 'end'（结束页）/ function（条件满足自动过）
     · 高亮框每 300ms 按 getBoundingClientRect 重算 —— paint() 会整块重建

  var tutoStep = -1, tutoTimer = 0, tutoGave = false, tutoEnt = {};

        判定只读游戏状态（选过事件 / 点过卡 / 放过槽 / 打过一场 / 买过 / 刷过 / 合过 / 卖过…）。

        （比如"手牌这一步"要求玩家先点一张卡）。 */
  var TUTO_STEPS = [
    { hi: '#mask .evs', adv: function () { return !!S.event; }, txt:

    { hi: '#btn-fight', adv: function () { return S.phase === 'battle'; }, txt:
      '<b>④ 出战</b><br>按槽位从左到右依次结算，<b>打多少伤害就是多少分</b>。点它开始。' },
    { hi: '.arena', adv: function () { return S.phase === 'result'; }, txt:
      '<b>⑤ 战斗演出</b><br>每次攻击都是「前摇 → 爆发 → 命中停顿」，本场<b>最后一击</b>是穿刺特写。<br>' +
      '嫌慢可以按「跳过演出」。' },
    { hi: '#panel', adv: function () { return S.round === 2 && S.phase === 'prep'; }, txt:
      '<b>⑥ 结算</b><br>分数够三档就给金币，金币留到下回合买卡。<br><b>点「下一回合」</b>。' },
    { hi: '#btn-shop', adv: function () { return S.phase === 'shop'; }, txt:
      '<b>⑦ 商店（第 2 回合）</b><br>买卡 / 刷新 / 合成升星都在这儿。<b>点「商店」进去</b>。' },
    { hi: '#shelf', adv: function () { return S.deck.length > tutoEnt.deck; }, txt:
      '<b>⑧ 货架</b><br>能和你手里的牌<b>合成</b>的那一格会亮金框 + 挂「可合成」。<br>' +
      '<b>买一张</b>（点货格下面的「买下」）。' },
    { hi: '#sh-btn-reroll', adv: function () { return S.shop !== tutoEnt.shop; }, txt:
      '<b>⑨ 刷新</b><br>货架不满意就点「刷新」：<b>固定 1 币</b>；有免费次数时先扣次数、不花钱。<br>' +
      '三格品质按回合查概率表，越往后越容易出紫卡 / 金卡。<b>点一下刷新试试</b>。' },
    { hi: '#btn-prep', adv: function () { return S.phase === 'prep'; }, txt:
      '<b>⑩ 回备战</b><br><b>点「备战」</b>回去，把新买的卡放进槽位。' },
    { hi: '#hand .cf', allow: '#hand', ensurePair: true, adv: function () { return !tutoHasPair(); }, txt:
      '<b>⑪ 合成升星</b><br>把一张卡<b>拖到另一张同名同星</b>的卡上松手 → 合成，等级 +1（伤害直接翻倍）。<br>' +
      '（手里没对子的话，这一格会给你补一张同名的。）' },
    { hi: '#sellzone', free: true, sell: true, adv: tutoSold, txt:
      '<b>⑫ 出售</b><br>按住一张卡往拖，底部中间的<b>出售区</b>会浮出来并标明能卖多少，拖进去就卖掉。<br>' +
      '拿那张教学卡练手正好。（触屏：点左下角「出售」再点卡。）' },
    /* ⚠️ 这一步的允许区必须**带上手牌和槽位**：nextRound() 每回合都会把槽位清空，
        第 2 回合进来时槽里一张牌都没有，「出战」是灰的、点不动。
        只允许点「出战」的话就会死在这一步（用户 2026-10-26 报的就是这个）。
        顺便这也是该教的机制：**每回合都要重新构筑一次。** */
    { hi: '#btn-fight', allow: '#hand, #slots, #btn-fight',
      adv: function () { return S.phase === 'battle'; }, txt:
      '<b>⑬ 第 2 回合出战</b><br><b>槽位每回合都会清空</b> —— 先把卡重新放进去（点卡 → 点槽位），' +
      '再点「出战」。看看新买的卡 / 合成后的卡怎么改变输出。' },
    { hi: '.arena', adv: function () { return S.phase === 'result'; }, txt:
      '<b>打完这一场，教程就结束了。</b><br>等演出收尾（或点「跳过演出」）。' },
    { hi: null, adv: 'end', txt:
      '<b>教程结束</b><br>后面还有 7 个回合：事件更多、槽位到 6 格、商店会出紫卡和金卡。<br>' +
      '剩下的就靠你自己摸了。' }
  ];

  function slotFilled() { return S.slots.some(function (x) { return !!x; }); }
  /* "看过手牌"这一步的动作 = 玩家点起一张卡（或者直接拖进槽位也算，拖的时候不经过 pending） */
  function tutoPicked() { return !!S.pending || !!S.targeting || slotFilled(); }
  /* "出售过了" = 卡变少，或者金币变多（卖积蓄系不给币但会给蓄能，卡照样少一张） */
  function tutoSold() {
    return S.deck.length < tutoEnt.deck || S.coins > tutoEnt.coins;
  }


  function tutoEl(sel) {
    try { return sel ? document.querySelector(sel) : null; } catch (e) { return null; }
  }
  /* 选择器可以是列表（逗号分隔）—— 取它们的**并集包围盒**当允许区。
     多块区域的真实并集做不出来（四块矩形夹洞只支持一个洞），
     但这些区域本来就挨着（手牌在槽位上面），包围盒够用。 */
  function tutoRect(sel) {
    if (!sel) return null;
    var list;
    try { list = document.querySelectorAll(sel); } catch (e) { return null; }
    var r = null;
    for (var i = 0; i < list.length; i++) {
      var b = localRect(list[i]);          /* 假横屏时 rect 要换成 body 本地坐标 */
      if (!b.width || !b.height) continue;
      if (!r) r = { left: b.left, top: b.top, right: b.right, bottom: b.bottom };
      else {
        r.left = Math.min(r.left, b.left); r.top = Math.min(r.top, b.top);
        r.right = Math.max(r.right, b.right); r.bottom = Math.max(r.bottom, b.bottom);
      }
    }
    return r;
  }
  /* 手里有没有一对「同名同星」的卡（能拖到一起合成）—— 用 canMerge 探针，
     别在这儿另写一套"同名同级"比较（进化链 / 满级判定会和拖拽分叉）。 */
  function tutoHasPair() {
    if (!S || !S.deck) return false;
    for (var i = 0; i < S.deck.length; i++) {
      for (var j = i + 1; j < S.deck.length; j++) {
        if (canMerge(S.deck[i], S.deck[j])) return true;
      }
    }
    return false;
  }
  /* 讲"出售"那一步把出售区临时显出来 —— 它平时是 visibility:hidden（只有拖动时才出现），
     不显出来玩家根本看不到要往哪儿拖。 */
  function tutoSellHint(on) {
    var z = $('sellzone');
    if (!z) return;
    z.style.visibility = on ? 'visible' : '';
    z.style.opacity = on ? '1' : '';
  }
  /* 教学用的那张卡：选完开局事件之后，额外塞一张**固定的**「强力打击 1★」。
     用途是给玩家随便拖着玩 / 卖掉练手 —— 礼盒发的那三张是随机牌，不该被当试验品。
     ⚠️ 只在第 1 回合、且已经选过事件时发一次（tutoGave 兜住，轮询反复跑也不会多发）。 */
  var TUTO_GIFT = { id: 'hit', lv: 1 };
  function tutoGiveCard() {
    if (tutoGave || !S || S.round !== 1 || !S.event) return;
    tutoGave = true;
    addCard(TUTO_GIFT.id, TUTO_GIFT.lv);
    paint();
  }

  /* 挡操作：四块矩形夹出一个"回"字，只把 r 那块留空。
     r = null 表示整屏都挡（纯讲解步）。 */
  function tutoBlock(r) {
    var blk = $('tuto-blk');
    if (!blk) return;
    var vb = viewBox(), vw = vb.w, vh = vb.h;   /* 假横屏时是 body 本地宽高 */
    var t = blk.querySelector('.bt'), b = blk.querySelector('.bb'),
        l = blk.querySelector('.bl'), rt = blk.querySelector('.br');
    if (!r) {
      t.style.cssText = 'left:0;top:0;width:' + vw + 'px;height:' + vh + 'px';
      b.style.cssText = l.style.cssText = rt.style.cssText = 'left:0;top:0;width:0;height:0';
      return;
    }
    var x1 = Math.max(0, r.left - 8), y1 = Math.max(0, r.top - 8);
    var x2 = Math.min(vw, r.right + 8), y2 = Math.min(vh, r.bottom + 8);
    t.style.cssText = 'left:0;top:0;width:' + vw + 'px;height:' + y1 + 'px';
    b.style.cssText = 'left:0;top:' + y2 + 'px;width:' + vw + 'px;height:' + Math.max(0, vh - y2) + 'px';
    l.style.cssText = 'left:0;top:' + y1 + 'px;width:' + x1 + 'px;height:' + (y2 - y1) + 'px';
    rt.style.cssText = 'left:' + x2 + 'px;top:' + y1 + 'px;width:' + Math.max(0, vw - x2) + 'px;height:' + (y2 - y1) + 'px';
  }

  /* 把高亮框贴到目标上、气泡摆在它下面（放不下就摆上面；再不行贴顶） */
  function tutoPlace() {
    var st = TUTO_STEPS[tutoStep];
    var hi = $('tuto-hi'), bub = $('tuto-bub'), blk = $('tuto-blk');
    if (!st || !hi || !bub) return;
    var vb = viewBox(), vw = vb.w, vh = vb.h;   /* 假横屏时是 body 本地宽高 */
    var rAnchor = tutoRect(st.hi);
    var rAllow = st.free ? null : (tutoRect(st.allow || st.hi) || rAnchor);

    /* 挡操作：free 的步骤不挡（要拖卡，路径穿过大片空白） */
    if (blk) {
      blk.classList.toggle('on', !st.free);
      if (!st.free) tutoBlock(rAllow);
    }
    /* 高亮 = **允许操作的区域**（两者不一致时，亮的就是能点的地方） */
    var rLit = rAllow || rAnchor;
    if (!rLit) {
      hi.className = 'tuto-hi';
      hi.style.cssText = '';
      hi.className = 'tuto-hi on';
      hi.style.left = '50%'; hi.style.top = '50%';
      hi.style.width = '1px'; hi.style.height = '1px';
      hi.style.boxShadow = '0 0 0 9999px rgba(46,40,32,.45)';
      bub.style.left = Math.round((vw - bub.offsetWidth) / 2) + 'px';
      bub.style.top = Math.round((vh - bub.offsetHeight) / 2) + 'px';
      return;
    }
    hi.style.boxShadow = '';
    hi.className = 'tuto-hi on';
    hi.style.left = (rLit.left - 6) + 'px';
    hi.style.top = (rLit.top - 6) + 'px';
    hi.style.width = (rLit.right - rLit.left + 12) + 'px';
    hi.style.height = (rLit.bottom - rLit.top + 12) + 'px';

    var rB = rAnchor || rLit;
    var bw = bub.offsetWidth, bh = bub.offsetHeight;
    var x = Math.min(Math.max(8, rB.left + (rB.right - rB.left) / 2 - bw / 2), vw - bw - 8);
    var y = rB.bottom + 14;
    if (y + bh > vh - 8) y = rB.top - bh - 14;
    if (y < 8) y = Math.min(vh - bh - 8, 24);
    bub.style.left = Math.round(x) + 'px';
    bub.style.top = Math.round(y) + 'px';
  }

  function tutoRender() {
    var st = TUTO_STEPS[tutoStep], bub = $('tuto-bub');
    if (!st || !bub) return;
    /* "合成"这一步必须保证有牌可合：手里没有同名同星的一对，就**补两张一样的**。
       玩家可能在上一步顺手把对子合了、或者卖掉了一张，光靠"开局补一张"兜不住。 */
    if (st.ensurePair && !tutoHasPair()) {
      addCard(TUTO_GIFT.id, TUTO_GIFT.lv);
      addCard(TUTO_GIFT.id, TUTO_GIFT.lv);
      paint();
    }
    /* 记下这一步开始时的状态，用来判断"玩家做成这件事了没有" */
    tutoEnt = { deck: S.deck.length, shop: S.shop, round: S.round, phase: S.phase, coins: S.coins };
    bub.hidden = false;
    $('tuto-stp').textContent = st.adv === 'end' ? '教程结束'
      : ('第 ' + (tutoStep + 1) + ' / ' + TUTO_STEPS.length + ' 步');
    $('tuto-txt').innerHTML = st.txt;
    /* 只有结束页有按钮（那是"动作"，不是"下一步"） */
    $('tuto-next').hidden = st.adv !== 'end';
    tutoSellHint(!!st.sell);
    tutoPlace();
  }

  function tutoNext() {
    var st = TUTO_STEPS[tutoStep];
    if (st && st.adv === 'end') { location.href = 'index.html'; return; }
    if (tutoStep < 0) return;
    tutoStep++;
    if (tutoStep >= TUTO_STEPS.length) { tutoEnd(); return; }
    tutoRender();
  }

  function tutoEnd() {
    if (tutoTimer) { clearInterval(tutoTimer); tutoTimer = 0; }
    tutoStep = -1;
    var hi = $('tuto-hi'), bub = $('tuto-bub'), blk = $('tuto-blk');
    if (hi) { hi.className = 'tuto-hi'; hi.style.cssText = ''; }
    if (bub) bub.hidden = true;
    if (blk) blk.classList.remove('on');
    tutoSellHint(false);
  }

  function tutoTick() {
    if (tutoStep < 0) return;
    tutoGiveCard();          /* 选完事件后补发那张教学卡（只发一次） */
    var st = TUTO_STEPS[tutoStep];
    tutoPlace();             /* 每帧重算：paint() 会重建 DOM，缓存 rect 会错位 */
    if (st.adv === 'end') return;
    /* 只认玩家动作：没有任何"到点自动过"的兜底 —— 卡住就说明这一步的判定写错了，
       要修判定，不是加定时器。 */
    if (typeof st.adv === 'function' && st.adv()) tutoNext();
  }

  function tutoBoot() {
    $('tuto-next').addEventListener('click', tutoNext);   /* 只有结束页那颗按钮会用到 */
    $('tuto-skip').addEventListener('click', function () { location.href = 'index.html'; });
    window.addEventListener('resize', function () { if (tutoStep >= 0) tutoPlace(); });
    tutoStep = 0;
    tutoRender();
    tutoTimer = setInterval(tutoTick, 250);
  }

  /* 浏览器后退直接命中 bfcache 时页面根本没重载 —— 手里这份是活的、比存档新，
     把存档清掉，免得之后某次刷新把更早的进度搬回来。 */
  window.addEventListener('pageshow', function (e) {
    if (e && e.persisted) {
      try { sessionStorage.removeItem(RESUME_KEY); sessionStorage.removeItem(SAVE_KEY); } catch (err) {}
    }
  });

  /* 从排行榜回来的话整份还原，否则开新局 */
  var resumed = gameRestore();
  if (!resumed) newGame();
  paint();
  if (resumed && S.phase === 'over') showFinal(true);   /* 通关后去看榜再回来：把结算面板摆回来 */
  if (LAB) labMount();      /* 面板要等 S 建好再挂，否则首次 labPaint() 拿不到状态 */
  if (TUTO) tutoBoot();     /* 教程要在 newGame 之后挂（开局事件面板已经摆好了） */
  /* 首次进入自动问一句要不要走教程：教程 / 实验室模式里不问，问过一次就不再问 */
  /* 首次进入：**先要昵称**（只有服务器版），再问要不要走教程。
     顺序不能反 —— 教程询问会接管面板并把事件面板还原，昵称放后面会盖掉它。 */
  var afterName = function () {
    if (!LAB && !TUTO && !tutoAsked()) { askTutoFirst(); return; }
    closeOverlay();      /* 没有别的要问了 → 回到事件面板（或备战屏） */
  };
  if (LB_PAGE) lbpBoot();      /* 整页排行榜：不弹昵称/教程，直接把榜单摆出来 */
  else if (resumed) {
    /* 回到中途的一局：昵称 / 教程早问过了，只把该露的界面摆正。
       ⚠️ 通关那一下不能走 closeOverlay —— 它会把刚摆好的结算面板关掉。 */
    if (S.phase !== 'over') closeOverlay();
  }
  else if (LAB || TUTO || !LB_ON || lbName() || lbNameSkipped()) afterName();
  else askNameFirst(afterName);
})();
</script>
